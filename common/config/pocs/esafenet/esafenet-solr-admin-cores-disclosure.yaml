id: esafenet-solr-admin-cores-disclosure

info:
  name: 亿赛通文档安全管理系统 /solr/admin/cores - 信息泄露
  author: cmz
  severity: medium
  description: 亿赛通文档安全管理系统/solr/admin/cores信息泄露
  metadata:
    verified: true
    fofa-query: body="CDGServer3" || title="电子文档安全管理系统" || cert="esafenet" || body="/help/getEditionInfo.jsp"
    hunter-query: app.name="ESAFENET 亿赛通文档安全管理系统"
  tags: esafenet,infoleak
http:
  - raw:
      - |
        GET /solr/admin/cores HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - 'str name="instanceDir"'
          - 'str name="dataDir'
        condition: and
