id: alibaba-druid-monitor-unauth

info:
  name: Alibaba Druid Monitor - Unauthorized Access
  author: ohlinge
  severity: high
  description: Druid是阿里巴巴数据库出品的，为监控而生的数据库连接池，并且Druid提供的监控功能，监控SQL的执行时间、监控Web URI的请求、Session监控，当开发者配置不当时就可能造成未授权访问，攻击者可获取服务器敏感信息，session 等。
  metadata:
    verified: true
    fofa-query:
    repair: 配置访问账号密码
  tags: druid,alibaba,unauth,misconfig,alibaba-druid,ruoyi,metasoft

http:
  - raw:
      - |
        GET /druid/index.html HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Druid Stat Index</title>'

      - type: status
        status:
          - 200

