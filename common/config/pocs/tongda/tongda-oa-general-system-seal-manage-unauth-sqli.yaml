id: tongda-oa-general-system-seal-manage-unauth-sqli

info:
  name: 通达 OA 印章功能 - unauth sqli
  author: xy
  severity: high
  description: CVE-2023-4166
  reference:
    - https://blog.csdn.net/holyxp/article/details/132211748
  metadata:
    verified: true
    fofa-query: app="TDXK-通达OA" || icon_hash="-759108386"
    tips: 注入参数DELETE_STR，布尔、时间盲注
  tags: tongda,oa,sqli,2023

http:
  - raw:
      - |
        GET /general/system/seal_manage/{{path1}}?start= HTTP/1.1
        Host: {{Hostname}}
      
      - |
        GET /general/system/seal_manage/{{path2}}?DELETE_STR=1 HTTP/1.1
        Host: {{Hostname}}

    payloads:
      path1:
        - "dianju/log.php"
        - "iweboffice/manage.php"
      path2:
        - "dianju/delete_log.php"
        - "iweboffice/delete_seal.php"
    attack: pitchfork

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && contains((body_1), 'email_select')"
          - "status_code_2 == 302 && contains((header_2), '.php?start=')"
        condition: and