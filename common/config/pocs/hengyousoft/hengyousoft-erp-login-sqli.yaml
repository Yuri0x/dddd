id: hengyousoft-erp-login-sqli
info:
  name: 恒友摄影ERP的login.ashx存在SQL注入
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://github.com/eeeeeeeeee-code/POC/blob/main/wpoc/%E6%81%92%E5%8F%8B%E6%91%84%E5%BD%B1ERP/%E6%81%92%E5%8F%8B%E6%91%84%E5%BD%B1ERP%E7%9A%84login.ashx%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5.md
  classification:
    cve-id: 
  metadata:
    verified: true/false
    fofa-query: body="BookChooseDateOrder.html"
    tips:
    repair:
    version:
