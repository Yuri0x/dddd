id: apache-solr-unauth
info:
  name: poc-yaml-Apache-Solr-Admin-unauth
  author: leadlife
  severity: high
  description: 
  reference: 
    - demo
  classification:
    cve-id: 
  metadata:
    verified: true/false
    fofa-query: demo
  tags: apache,solr,unauth

http:
  - raw:
      - |
        GET /solr/admin/cores?indexInfo=false&wt=json HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'name','uptime')
        condition: and